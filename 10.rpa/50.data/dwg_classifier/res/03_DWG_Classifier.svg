<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E88E5"/>
      <stop offset="100%" style="stop-color:#0D47A1"/>
    </linearGradient>
    <linearGradient id="folderGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD54F"/>
      <stop offset="100%" style="stop-color:#FFA726"/>
    </linearGradient>
    <linearGradient id="folderGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#81C784"/>
      <stop offset="100%" style="stop-color:#4CAF50"/>
    </linearGradient>
    <linearGradient id="folderGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#64B5F6"/>
      <stop offset="100%" style="stop-color:#1976D2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0D47A1" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  
  <!-- Source Document -->
  <g>
    <rect x="60" y="160" width="140" height="180" rx="12" fill="#FFFFFF"/>
    <!-- DWG blueprint pattern -->
    <rect x="75" y="180" width="110" height="80" fill="#E3F2FD" rx="6"/>
    <line x1="85" y1="200" x2="135" y2="200" stroke="#1565C0" stroke-width="2"/>
    <line x1="85" y1="220" x2="160" y2="220" stroke="#1565C0" stroke-width="2"/>
    <circle cx="130" cy="235" r="15" fill="none" stroke="#1565C0" stroke-width="2"/>
    <rect x="95" y="245" width="30" height="10" fill="none" stroke="#1565C0" stroke-width="2"/>
    
    <!-- Multiple docs indicator -->
    <rect x="75" y="275" width="110" height="10" rx="3" fill="#BBDEFB"/>
    <rect x="75" y="295" width="80" height="10" rx="3" fill="#BBDEFB"/>
    <rect x="75" y="315" width="95" height="10" rx="3" fill="#BBDEFB"/>
  </g>
  
  <!-- Classification arrows (straight lines ending at arrowhead base center) -->
  <g stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round">
    <line x1="210" y1="220" x2="274" y2="156"/>
    <line x1="210" y1="250" x2="265" y2="250"/>
    <line x1="210" y1="280" x2="274" y2="344"/>
  </g>
  <!-- Arrow heads (all same size as #2, rotated 45° for #1 and #3) -->
  <g fill="#FFFFFF" stroke="none">
    <!-- Arrow 1: 45° up-right (same shape as #2, rotated) -->
    <polygon points="295,135 263,145 285,167"/>
    <!-- Arrow 2: horizontal (reference shape) -->
    <polygon points="295,250 265,235 265,265"/>
    <!-- Arrow 3: 45° down-right (same shape as #2, rotated) -->
    <polygon points="295,365 263,355 285,333"/>
  </g>
  
  <!-- Folder 1 - Machining -->
  <g transform="translate(300, 70)">
    <path d="M0 30 L0 110 Q0 120 10 120 L130 120 Q140 120 140 110 L140 30 Q140 20 130 20 L70 20 L60 10 L10 10 Q0 10 0 20 Z" fill="url(#folderGrad1)"/>
    <!-- Text area placeholder (uncomment when adding text)
    <rect x="15" y="45" width="110" height="60" rx="4" fill="#FFFFFF" opacity="0.9"/>
    -->
  </g>

  <!-- Folder 2 - Assembly -->
  <g transform="translate(315, 185)">
    <path d="M0 30 L0 110 Q0 120 10 120 L130 120 Q140 120 140 110 L140 30 Q140 20 130 20 L70 20 L60 10 L10 10 Q0 10 0 20 Z" fill="url(#folderGrad2)"/>
    <!-- Text area placeholder (uncomment when adding text)
    <rect x="15" y="45" width="110" height="60" rx="4" fill="#FFFFFF" opacity="0.9"/>
    -->
  </g>

  <!-- Folder 3 - Purchased -->
  <g transform="translate(300, 300)">
    <path d="M0 30 L0 110 Q0 120 10 120 L130 120 Q140 120 140 110 L140 30 Q140 20 130 20 L70 20 L60 10 L10 10 Q0 10 0 20 Z" fill="url(#folderGrad3)"/>
    <!-- Text area placeholder (uncomment when adding text)
    <rect x="15" y="45" width="110" height="60" rx="4" fill="#FFFFFF" opacity="0.9"/>
    -->
  </g>
</svg>
