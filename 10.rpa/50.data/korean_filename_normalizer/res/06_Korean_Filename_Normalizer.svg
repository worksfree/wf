<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E88E5"/>
      <stop offset="100%" style="stop-color:#0D47A1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E3F2FD"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0D47A1" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  
  <!-- Before card - broken Korean -->
  <g>
    <rect x="60" y="90" width="180" height="140" rx="16" fill="url(#cardGrad)"/>
    
    <!-- File icon -->
    <rect x="85" y="115" width="40" height="50" rx="4" fill="#FFCDD2"/>
    <polygon points="105,115 125,135 125,115" fill="#EF9A9A"/>
    
    <!-- Broken filename -->
    <text x="80" y="195" font-family="Arial, sans-serif" font-size="20" fill="#C62828" font-weight="bold">ㅎㅏㄴㄱㅡㄹ</text>
    <text x="80" y="218" font-family="Arial, sans-serif" font-size="14" fill="#EF5350">.sldprt</text>
    
    <!-- X mark for error -->
    <circle cx="205" cy="125" r="20" fill="#EF5350"/>
    <path d="M195 115 L215 135 M215 115 L195 135" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Transformation arrow -->
  <g transform="translate(230, 130)">
    <rect x="0" y="20" width="50" height="30" rx="8" fill="#FFFFFF"/>
    <path d="M10 35 L35 35 M28 25 L38 35 L28 45" stroke="#1565C0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- After card - fixed Korean -->
  <g>
    <rect x="272" y="90" width="180" height="140" rx="16" fill="url(#cardGrad)"/>
    
    <!-- File icon -->
    <rect x="297" y="115" width="40" height="50" rx="4" fill="#C8E6C9"/>
    <polygon points="317,115 337,135 337,115" fill="#A5D6A7"/>
    
    <!-- Fixed filename -->
    <text x="292" y="195" font-family="Arial, sans-serif" font-size="24" fill="#2E7D32" font-weight="bold">한글</text>
    <text x="292" y="218" font-family="Arial, sans-serif" font-size="14" fill="#4CAF50">.sldprt</text>
    
    <!-- Checkmark -->
    <circle cx="417" cy="125" r="20" fill="#4CAF50"/>
    <path d="M405 125 L413 133 L429 117" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Multiple files indicator -->
  <g transform="translate(100, 280)">
    <rect x="0" y="0" width="312" height="130" rx="16" fill="url(#cardGrad)"/>
    
    <!-- File list -->
    <g transform="translate(20, 20)">
      <!-- File 1 -->
      <rect x="0" y="0" width="24" height="28" rx="3" fill="#FFCDD2"/>
      <text x="32" y="20" font-family="Arial, sans-serif" font-size="14" fill="#C62828">ㄷㅗㅁㅕㄴ_001</text>
      <text x="160" y="20" font-family="Arial, sans-serif" font-size="14" fill="#1565C0">→</text>
      <text x="185" y="20" font-family="Arial, sans-serif" font-size="14" fill="#2E7D32" font-weight="bold">도면_001</text>
      
      <!-- File 2 -->
      <rect x="0" y="35" width="24" height="28" rx="3" fill="#FFCDD2"/>
      <text x="32" y="55" font-family="Arial, sans-serif" font-size="14" fill="#C62828">ㅂㅜㅍㅜㅁ_A</text>
      <text x="160" y="55" font-family="Arial, sans-serif" font-size="14" fill="#1565C0">→</text>
      <text x="185" y="55" font-family="Arial, sans-serif" font-size="14" fill="#2E7D32" font-weight="bold">부품_A</text>
      
      <!-- File 3 -->
      <rect x="0" y="70" width="24" height="28" rx="3" fill="#FFCDD2"/>
      <text x="32" y="90" font-family="Arial, sans-serif" font-size="14" fill="#C62828">ㅈㅗㄹㅣㅂ_v2</text>
      <text x="160" y="90" font-family="Arial, sans-serif" font-size="14" fill="#1565C0">→</text>
      <text x="185" y="90" font-family="Arial, sans-serif" font-size="14" fill="#2E7D32" font-weight="bold">조립_v2</text>
    </g>
  </g>
</svg>
