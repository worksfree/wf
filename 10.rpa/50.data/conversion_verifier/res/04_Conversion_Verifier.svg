<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E88E5"/>
      <stop offset="100%" style="stop-color:#0D47A1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0D47A1" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  
  <!-- Left List (SLDDRW) -->
  <g>
    <rect x="45" y="80" width="185" height="300" rx="14" fill="#FFFFFF"/>
    <!-- Header -->
    <rect x="45" y="80" width="185" height="40" rx="14" fill="#C62828"/>
    <rect x="45" y="105" width="185" height="15" fill="#C62828"/>
    
    <!-- List items -->
    <rect x="60" y="135" width="155" height="28" rx="6" fill="#FFEBEE"/>
    <rect x="70" y="143" width="80" height="12" rx="3" fill="#EF9A9A"/>
    
    <rect x="60" y="173" width="155" height="28" rx="6" fill="#FFEBEE"/>
    <rect x="70" y="181" width="100" height="12" rx="3" fill="#EF9A9A"/>
    
    <rect x="60" y="211" width="155" height="28" rx="6" fill="#FFEBEE"/>
    <rect x="70" y="219" width="70" height="12" rx="3" fill="#EF9A9A"/>
    
    <rect x="60" y="249" width="155" height="28" rx="6" fill="#FFEBEE"/>
    <rect x="70" y="257" width="90" height="12" rx="3" fill="#EF9A9A"/>
    
    <rect x="60" y="287" width="155" height="28" rx="6" fill="#FFEBEE"/>
    <rect x="70" y="295" width="60" height="12" rx="3" fill="#EF9A9A"/>
    
    <rect x="60" y="325" width="155" height="28" rx="6" fill="#FFEBEE"/>
    <rect x="70" y="333" width="110" height="12" rx="3" fill="#EF9A9A"/>
  </g>
  
  <!-- Right List (DWG) -->
  <g>
    <rect x="282" y="80" width="185" height="300" rx="14" fill="#FFFFFF"/>
    <!-- Header -->
    <rect x="282" y="80" width="185" height="40" rx="14" fill="#1565C0"/>
    <rect x="282" y="105" width="185" height="15" fill="#1565C0"/>
    
    <!-- List items (matching) -->
    <rect x="297" y="135" width="155" height="28" rx="6" fill="#E3F2FD"/>
    <rect x="307" y="143" width="80" height="12" rx="3" fill="#90CAF5"/>
    
    <rect x="297" y="173" width="155" height="28" rx="6" fill="#E3F2FD"/>
    <rect x="307" y="181" width="100" height="12" rx="3" fill="#90CAF5"/>
    
    <rect x="297" y="211" width="155" height="28" rx="6" fill="#E3F2FD"/>
    <rect x="307" y="219" width="70" height="12" rx="3" fill="#90CAF5"/>
    
    <rect x="297" y="249" width="155" height="28" rx="6" fill="#E3F2FD"/>
    <rect x="307" y="257" width="90" height="12" rx="3" fill="#90CAF5"/>
    
    <rect x="297" y="287" width="155" height="28" rx="6" fill="#E3F2FD"/>
    <rect x="307" y="295" width="60" height="12" rx="3" fill="#90CAF5"/>
    
    <rect x="297" y="325" width="155" height="28" rx="6" fill="#E3F2FD"/>
    <rect x="307" y="333" width="110" height="12" rx="3" fill="#90CAF5"/>
  </g>
  
  <!-- Comparison indicator (center) -->
  <g fill="#FFFFFF" opacity="0.9">
    <rect x="238" y="180" width="36" height="6" rx="3"/>
    <rect x="238" y="200" width="36" height="6" rx="3"/>
    <rect x="238" y="220" width="36" height="6" rx="3"/>
  </g>
  
  <!-- Verification checkmark badge -->
  <g>
    <circle cx="256" cy="420" r="55" fill="#FFFFFF"/>
    <circle cx="256" cy="420" r="42" fill="#4CAF50"/>
    <path d="M232 420 L250 438 L280 405" 
          stroke="#FFFFFF" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
  </g>
</svg>
