<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E88E5"/>
      <stop offset="100%" style="stop-color:#0D47A1"/>
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E3F2FD"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0D47A1" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  
  <!-- Spreadsheet Document -->
  <g>
    <rect x="100" y="80" width="220" height="280" rx="16" fill="url(#sheetGrad)"/>
    
    <!-- Table Grid -->
    <rect x="120" y="120" width="180" height="200" rx="8" fill="none" stroke="#1565C0" stroke-width="3"/>
    
    <!-- Horizontal Lines -->
    <line x1="120" y1="170" x2="300" y2="170" stroke="#1565C0" stroke-width="2"/>
    <line x1="120" y1="220" x2="300" y2="220" stroke="#1565C0" stroke-width="2"/>
    <line x1="120" y1="270" x2="300" y2="270" stroke="#1565C0" stroke-width="2"/>
    
    <!-- Vertical Lines -->
    <line x1="180" y1="120" x2="180" y2="320" stroke="#1565C0" stroke-width="2"/>
    <line x1="240" y1="120" x2="240" y2="320" stroke="#1565C0" stroke-width="2"/>
    
    <!-- Header cells highlight -->
    <rect x="122" y="122" width="56" height="46" fill="#BBDEFB" rx="4"/>
    <rect x="182" y="122" width="56" height="46" fill="#BBDEFB" rx="4"/>
    <rect x="242" y="122" width="56" height="46" fill="#BBDEFB" rx="4"/>
  </g>
  
  <!-- Export Arrow -->
  <g transform="translate(320, 260)">
    <circle cx="60" cy="60" r="70" fill="#FFFFFF" opacity="0.95"/>
    <path d="M30 60 L70 60 M55 40 L75 60 L55 80" 
          stroke="#1565C0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Excel indicator -->
  <rect x="355" y="380" width="80" height="50" rx="8" fill="#217346"/>
  <text x="395" y="415" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">XLSX</text>
</svg>
