<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E88E5"/>
      <stop offset="100%" style="stop-color:#0D47A1"/>
    </linearGradient>
    <linearGradient id="printerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E3F2FD"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0D47A1" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  
  <!-- Stacked Papers (behind) -->
  <g opacity="0.6">
    <rect x="125" y="55" width="180" height="120" rx="12" fill="#BBDEFB"/>
  </g>
  <g opacity="0.8">
    <rect x="110" y="70" width="180" height="120" rx="12" fill="#E3F2FD"/>
  </g>

  <!-- Main Printer Body -->
  <g>
    <!-- Printer housing -->
    <rect x="80" y="180" width="352" height="180" rx="24" fill="url(#printerGrad)"/>
    
    <!-- Top paper input -->
    <rect x="95" y="85" width="180" height="120" rx="12" fill="#FFFFFF"/>
    <line x1="115" y1="115" x2="255" y2="115" stroke="#90CAF5" stroke-width="4" stroke-linecap="round"/>
    <line x1="115" y1="140" x2="235" y2="140" stroke="#90CAF5" stroke-width="4" stroke-linecap="round"/>
    <line x1="115" y1="165" x2="220" y2="165" stroke="#90CAF5" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Printer slot -->
    <rect x="100" y="200" width="312" height="16" rx="8" fill="#1565C0"/>
    
    <!-- Control panel -->
    <rect x="320" y="250" width="90" height="60" rx="8" fill="#0D47A1"/>
    <circle cx="345" cy="280" r="12" fill="#4CAF50"/>
    <rect x="365" y="260" width="30" height="8" rx="4" fill="#64B5F6"/>
    <rect x="365" y="275" width="30" height="8" rx="4" fill="#64B5F6"/>
    <rect x="365" y="290" width="30" height="8" rx="4" fill="#64B5F6"/>
  </g>
  
  <!-- Output paper -->
  <rect x="130" y="340" width="180" height="100" rx="8" fill="#FFFFFF"/>
  <line x1="150" y1="370" x2="290" y2="370" stroke="#90CAF5" stroke-width="4" stroke-linecap="round"/>
  <line x1="150" y1="395" x2="270" y2="395" stroke="#90CAF5" stroke-width="4" stroke-linecap="round"/>
  <line x1="150" y1="420" x2="250" y2="420" stroke="#90CAF5" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Batch indicator badge -->
  <circle cx="400" cy="400" r="56" fill="#FFFFFF"/>
  <text x="400" y="415" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#1565C0" text-anchor="middle">3x</text>
</svg>
