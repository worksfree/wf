[pytest]
# Pytest 설정 파일

# 테스트 탐색 경로
testpaths = 90.tests

# 테스트 파일 패턴
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 마커 정의
markers =
    unit: 단위 테스트 - 개별 함수/클래스 테스트
    integration: 통합 테스트 - 여러 모듈 간 상호작용 테스트
    staging: 스테이징 테스트 - 전체 워크플로우 테스트 (실제 환경 시뮬레이션)
    sanity: 새니티 테스트 - 핵심 기능 생존여부 확인
    regression: 리그레션 테스트 - 과거 버그 재발 방지 시나리오
    interactive: 인터랙티브(UI) 테스트 - 사용자의 클릭 흐름 시뮬레이션
    static: 정적 분석 테스트 - 린트/타입 검사
    slow: 느린 테스트 (5초 이상)
    requires_google_sheets: Google Sheets API 필요
    requires_solidworks: SolidWorks 필요

# 출력 옵션
addopts = 
    -v
    --tb=short
    --strict-markers
    --color=yes
    -ra

# 테스트 탐색 시 무시할 경로
norecursedirs = 
    .git
    .venv
    venv
    env
    __pycache__
    *.egg-info
    build
    dist
    release
    backup
    70.publish

# Python 경로 설정 (10.common, 30.apps 등)
pythonpath = . 10.common

# 최소 Python 버전
minversion = 3.8

# 경고 필터
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 커버리지 옵션 (pytest-cov 사용 시)
# addopts = --cov=10.common --cov=30.apps --cov-report=html --cov-report=term-missing
