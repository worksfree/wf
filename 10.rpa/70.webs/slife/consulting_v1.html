<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기업 맞춤형 컨설팅 진단</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

  :root {
    --bg:       #f5f4f0;
    --surface:  #ffffff;
    --border:   #e2e0d8;
    --border2:  #cccab8;
    --text:     #1a1a18;
    --muted:    #6b6960;
    --hint:     #9e9c90;
    --blue-bg:  #e8f0fb;
    --blue:     #1a5fa8;
    --green-bg: #e6f4e8;
    --green:    #2a7a35;
    --amber-bg: #fdf3e0;
    --amber:    #9a6100;
    --red-bg:   #fceaea;
    --red:      #a02020;
    --purple-bg:#efedfd;
    --purple:   #4a3faa;
    --gray-bg:  #f0eeea;
    --gray:     #5a5850;
    --accent:   #1a5fa8;
    --radius:   10px;
    --radius-lg:16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--text);
  }
  .logo span { color: var(--accent); }
  .header-right {
    font-size: 12px;
    color: var(--hint);
  }

  /* ── LAYOUT ── */
  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ── PROGRESS ── */
  .progress-wrap {
    margin-bottom: 24px;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--hint);
    margin-bottom: 8px;
  }
  .progress-track {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
  }

  /* ── BREADCRUMB ── */
  .breadcrumb {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    min-height: 28px;
    margin-bottom: 20px;
    align-items: center;
  }
  .crumb {
    font-size: 11px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 3px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .crumb-sep {
    color: var(--hint);
    font-size: 12px;
    line-height: 1;
  }

  /* ── QUESTION CARD ── */
  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px;
    margin-bottom: 12px;
    animation: fadeUp .25s ease;
  }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(8px); }
    to   { opacity:1; transform: translateY(0); }
  }
  .q-step {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .q-text {
    font-size: 18px;
    font-weight: 500;
    line-height: 1.5;
    margin-bottom: 24px;
    letter-spacing: -0.3px;
  }
  .q-sub {
    font-size: 13px;
    color: var(--muted);
    margin-top: -18px;
    margin-bottom: 22px;
  }

  /* ── OPTIONS ── */
  .options { display: flex; flex-direction: column; gap: 8px; }

  .opt-btn {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    font-weight: 400;
    color: var(--text);
    text-align: left;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    transition: border-color .15s, background .15s, transform .1s;
    line-height: 1.5;
  }
  .opt-btn:hover {
    border-color: var(--accent);
    background: var(--blue-bg);
    transform: translateX(3px);
  }
  .opt-btn:active { transform: translateX(2px) scale(0.99); }

  .opt-label { flex: 1; }
  .opt-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .opt-tag {
    font-size: 11px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .opt-arrow {
    color: var(--hint);
    font-size: 18px;
    flex-shrink: 0;
    transition: transform .15s;
  }
  .opt-btn:hover .opt-arrow { transform: translateX(2px); color: var(--accent); }

  .tag-blue   { background: var(--blue-bg);   color: var(--blue); }
  .tag-green  { background: var(--green-bg);  color: var(--green); }
  .tag-amber  { background: var(--amber-bg);  color: var(--amber); }
  .tag-red    { background: var(--red-bg);    color: var(--red); }
  .tag-purple { background: var(--purple-bg); color: var(--purple); }
  .tag-gray   { background: var(--gray-bg);   color: var(--gray); }

  /* ── BACK BUTTON ── */
  .back-btn {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 16px;
    transition: color .15s;
  }
  .back-btn:hover { color: var(--text); }
  .back-btn svg { width: 14px; height: 14px; }

  /* ── RESULT PAGE ── */
  .result-wrap { animation: fadeUp .3s ease; }

  .result-hero {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px;
    margin-bottom: 16px;
    border-top: 4px solid var(--accent);
  }
  .result-badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .5px;
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 14px;
  }
  .result-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }
  .result-desc {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 18px;
  }
  .flag-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .flag {
    font-size: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 3px 12px;
    border-radius: 20px;
  }

  /* ── ROADMAP ── */
  .roadmap-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    margin-bottom: 16px;
  }
  .roadmap-header {
    padding: 16px 24px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: .5px;
    text-transform: uppercase;
  }
  .phase {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 16px;
  }
  .phase:last-child { border-bottom: none; }
  .phase-num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .phase-body { flex: 1; }
  .phase-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 10px;
    letter-spacing: -0.2px;
  }
  .phase-items { display: flex; flex-direction: column; gap: 7px; }
  .phase-item {
    font-size: 13.5px;
    color: var(--muted);
    display: flex;
    gap: 8px;
    align-items: flex-start;
    line-height: 1.55;
  }
  .pi-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--border2);
    margin-top: 7px;
    flex-shrink: 0;
  }

  /* ── ALERT BOXES ── */
  .alert {
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 16px;
    font-size: 13.5px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    border: 1px solid;
  }
  .alert-amber { background: var(--amber-bg); border-color: #e8c060; color: var(--amber); }
  .alert-red   { background: var(--red-bg);   border-color: #e8a0a0; color: var(--red); }
  .alert-blue  { background: var(--blue-bg);  border-color: #90b8e8; color: var(--blue); }
  .alert-icon  { font-size: 16px; flex-shrink:0; margin-top:1px; }

  /* ── ACTION BUTTONS ── */
  .action-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn-primary {
    flex: 1;
    min-width: 160px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 13px 20px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .btn-primary:hover { background: #154d8a; }
  .btn-primary:active { transform: scale(0.98); }

  .btn-ghost {
    background: var(--surface);
    color: var(--muted);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 20px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
    white-space: nowrap;
  }
  .btn-ghost:hover { border-color: var(--border2); color: var(--text); }

  /* ── PRINT ── */
  @media print {
    header { position: static; }
    .no-print { display: none !important; }
    .q-card, .result-hero, .roadmap-card, .alert { page-break-inside: avoid; }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 480px) {
    .page { padding: 20px 14px 48px; }
    .q-card { padding: 20px; }
    .q-text { font-size: 16px; }
    .result-title { font-size: 18px; }
    .phase { padding: 16px 18px; gap: 12px; }
    .action-row { flex-direction: column; }
    .btn-primary { min-width: unset; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">GFC<span>·</span>기업 컨설팅 진단</div>
  <div class="header-right" id="hdr-step"></div>
</header>

<div class="page">
  <div class="progress-wrap">
    <div class="progress-meta">
      <span id="prog-label">진단 시작</span>
      <span id="prog-pct">0%</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="view"></div>
</div>

<script>
/* ═══════════════════════════════════════════
   진단 트리 데이터
═══════════════════════════════════════════ */
const TREE = [
  {
    id: 'start',
    step: '진단 항목 1',
    q: '사업자 형태를 선택해주세요',
    sub: '법인 또는 개인사업자 여부로 컨설팅 방향이 결정됩니다',
    opts: [
      { t: '개인사업자', sub: '프리랜서, 1인 사업자 포함', tag: null, tagClass: null, next: 'indiv_rev' },
      { t: '법인 (주식회사, 유한회사 등)', sub: '법인등기부가 존재하는 경우', tag: null, tagClass: null, next: 'corp_age' },
    ]
  },
  {
    id: 'indiv_rev',
    step: '진단 항목 2',
    q: '연간 매출 규모는 어느 정도입니까?',
    sub: '성실신고 기준(7.5억)에 따라 컨설팅 방향이 달라집니다',
    opts: [
      { t: '7.5억 미만', sub: '일반 개인사업자', tag: '일반', tagClass: 'tag-gray', next: 'result', data: { type: 'indiv_A' } },
      { t: '7.5억 이상 ~ 30억 미만', sub: '성실신고확인 의무 대상', tag: '성실신고', tagClass: 'tag-amber', next: 'result', data: { type: 'indiv_B' } },
      { t: '30억 이상', sub: '법인전환 검토가 시급한 구간', tag: '법인전환 검토 필수', tagClass: 'tag-red', next: 'result', data: { type: 'indiv_C' } },
    ]
  },
  {
    id: 'corp_age',
    step: '진단 항목 2',
    q: '법인 설립 후 경과 연수는?',
    sub: '설립 연수에 따라 주식가치 평가 방식 및 절세 전략이 달라집니다',
    opts: [
      { t: '2년 미만', sub: '신설법인 — 액면가 주식가치 적용 구간', tag: '신설법인', tagClass: 'tag-green', next: 'corp_size', data: { age: '신설법인', ageKey: 'new' } },
      { t: '2년 ~ 5년', sub: '성장기 — 순이익 가치평가 전환 시점', tag: '성장기', tagClass: 'tag-blue', next: 'corp_size', data: { age: '성장기', ageKey: 'grow' } },
      { t: '5년 이상', sub: '안정기 — 퇴직금·승계 플랜 가동 구간', tag: '안정기', tagClass: 'tag-purple', next: 'corp_size', data: { age: '안정기', ageKey: 'stable' } },
    ]
  },
  {
    id: 'corp_size',
    step: '진단 항목 3',
    q: '연간 매출 규모는?',
    sub: '매출 구간별로 A·B·C 그룹으로 분류되어 맞춤 전략이 적용됩니다',
    opts: [
      { t: '50억 미만', sub: 'A그룹 — 소규모 법인', tag: 'A그룹', tagClass: 'tag-blue', next: 'corp_emp', data: { size: 'A', sizeLabel: '50억 미만' } },
      { t: '50억 이상 ~ 100억 미만', sub: 'B그룹 — 중소법인', tag: 'B그룹', tagClass: 'tag-amber', next: 'corp_emp', data: { size: 'B', sizeLabel: '50~100억' } },
      { t: '100억 이상', sub: 'C그룹 — 중견법인', tag: 'C그룹', tagClass: 'tag-purple', next: 'corp_emp', data: { size: 'C', sizeLabel: '100억 이상' } },
    ]
  },
  {
    id: 'corp_emp',
    step: '진단 항목 4',
    q: '임직원 수는 몇 명입니까?',
    sub: '임직원 수에 따라 단체보험 설계 구조 및 월 보험료 산정이 달라집니다',
    opts: [
      { t: '5인 미만', sub: null, tag: null, tagClass: null, next: 'corp_ins', data: { emp: '5인 미만', empKey: 'tiny' } },
      { t: '5인 이상 ~ 30인 미만', sub: null, tag: null, tagClass: null, next: 'corp_ins', data: { emp: '5~30인', empKey: 'small' } },
      { t: '30인 이상', sub: null, tag: null, tagClass: null, next: 'corp_ins', data: { emp: '30인 이상', empKey: 'mid' } },
    ]
  },
  {
    id: 'corp_ins',
    step: '진단 항목 5',
    q: '현재 단체보험 가입 현황은?',
    sub: null,
    opts: [
      { t: '전혀 없음', sub: '단체 재해보장보험 신규 설계 대상', tag: '신규 설계', tagClass: 'tag-blue', next: 'corp_risk', data: { ins: '미가입', insKey: 'none' } },
      { t: '일부 가입 (보장 미흡)', sub: '보장 분석 후 업그레이드 설계 대상', tag: '비교 분석', tagClass: 'tag-amber', next: 'corp_risk', data: { ins: '일부가입', insKey: 'partial' } },
      { t: '단체보험 완비', sub: '추가 법인보험·경영인 플랜 검토 대상', tag: '추가 컨설팅', tagClass: 'tag-green', next: 'corp_risk', data: { ins: '완비', insKey: 'full' } },
    ]
  },
  {
    id: 'corp_risk',
    step: '진단 항목 6',
    q: '재무 리스크 이슈가 있습니까?',
    sub: '가수금·가지급금 문제는 세무조사 시 과세 대상이 될 수 있어 우선 점검이 필요합니다',
    opts: [
      { t: '가수금 또는 가지급금 문제 있음', sub: '재무제표에 가수금·가지급금 잔액 존재', tag: '긴급 점검', tagClass: 'tag-red', next: 'result', data: { risk: '재무리스크', riskKey: 'high' } },
      { t: '특별한 재무 이슈 없음', sub: null, tag: '일반', tagClass: 'tag-gray', next: 'result', data: { risk: '없음', riskKey: 'none' } },
    ]
  },
];

/* ═══════════════════════════════════════════
   결과 데이터 생성기
═══════════════════════════════════════════ */
function buildResult(c) {
  /* ── 개인사업자 결과 ── */
  if (c.type === 'indiv_A') return {
    badge: '개인사업자 · 일반',
    badgeClass: 'tag-gray',
    accentColor: '#5F5E5A',
    title: '개인사업자 기초 보장 컨설팅',
    desc: '연매출 7.5억 미만의 일반 개인사업자를 위한 리스크 보장 및 절세 플랜입니다.',

      { type: 'blue', icon: 'ℹ', text: '매출이 7.5억에 근접하면 성실신고확인 대상이 됩니다. 미리 법인전환 시뮬레이션을 준비하세요.' }
    ],
    phases: [
      {
        n: 1, color: '#e8f0fb', textColor: '#1a5fa8', title: '리스크 진단',
        items: ['대표자 상해·사망 보장 현황 점검', '노란우산공제 가입 여부 확인 (최대 월 300만원 소득공제)', '사업장 화재·배상책임 리스크 파악']
      },
      {
        n: 2, color: '#e6f4e8', textColor: '#2a7a35', title: '보장 설계',
        items: ['대표자 정기보험 + 상해보험 병행 설계', '사업자 배상책임보험 연결 제안', '실손·건강보험 갱신 여부 점검']
      },
      {
        n: 3, color: '#fdf3e0', textColor: '#9a6100', title: '절세 방안',
        items: ['노란우산공제 최대 납입 활용', '비용처리 가능 보험료 항목 정리', '매출 7.5억 접근 시 법인전환 검토 시점 사전 안내']
      }
    ]
  };

  if (c.type === 'indiv_B') return {
    badge: '개인사업자 · 성실신고 대상',
    badgeClass: 'tag-amber',
    accentColor: '#9a6100',
    title: '성실신고 대상 — 법인전환 검토 컨설팅',

  if (size === 'B') return {

    badgeClass: 'tag-amber',
    accentColor: '#9a6100',
    title: '중소법인 종합 컨설팅',

    alerts: riskKey === 'high' ? [
      { type: 'red', icon: '🚨', text: '가수금·가지급금 이슈가 있습니다. 규모가 클수록 과세 금액이 크므로 즉시 상계 처리 플랜을 우선 수립하세요.' }
    ] : [],
    phases: [
      {
        n: 1, color: '#fdf3e0', textColor: '#9a6100', title: '재무·리스크 진단',
        items: [
          riskKey === 'high' ? '가수금·가지급금 우선 상계처리 플랜 수립' : '재무제표 기반 리스크 포인트 스캔',
          '한신평 기업신용 조회 + 업종별 리스크 비교 분석',
          insKey === 'none' ? '단체보험 전면 신규 설계 (재해+건강 패키지)' : '보유 보험 비용효율 비교분석 + 이관 설계'
        ]
      },
      {
        n: 2, color: '#efedfd', textColor: '#4a3faa', title: '경영진 보호 플랜',
        items: [
          '경영인정기보험 설계 (비용처리 + 15년차 환급률 100% 구조)',
          '임원 퇴직금 재원 운용 플랜 (명의변경 전략 포함)',
          ageKey === 'stable' ? '배당 vs 급여 vs 보험 절세 시나리오 비교 분석' : '성장기 현금흐름 최적화 보험 구조 설계'
        ]
      },
      {
        n: 3, color: '#e6f4e8', textColor: '#2a7a35', title: '임직원 복지 확대',
        items: [
          empKey === 'mid' ? '단체보험 재해+건강 분리 설계 (다음달 체결로 1% 할인 적용)' : '전직원 단체보험 일괄 커버리지 확대',
          '퇴직연금 연계 가능성 검토',
          '계약 후 릴레이션십 관리 + 추가 계약 연간 로드맵 수립'
        ]
      }
    ]
  };

  return {

    title: '중견법인 프리미엄 컨설팅',
    desc: `${c.age || ''} 중견법인을 위한 오너 플랜·단체보험 포트폴리오·승계 전략 통합 로드맵입니다.`,
    alerts: [

      { type: 'amber', icon: '⚠', text: '고액 계약 시 릴레이션십 구축 후 계약을 진행하세요. 컨설팅 제공 후 관계가 충분히 형성된 시점에 청약을 진행하는 것이 이탈을 방지합니다.' }
    ].filter(Boolean),
    phases: [
      {
        n: 1, color: '#efedfd', textColor: '#4a3faa', title: '종합 기업진단',
        items: [
          '업종·재무 데이터 기반 리스크 맵 작성 (한신평 신용등급 포함)',
          riskKey === 'high' ? '가수금·가지급금 + 비상장주식 가치 절감 전략 병행' : '자본구조 최적화 및 법인세 절감 시뮬레이션',
          '업계 벤치마크 비교 보고서 제작'
        ]
      },

        n: 2, color: '#fceaea', textColor: '#a02020', title: '오너·경영진 플랜',
        items: [

          '비상장주식 가치 평가 + 경영권 승계 로드맵'
        ]
      },
      {
        n: 3, color: '#e6f4e8', textColor: '#2a7a35', title: '단체·법인보험 포트폴리오',
        items: [
          empKey === 'mid' ? '대규모 단체보험 월별 분산 계약 (프리미엄 분산 설계)' : '핵심 임직원 보장 집중 설계',
          '법인 화재·배상책임·기업휴지보험 종합 점검',
          '계약 포트폴리오 연간 리뷰 체계 구축 + 담당 FC 전담 배치'
        ]
      }
    ]

/* ═══════════════════════════════════════════
   앱 상태
═══════════════════════════════════════════ */
let stack = [];       // { nodeId, optIdx, answer, data }
let collected = {};   // 누적 데이터
const TOTAL_STEPS = 6;

/* ═══════════════════════════════════════════
   렌더러
═══════════════════════════════════════════ */
function render(nodeId) {
  updateProgress(nodeId);
  updateBreadcrumb();

  if (nodeId === 'result') { renderResult(); return; }

  const node = TREE.find(n => n.id === nodeId);
  const view = document.getElementById('view');
  view.innerHTML = `
    ${stack.length > 0 ? `<button class="back-btn no-print" onclick="goBack()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3L5 8L10 13"/></svg>
      이전 항목으로
    </button>` : ''}
    <div class="q-card">
      <div class="q-step">${node.step}</div>
      <div class="q-text">${node.q}</div>
      ${node.sub ? `<div class="q-sub">${node.sub}</div>` : ''}
      <div class="options">
        ${node.opts.map((o, i) => `
          <button class="opt-btn" onclick="selectOpt('${nodeId}', ${i})">
            <div class="opt-label">
              <div>${o.t}</div>
              ${o.sub ? `<div class="opt-sub">${o.sub}</div>` : ''}
            </div>
            ${o.tag ? `<span class="opt-tag ${o.tagClass}">${o.tag}</span>` : `<span class="opt-arrow">›</span>`}
          </button>
        `).join('')}
      </div>
    </div>
  `;
}

function renderResult() {
  const r = buildResult(collected);
  const view = document.getElementById('view');

  const alertsHtml = (r.alerts || []).map(a => `
    <div class="alert alert-${a.type}">
      <span class="alert-icon">${a.icon}</span>
      <span>${a.text}</span>
    </div>
  `).join('');

  const flagsHtml = Object.entries({
    '사업자 형태': collected.type ? (collected.type.startsWith('indiv') ? '개인사업자' : '법인') : '법인',
    '설립 연수': collected.age,
    '매출 규모': collected.sizeLabel,
    '임직원 수': collected.emp,
    '단체보험': collected.ins,
    '재무 리스크': collected.risk,
  }).filter(([,v]) => v).map(([k, v]) => `<span class="flag">${k}: ${v}</span>`).join('');

  const phasesHtml = r.phases.map(p => `
    <div class="phase">
      <div class="phase-num" style="background:${p.color};color:${p.textColor}">${p.n}</div>
      <div class="phase-body">
        <div class="phase-title" style="color:${p.textColor}">${p.title}</div>
        <div class="phase-items">
          ${p.items.map(item => `
            <div class="phase-item">
              <div class="pi-dot"></div>
              <span>${item}</span>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `).join('');

  view.innerHTML = `
    <div class="result-wrap">
      <button class="back-btn no-print" onclick="goBack()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3L5 8L10 13"/></svg>
        이전 항목으로
      </button>

      <div class="result-hero" style="border-top-color:${r.accentColor}">
        <div class="result-badge ${r.badgeClass}">${r.badge}</div>
        <div class="result-title">${r.title}</div>
        <div class="result-desc">${r.desc}</div>
        <div class="flag-row">${flagsHtml}</div>
      </div>

      ${alertsHtml}

      <div class="roadmap-card">
        <div class="roadmap-header">맞춤형 컨설팅 로드맵</div>
        ${phasesHtml}
      </div>

      <div class="action-row no-print">
        <button class="btn-primary" onclick="window.print()">📄 결과 인쇄 / PDF 저장</button>
        <button class="btn-ghost" onclick="restart()">↺ 처음부터 다시 진단</button>
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════
   진행 상태
═══════════════════════════════════════════ */
function updateProgress(nodeId) {
  const isResult = nodeId === 'result';
  const pct = isResult ? 100 : Math.round((stack.length / TOTAL_STEPS) * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('prog-label').textContent = isResult ? '진단 완료' : `진단 항목 ${stack.length + 1} / ${TOTAL_STEPS}`;
  document.getElementById('hdr-step').textContent = isResult ? '결과 확인' : `${stack.length + 1}/${TOTAL_STEPS}`;
}

function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  if (!stack.length) { bc.innerHTML = ''; return; }
  bc.innerHTML = stack.map((s, i) =>
    `<span class="crumb">${s.answer}</span>${i < stack.length - 1 ? '<span class="crumb-sep">›</span>' : ''}`
  ).join('');
}

/* ═══════════════════════════════════════════
   액션 핸들러
═══════════════════════════════════════════ */
function selectOpt(nodeId, optIdx) {
  const node = TREE.find(n => n.id === nodeId);
  const opt = node.opts[optIdx];
  stack.push({ nodeId, optIdx, answer: opt.t, data: opt.data || {} });
  if (opt.data) Object.assign(collected, opt.data);
  render(opt.next);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goBack() {
  if (!stack.length) return;
  const prev = stack.pop();
  // 수집 데이터 재구성
  collected = {};
  stack.forEach(s => { if (s.data) Object.assign(collected, s.data); });
  render(prev.nodeId);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restart() {
  stack = [];
  collected = {};
  render('start');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ═══════════════════════════════════════════
   초기 진입
═══════════════════════════════════════════ */
render('start');
</script>
