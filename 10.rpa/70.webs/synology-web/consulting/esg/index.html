<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESG 자가진단 — WorksFree</title>
<meta name="description" content="기업 환경·사회·지배구조(ESG) 수준을 스스로 점검하는 자가진단 도구. 10분 안에 ESG 등급 확인 및 개선 포인트 파악. WorksFree 컨설팅 플랫폼 제공.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://www.worksfree.kr/consulting/esg/">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap');
:root{
  --bg:#0f1117;--panel:#1c2333;--panel2:#212d40;--border:#2a3347;
  --text:#e2e8f0;--muted:#a8bdd1;--accent:#10b981;
  --E:#10b981;--S:#3b82f6;--G:#a855f7;
  --yes:#10b981;--no:#ef4444;--na:#64748b;--none:#2a3347;
  --radius:8px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'IBM Plex Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;}

/* ── top bar ── */
.topbar{position:sticky;top:0;z-index:100;background:var(--panel);border-bottom:1px solid var(--border);
  padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.topbar h1{font-size:16px;font-weight:600;flex:1;white-space:nowrap;}
.topbar small{color:var(--muted);font-size:12px;}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:500;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);border-color:var(--text);}
.btn-danger{background:transparent;color:#ef4444;border:1px solid #ef4444;}
.btn-danger:hover{background:#ef444420;}

/* ── score dashboard ── */
.dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;padding:16px 20px;background:var(--panel);border-bottom:1px solid var(--border);}
.score-card{background:var(--panel2);border-radius:var(--radius);padding:14px 16px;border:1px solid var(--border);}
.score-card .label{font-size:12px;color:var(--muted);margin-bottom:6px;}
.score-card .value{font-size:28px;font-weight:600;}
.score-card .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.bar{height:4px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden;}
.bar-fill{height:100%;border-radius:2px;transition:width .4s;}
.color-E{color:var(--E);} .fill-E{background:var(--E);}
.color-S{color:var(--S);} .fill-S{background:var(--S);}
.color-G{color:var(--G);} .fill-G{background:var(--G);}
.color-total{color:var(--accent);}

/* ── tabs ── */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 20px;background:var(--panel);}
.tab{padding:10px 20px;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .2s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--text);border-bottom-color:currentColor;}
.tab[data-tab="E"].active{color:var(--E);}
.tab[data-tab="S"].active{color:var(--S);}
.tab[data-tab="G"].active{color:var(--G);}

/* ── content area ── */
.content{padding:20px;max-width:900px;margin:0 auto;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ── section header ── */
.section-label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin:24px 0 8px;padding-left:4px;}
.section-label:first-child{margin-top:0;}

/* ── indicator card ── */
.ind-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;}
.ind-head{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;user-select:none;}
.ind-head:hover{background:var(--panel2);}
.ind-num{font-size:12px;font-weight:600;color:var(--muted);min-width:44px;}
.ind-name{flex:1;font-weight:500;font-size:14px;}
.badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;letter-spacing:.04em;}
.badge-common{background:#1e3a2f;color:#6ee7b7;}
.badge-industry{background:#1e2d4a;color:#93c5fd;}
.ind-result{font-size:12px;font-weight:600;padding:3px 10px;border-radius:10px;min-width:52px;text-align:center;}
.result-pass{background:#0d2620;color:#34d399;}
.result-fail{background:#2d1515;color:#f87171;}
.result-na{background:#1f2937;color:#9ca3af;}
.result-pending{background:#1c2333;color:#64748b;}
.chevron{font-size:12px;color:var(--muted);transition:transform .2s;margin-left:4px;}
.ind-card.open .chevron{transform:rotate(180deg);}

/* ── indicator body ── */
.ind-body{display:none;padding:0 16px 16px;border-top:1px solid var(--border);}
.ind-card.open .ind-body{display:block;}
.na-all-row{display:flex;align-items:center;gap:10px;padding:10px 0 6px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.na-all-row label{font-size:12px;color:var(--muted);}
.toggle{position:relative;width:36px;height:20px;cursor:pointer;}
.toggle input{opacity:0;width:0;height:0;position:absolute;}
.slider{position:absolute;inset:0;background:var(--border);border-radius:10px;transition:.2s;}
.slider::before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:#9ca3af;border-radius:50%;transition:.2s;}
.toggle input:checked+.slider{background:#374151;}
.toggle input:checked+.slider::before{transform:translateX(16px);background:#6b7280;}

/* ── check items ── */
.item-row{display:flex;align-items:flex-start;gap:12px;padding:7px 0;border-bottom:1px solid #1a2235;}
.item-row:last-child{border-bottom:none;}
.item-type{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;min-width:30px;text-align:center;margin-top:2px;flex-shrink:0;}
.type-p{background:#0c2640;color:#60a5fa;}
.type-b{background:#1a2535;color:#94a3b8;}
.type-c{background:#1a1a2e;color:#7c3aed;}
.item-text{flex:1;font-size:13px;color:var(--text);}
.item-text.na-text{color:var(--muted);text-decoration:line-through;}
.pill-group{display:flex;gap:4px;flex-shrink:0;margin-top:1px;}
.pill{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);transition:.15s;white-space:nowrap;}
.pill:hover{border-color:var(--text);color:var(--text);}
.pill.active-yes{background:#0d2620;border-color:var(--yes);color:#34d399;}
.pill.active-no{background:#2d1515;border-color:var(--no);color:#f87171;}
.pill.active-na{background:#1f2937;border-color:#4b5563;color:#9ca3af;}
.pill:disabled,.pill[disabled]{opacity:.3;cursor:default;pointer-events:none;}

/* ── 업종 배너 ── */
.industry-bar{
  background:#0a1120;border-bottom:1px solid var(--border);
  padding:9px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;
}
.ib-empty{color:var(--muted);flex:1;}
.ib-name{font-weight:600;color:var(--text);}
.ib-chip{font-size:11px;padding:2px 8px;border-radius:8px;white-space:nowrap;}
.ib-chip-apply{background:#0a2a1f;color:#6ee7b7;}
.ib-chip-excl{background:#1f2937;color:#6b7280;}
.btn-xs{padding:3px 10px;font-size:11px;border-radius:5px;cursor:pointer;font-family:inherit;font-weight:500;border:none;}
.btn-xs-accent{background:var(--accent);color:#fff;}
.btn-xs-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-xs-ghost:hover{color:var(--text);}
.btn-xs-danger{background:transparent;color:#ef4444;border:1px solid #ef444460;}
.btn-xs-danger:hover{background:#ef444415;}

/* ── 업종 선택 패널 ── */
.ig-panel{background:#0d1623;border-bottom:2px solid var(--accent);padding:18px 20px;display:none;}
.ig-panel.open{display:block;}
.ig-panel-hdr{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.ig-panel-title{font-size:14px;font-weight:600;}
.ig-panel-sub{font-size:12px;color:var(--muted);}
.ig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:10px;}
.ig-card{
  background:var(--panel2);border:2px solid var(--border);border-radius:var(--radius);
  padding:14px;cursor:pointer;transition:border-color .15s,background .15s;
}
.ig-card:hover{border-color:#3b4f70;background:#1e2d42;}
.ig-card.ig-selected{border-color:var(--accent);background:#061a12;}
.ig-card-icon{font-size:22px;margin-bottom:8px;}
.ig-card-name{font-size:13px;font-weight:600;margin-bottom:3px;}
.ig-card-desc{font-size:12px;color:var(--muted);line-height:1.4;margin-bottom:10px;min-height:30px;}
.ig-card-chips{display:flex;gap:6px;flex-wrap:wrap;}
.ig-chip-s{font-size:10px;padding:2px 7px;border-radius:7px;}
.ig-chip-s-apply{background:#0a2a1f;color:#6ee7b7;}
.ig-chip-s-excl{background:#1f2937;color:#6b7280;}
.ig-panel-foot{margin-top:14px;display:flex;gap:8px;justify-content:flex-end;}

/* ── 열외 지표 카드 ── */
.badge-excluded{background:#1a1f2e;color:#4b5563;}
.ind-card.ind-excluded{opacity:0.45;}
.ind-card.ind-excluded .ind-head{background:transparent!important;cursor:default;}
.ind-excl-body{
  padding:12px 0 4px;display:flex;align-items:center;gap:8px;
  font-size:12px;color:var(--muted);
}

/* ── preview restrictions ── */
.tab.preview-disabled { opacity:.35; cursor:not-allowed; pointer-events:none; }

/* ── 보고서 생성 바 ── */
.report-bar{background:#0a1120;border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;}
.rb-label{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;}
.rb-select{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 10px;font-size:12px;font-family:inherit;cursor:pointer;}
.rb-select:focus{outline:none;border-color:var(--accent);}
.rb-spacer{flex:1;}

/* ── ESG 보고서 오버레이 ── */
.esg-report{display:none;position:fixed;inset:0;background:#fff;z-index:200;overflow-y:auto;font-family:'IBM Plex Sans KR',sans-serif;color:#111;font-size:14px;line-height:1.6;}
.esg-report.open{display:block;}
.er-topbar{position:sticky;top:0;background:#fff;border-bottom:2px solid #e5e7eb;padding:12px 24px;display:flex;align-items:center;gap:12px;z-index:10;}
.er-topbar h2{font-size:16px;font-weight:700;flex:1;}
.er-btn{padding:7px 18px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;}
.er-btn-print{background:#10b981;color:#fff;}
.er-btn-close{background:#f3f4f6;color:#374151;border:1px solid #d1d5db;}
.er-body{max-width:800px;margin:0 auto;padding:24px 24px 60px;}
.er-header{text-align:center;padding:20px 0 32px;border-bottom:2px solid #111;margin-bottom:28px;}
.er-header h1{font-size:22px;font-weight:700;margin-bottom:8px;}
.er-header-meta{font-size:13px;color:#6b7280;}
.er-section{margin-bottom:32px;}
.er-hd{font-size:15px;font-weight:700;border-left:4px solid #10b981;padding-left:12px;margin-bottom:14px;}
.er-score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px;}
@media(max-width:640px){.er-score-grid{grid-template-columns:1fr 1fr;}}
.er-score-card{border:1px solid #e5e7eb;border-radius:8px;padding:14px;text-align:center;}
.er-score-label{font-size:11px;font-weight:600;color:#6b7280;margin-bottom:4px;}
.er-score-val{font-size:28px;font-weight:700;}
.er-score-sub{font-size:11px;color:#9ca3af;margin-top:3px;}
.er-fail-section{margin-bottom:12px;}
.er-fail-hd{font-size:13px;font-weight:700;color:#dc2626;margin-bottom:6px;padding:4px 0;border-bottom:1px solid #fee2e2;}
.er-fail-item{font-size:12px;padding:4px 8px;display:flex;gap:8px;align-items:baseline;}
.er-fail-item:nth-child(even){background:#fff5f5;}
.er-fail-id{font-size:11px;font-weight:600;color:#dc2626;min-width:40px;}
.er-penalty-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
@media(max-width:540px){.er-penalty-grid{grid-template-columns:1fr;}}
.er-penalty-card{border-radius:8px;padding:16px;}
.er-penalty-card-red{background:#fff1f2;border:1px solid #fecdd3;}
.er-penalty-card-green{background:#f0fdf4;border:1px solid #bbf7d0;}
.er-penalty-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.er-penalty-label-red{color:#dc2626;}
.er-penalty-label-green{color:#16a34a;}
.er-penalty-val{font-size:22px;font-weight:700;margin-bottom:4px;}
.er-penalty-sub{font-size:11.5px;color:#6b7280;line-height:1.5;}
.er-law-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:12px;}
.er-law-table th{background:#f9fafb;padding:6px 10px;text-align:left;font-weight:600;border:1px solid #e5e7eb;}
.er-law-table td{padding:6px 10px;border:1px solid #e5e7eb;}
.er-law-table tr:nth-child(even) td{background:#f9fafb;}
.er-gov-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:540px){.er-gov-grid{grid-template-columns:1fr;}}
.er-gov-item{border:1px solid #e5e7eb;border-left:3px solid #10b981;border-radius:8px;padding:12px 14px;}
.er-gov-type{font-size:10px;font-weight:700;color:#059669;margin-bottom:3px;}
.er-gov-name{font-size:13px;font-weight:600;margin-bottom:3px;}
.er-gov-desc{font-size:11.5px;color:#6b7280;line-height:1.4;}
.er-risk-list{display:flex;flex-direction:column;gap:8px;}
.er-risk-item{background:#f9fafb;border-radius:8px;padding:14px 16px;border:1px solid #e5e7eb;}
.er-risk-item-hd{font-size:13px;font-weight:700;margin-bottom:4px;}
.er-risk-item-body{font-size:12.5px;color:#4b5563;line-height:1.5;}
.er-ins-box{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:16px;margin-top:12px;}
.er-ins-hd{font-size:13px;font-weight:700;color:#92400e;margin-bottom:8px;}
.er-ins-item{font-size:12.5px;color:#78350f;padding:4px 0;display:flex;gap:8px;}
.er-ins-item::before{content:'•';}

/* ── Auth Modal ── */
.auth-modal-bg{position:fixed;inset:0;background:#000000aa;display:none;align-items:center;justify-content:center;z-index:9999}
.auth-modal-bg.open{display:flex}
.auth-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px;width:100%;max-width:380px}
.auth-title{font-size:16px;font-weight:600;margin-bottom:6px}
.auth-sub{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.5}
.auth-field{margin-bottom:14px}
.auth-label{display:block;font-size:12px;color:#94a3b8;margin-bottom:5px}
.auth-input{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:7px;
  color:var(--text);font-size:14px;font-family:inherit;outline:none}
.auth-input:focus{border-color:var(--accent)}
.auth-msg{font-size:12px;min-height:18px;margin-bottom:10px}
.auth-btns{display:flex;gap:8px;justify-content:flex-end}
.auth-cancel{padding:8px 16px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:13px;font-family:inherit}
.auth-submit{padding:8px 20px;border-radius:7px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit}
.auth-submit:hover{background:#059669}
.auth-submit:disabled{opacity:.45;cursor:default}
/* ── Auth status in topbar ── */
.auth-chip{font-size:11px;color:#94a3b8;display:flex;align-items:center;gap:6px;}
.auth-chip .user-em{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* ── Save button in report ── */
.er-btn-save{background:transparent;border:1px solid #10b981;color:#10b981;}
.er-btn-save:hover{background:#0a2a1f;}
.er-btn-save:disabled{opacity:.45;cursor:default;}

/* ── print ── */
@media print{
  .topbar,.report-bar,.industry-bar,.ig-panel,.tabs,.content,.dashboard{display:none!important;}
  .esg-report{display:block!important;position:static!important;overflow:visible!important;}
  .er-topbar{display:none!important;}
  .er-body{max-width:100%;padding:0;}
  .er-score-grid{grid-template-columns:repeat(4,1fr)!important;}
  .er-penalty-grid,.er-gov-grid{grid-template-columns:1fr 1fr!important;}
  .er-section,.er-fail-item,.er-risk-item,.er-gov-item,.er-score-card{break-inside:avoid;}
  .er-penalty-card-red{background:#fff1f2!important;}
  .er-penalty-card-green{background:#f0fdf4!important;}
  .er-gov-item{border-left-color:#059669!important;}
  .er-ins-box{background:#fffbeb!important;}
}
</style>
</head>
<body>

<div class="topbar">
  <h1 id="esg-page-title">ESG 자가진단 <small id="esg-page-sub">동반성장위원회 중소기업 ESG 표준 가이드라인</small></h1>
  <div class="auth-chip" id="auth-status-bar"></div>
  <button class="btn btn-ghost" id="esg-btn-expand" onclick="expandAll()">전체 펼치기</button>
  <button class="btn btn-primary" id="esg-btn-report" onclick="showEsgReport()">📋 보고서 생성</button>
  <button class="btn btn-danger" id="esg-btn-reset" onclick="confirmReset()">초기화</button>
</div>

<!-- 업종군 배너 -->
<div class="industry-bar" id="industry-bar"></div>

<!-- 업종군 선택 패널 -->
<div class="ig-panel" id="ig-panel">
  <div class="ig-panel-hdr">
    <span class="ig-panel-title" id="esg-ig-panel-title">업종군 선택</span>
    <span class="ig-panel-sub" id="esg-ig-panel-sub">선택한 업종에 해당하지 않는 지표를 자동으로 '해당없음' 처리합니다</span>
  </div>
  <div class="ig-grid" id="ig-grid"></div>
  <div class="ig-panel-foot">
    <button class="btn btn-ghost" id="esg-ig-panel-close" onclick="closeIgPanel()">닫기</button>
  </div>
</div>

<div class="dashboard">
  <div class="score-card">
    <div class="label" id="esg-lbl-total">전체 준수율</div>
    <div class="value color-total" id="sc-total">—</div>
    <div class="sub" id="sc-total-sub">진단 진행 중</div>
    <div class="bar"><div class="bar-fill fill-E" id="bar-total" style="width:0%"></div></div>
  </div>
  <div class="score-card">
    <div class="label" id="esg-lbl-E">E 환경</div>
    <div class="value color-E" id="sc-E">—</div>
    <div class="sub" id="sc-E-sub">14개 지표</div>
    <div class="bar"><div class="bar-fill fill-E" id="bar-E" style="width:0%"></div></div>
  </div>
  <div class="score-card">
    <div class="label" id="esg-lbl-S">S 사회</div>
    <div class="value color-S" id="sc-S">—</div>
    <div class="sub" id="sc-S-sub">54개 지표</div>
    <div class="bar"><div class="bar-fill fill-S" id="bar-S" style="width:0%"></div></div>
  </div>
  <div class="score-card">
    <div class="label" id="esg-lbl-G">G 지배구조</div>
    <div class="value color-G" id="sc-G">—</div>
    <div class="sub" id="sc-G-sub">11개 지표</div>
    <div class="bar"><div class="bar-fill fill-G" id="bar-G" style="width:0%"></div></div>
  </div>
  <div class="score-card">
    <div class="label" id="esg-lbl-common">공통 지표 준수율</div>

// ── state ──
const KEY = 'wf_esg_v1';
let state = {};

function loadState(){
  try{ state = JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ state={}; }
}
function saveState(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}
function getItem(indId, i){ return (state[indId]||{})[i]||null; }
function setItem(indId, i, val){ if(!state[indId]) state[indId]={}; state[indId][i]=val; saveState(); }
function getNaAll(indId){
  // 업종군에 의해 열외인 경우도 NA로 처리
  const ind=findInd(indId);
  if(ind && isIndustryExcluded(ind)) return true;
  return !!(state[indId]||{})['_na'];
}
function setNaAll(indId, v){ if(!state[indId]) state[indId]={}; state[indId]['_na']=v; saveState(); }

// ── 업종 helpers ──
function getIndustryId(){ return state['_industry']||null; }
function getIndustryGroup(){
  const id=getIndustryId();
  return id ? INDUSTRY_GROUPS.find(g=>g.id===id)||null : null;
}
function isIndustryExcluded(ind){
  if(ind.t!=='업종별') return false;
  const ig=getIndustryGroup();
  if(!ig) return false;
  return !ig.applicable.includes(ind.id);
}

// ── scoring ──
function scoreIndicator(ind){
  if(getNaAll(ind.id)) return 'na';
  const primary = ind.items.filter(x=>x.t==='p');
  if(!primary.length) return 'pending';
  let anyNo=false, anyNull=false;
  for(let i=0;i<ind.items.length;i++){
    const item=ind.items[i];
    if(item.t!=='p') continue;
    const v=getItem(ind.id,i);
    if(v==='no'){ anyNo=true; break; }
    if(!v||v===null) anyNull=true;
  }
  if(anyNo) return 'fail';
  if(anyNull) return 'pending';
  return 'pass';
}

function calcDomainScore(domain){
  let pass=0,fail=0,na=0,total=0;
  for(const sec of domain.sections)
    for(const ind of sec.inds){
      total++;
      const s=scoreIndicator(ind);
      if(s==='pass') pass++;
      else if(s==='fail') fail++;
      else if(s==='na') na++;
    }
  return {pass,fail,na,total,effective:total-na};
}

function updateScores(){
  let totPass=0,totEff=0;
  let comPass=0,comEff=0,indPass=0,indEff=0;
  for(const dom of DOMAINS){
    const sc=calcDomainScore(dom);
    totPass+=sc.pass; totEff+=sc.effective;
    const pct=sc.effective?Math.round(sc.pass/sc.effective*100):0;
    document.getElementById('sc-'+dom.id).textContent=sc.effective?pct+'%':'—';
    const isEn=esgLang==='en';
    document.getElementById('sc-'+dom.id+'-sub').textContent=isEn?`${sc.pass}/${sc.effective} compliant (N/A ${sc.na})`:`${sc.pass}/${sc.effective} 준수 (해당없음 ${sc.na})`;
    document.getElementById('bar-'+dom.id).style.width=(sc.effective?pct:0)+'%';
    for(const sec of dom.sections)
      for(const ind of sec.inds){
        const s=scoreIndicator(ind);
        if(ind.t==='공통'){ comEff++; if(s==='pass') comPass++; }
        else{ if(s!=='na'){ indEff++; if(s==='pass') indPass++; } }
      }
  }
  const tp=totEff?Math.round(totPass/totEff*100):0;
  document.getElementById('sc-total').textContent=totEff?tp+'%':'—';
  const isEn2=esgLang==='en';
  document.getElementById('sc-total-sub').textContent=totEff?(isEn2?`${totPass}/${totEff} compliant`:`${totPass}/${totEff} 준수`):(isEn2?'Assessment in progress':'진단 진행 중');
  document.getElementById('bar-total').style.width=(totEff?tp:0)+'%';
  const cp=comEff?Math.round(comPass/comEff*100):0;
  document.getElementById('sc-common').textContent=comEff?cp+'%':'—';
  document.getElementById('sc-common-sub').textContent=isEn2?`${comPass}/${comEff} compliant (Common)`:`${comPass}/${comEff} 준수 (공통)`;
  document.getElementById('bar-common').style.width=cp+'%';
  const ip=indEff?Math.round(indPass/indEff*100):0;
  document.getElementById('sc-ind').textContent=indEff?ip+'%':'—';
  document.getElementById('sc-ind-sub').textContent=isEn2?`${indPass}/${indEff} compliant (Industry·Effective)`:`${indPass}/${indEff} 준수 (업종별·유효)`;
  document.getElementById('bar-ind').style.width=ip+'%';
  const igLabel = document.getElementById('sc-ind-ig');
  if(igLabel){ const ig=getIndustryGroup(); igLabel.textContent = ig ? ig.icon+' '+getIgName(ig) : (isEn2?'Industry not set ▸':'업종 미설정 ▸'); }
}

function buildEsgReport(){
  const isEn=esgLang==='en';
  const empSz=document.getElementById('rb-emp').value;
  const revSz=document.getElementById('rb-rev').value;
  const now=new Date();
  const dateStr=isEn?`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`:now.getFullYear()+'년 '+(now.getMonth()+1)+'월 '+now.getDate()+'일';

  // 도메인별 점수 및 미준수 목록 수집
  let totPass=0,totEff=0;
  const ds={};
  const failItems=[];
  const S1_IDS=['S-01','S-02','S-03','S-04','S-05','S-06','S-07','S-08','S-09','S-10','S-11','S-12','S-13','S-14','S-15','S-16','S-17','S-18','S-19','S-20'];
  const S2_IDS=['S-21','S-22','S-23','S-24','S-25','S-26','S-27','S-28','S-29','S-30','S-31','S-32','S-33','S-34','S-35','S-36','S-37','S-38','S-39','S-40','S-41','S-42'];
  const S34_IDS=['S-43','S-44','S-45','S-46','S-47','S-48','S-49','S-50','S-51','S-52','S-53','S-54'];

  for(const dom of DOMAINS){
    let dp=0,de=0;
    for(const sec of dom.sections)
      for(const ind of sec.inds){
        const s=scoreIndicator(ind);
        if(s==='na') continue;
        de++; totEff++;
        if(s==='pass'){dp++;totPass++;}
        else if(s==='fail') failItems.push({domId:dom.id,id:ind.id,name:ind.name});
      }
    ds[dom.id]={pass:dp,eff:de,pct:de?Math.round(dp/de*100):0};
  }
  const totalPct=totEff?Math.round(totPass/totEff*100):0;

  // 법령별 미준수 분류
  const s1Fails=failItems.filter(f=>S1_IDS.includes(f.id));
  const s2Fails=failItems.filter(f=>S2_IDS.includes(f.id));
  const eFails=failItems.filter(f=>f.domId==='E');
  const gFails=failItems.filter(f=>f.domId==='G');
  const s34Fails=failItems.filter(f=>S34_IDS.includes(f.id));

  const envFine=eFails.length*Math.round(empBase[empSz]*0.4+revBase[revSz]*0.6);
  const govFine=(gFails.length+s34Fails.length)*revBase[revSz];
  const baseFine=lrFine+envFine+govFine;
  const minFine=Math.round(baseFine*0.6);
  const maxFine=Math.round(baseFine*1.8);
  const loanAmt={u10:3000,'10to49':10000,'50to299':30000,'300up':100000};

  const benefitMax=Math.round(loanAmt[empSz]*0.005+1200);

  const grade=totalPct>=90?'AA':totalPct>=80?'A':totalPct>=70?'B+':totalPct>=60?'B':'C';
  const gradeColor=totalPct>=80?'#16a34a':totalPct>=70?'#2563eb':totalPct>=60?'#d97706':'#dc2626';

  const domNames=isEn?{E:'E Environment',S:'S Social',G:'G Governance'}:{E:'E 환경',S:'S 사회',G:'G 지배구조'};
  return `<div class="er-topbar">

</div>

  <div class="er-header">
    <h1>${isEn?'ESG Self-Assessment Report':'ESG 자가진단 보고서'}</h1>
    <div class="er-header-meta">${isEn?'WorksFree Consulting Services &nbsp;|&nbsp; Based on Korea Co-Prosperity Committee SME ESG Guidelines':'WorksFree 컨설팅 서비스 &nbsp;|&nbsp; 동반성장위원회 중소기업 ESG 표준 가이드라인 기반'}<br>${isEn?'Date:':'진단일:'} ${dateStr} &nbsp;|&nbsp; ${isEn?'Size:':'기업규모:'} ${empSzLabel(empSz)} &nbsp;|&nbsp; ${isEn?'Revenue:':'연매출:'} ${revSzLabel(revSz)}</div>
  </div>

  <div class="er-section">
    <div class="er-hd">${isEn?'1. ESG Assessment Score Summary':'1. ESG 진단 점수 요약'}</div>
    <div class="er-score-grid">
      <div class="er-score-card">
        <div class="er-score-label">${isEn?'Overall Compliance':'종합 준수율'}</div>
        <div class="er-score-val" style="color:${gradeColor}">${totalPct}%</div>
        <div class="er-score-sub">${isEn?'Grade:':'등급:'} ${grade}</div>
      </div>
      <div class="er-score-card">
        <div class="er-score-label">${isEn?'E Environment':'E 환경'}</div>
        <div class="er-score-val" style="color:#10b981">${ds.E.pct}%</div>
        <div class="er-score-sub">${ds.E.pass}/${ds.E.eff} ${comply}</div>
      </div>
      <div class="er-score-card">
        <div class="er-score-label">${isEn?'S Social':'S 사회'}</div>
        <div class="er-score-val" style="color:#3b82f6">${ds.S.pct}%</div>
        <div class="er-score-sub">${ds.S.pass}/${ds.S.eff} ${comply}</div>
      </div>
      <div class="er-score-card">
        <div class="er-score-label">${isEn?'G Governance':'G 지배구조'}</div>
        <div class="er-score-val" style="color:#a855f7">${ds.G.pct}%</div>
        <div class="er-score-sub">${ds.G.pass}/${ds.G.eff} ${comply}</div>
      </div>
    </div>
  </div>

  <div class="er-section">

// ── render ──
function resultLabel(s){
  const isEn = esgLang==='en';
  if(s==='pass') return `<span class="ind-result result-pass">${isEn?'Pass':'준수'}</span>`;
  if(s==='fail') return `<span class="ind-result result-fail">${isEn?'Fail':'미준수'}</span>`;
  if(s==='na')   return `<span class="ind-result result-na">${isEn?'N/A':'해당없음'}</span>`;
  return `<span class="ind-result result-pending">${isEn?'Pending':'미완료'}</span>`;
}

function renderAll(){
  const content=document.getElementById('content');
  content.innerHTML='';
  for(const dom of DOMAINS){
    const panel=document.createElement('div');
    panel.className='tab-panel'+(dom.id===currentTab?' active':'');
    panel.id='panel-'+dom.id;
    for(const sec of dom.sections){
      const lbl=document.createElement('div');
      lbl.className='section-label';
      lbl.textContent=getSecName(sec);
      panel.appendChild(lbl);
      for(const ind of sec.inds){
        panel.appendChild(buildCard(ind, dom.id));
      }
    }
    content.appendChild(panel);
  }
}

function buildCard(ind, domId){
  const card=document.createElement('div');
  card.className='ind-card';
  card.id='card-'+ind.id;

  const industryExcl = isIndustryExcluded(ind);
  const naAll = getNaAll(ind.id);
  const score = scoreIndicator(ind);
  const isIndustry = ind.t==='업종별';

  const isEn = esgLang==='en';
  const badgeClass = industryExcl ? 'badge-excluded' : (isIndustry ? 'badge-industry' : 'badge-common');
  const badgeText  = industryExcl ? (isEn?'Excluded':'업종 열외') : (isEn?(isIndustry?'Industry':'Common'):ind.t);

  if(industryExcl) card.classList.add('ind-excluded');

  if(industryExcl){
    // 업종 열외 카드: 클릭으로 펼치기 가능하나 항목 조작 불가
    const ig = getIndustryGroup();
    card.innerHTML=`
      <div class="ind-head" onclick="toggleCard('${ind.id}')">
        <span class="ind-num">${ind.id}</span>
        <span class="ind-name">${getIndName(ind)}</span>
        <span class="badge ${badgeClass}">${badgeText}</span>
        ${resultLabel(score)}
        <span class="chevron">▼</span>
      </div>
      <div class="ind-body">
        <div class="ind-excl-body">
          <span style="font-size:16px">⊘</span>
          ${isEn?`This indicator does not apply to the selected industry group (<strong>${ig?getIgName(ig):'—'}</strong>). Change the industry or`:`선택한 업종군(<strong>${ig?ig.name:'—'}</strong>)에 해당하지 않는 지표입니다. 업종을 변경하거나`}
          <button class="btn-xs btn-xs-ghost" style="font-size:11px" onclick="openIgPanel()">${isEn?'change industry':'업종 변경'}</button>${isEn?'':'.'}
        </div>
        <div style="opacity:0.4;pointer-events:none">
          ${ind.items.map((item,i)=>buildItemRow(ind,item,i,true)).join('')}
        </div>
      </div>`;
  } else {
    card.innerHTML=`
      <div class="ind-head" onclick="toggleCard('${ind.id}')">
        <span class="ind-num">${ind.id}</span>
        <span class="ind-name">${getIndName(ind)}</span>
        <span class="badge ${badgeClass}">${badgeText}</span>
        ${resultLabel(score)}
        <span class="chevron">▼</span>
      </div>
      <div class="ind-body">
        ${isIndustry?`<div class="na-all-row">
          <label class="toggle">
            <input type="checkbox" id="na-${ind.id}" ${naAll?'checked':''} onchange="toggleNaAll('${ind.id}',this.checked)">
            <span class="slider"></span>
          </label>
          <label for="na-${ind.id}" style="cursor:pointer;font-size:13px;">${isEn?'Mark entire indicator as N/A (industry not applicable)':'이 지표 전체 해당없음 (업종 미해당)'}</label>
        </div>`:''}
        <div id="items-${ind.id}">
          ${ind.items.map((item,i)=>buildItemRow(ind,item,i,naAll)).join('')}
        </div>
      </div>`;
  }
  return card;
}

function buildItemRow(ind, item, i, naAll){
  const v=getItem(ind.id,i);
  const isNa=naAll;
  const isEn=esgLang==='en';
  const typeLabel=isEn?{'p':'Check','b':'Support','c':'Verify'}[item.t]:{'p':'점검','b':'보조','c':'확인'}[item.t];
  const typeClass={'p':'type-p','b':'type-b','c':'type-c'}[item.t];
  const tx=getItemTx(ind,i);
  return `<div class="item-row">
    <span class="item-type ${typeClass}">${typeLabel}</span>
    <span class="item-text${isNa?' na-text':''}">${tx}</span>
    <div class="pill-group">
      <button class="pill${v==='yes'?' active-yes':''}" ${isNa?'disabled':''} onclick="setPill('${ind.id}',${i},'yes',this)">${isEn?'Yes':'예'}</button>
      <button class="pill${v==='no'?' active-no':''}" ${isNa?'disabled':''} onclick="setPill('${ind.id}',${i},'no',this)">${isEn?'No':'아니오'}</button>
      <button class="pill${v==='na'?' active-na':''}" ${isNa?'disabled':''} onclick="setPill('${ind.id}',${i},'na',this)">${isEn?'N/A':'해당없음'}</button>
    </div>
  </div>`;
}

function refreshCard(ind){
  const oldCard=document.getElementById('card-'+ind.id);
  if(!oldCard) return;
  const wasOpen=oldCard.classList.contains('open');
  const domId=ind.id.split('-')[0];
  const newCard=buildCard(ind,domId);
  if(wasOpen) newCard.classList.add('open');
  oldCard.replaceWith(newCard);
}

// ── interactions ──
let currentTab='E';
const IS_PREVIEW = new URLSearchParams(location.search).get('preview') === '1';
function switchTab(id){
  if(IS_PREVIEW && id !== 'E') return;
  currentTab=id;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===id));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+id));
}

function toggleCard(indId){
  const card=document.getElementById('card-'+indId);
  card.classList.toggle('open');
}

function expandAll(){
  document.querySelectorAll('.ind-card').forEach(c=>c.classList.add('open'));
}

function setPill(indId, i, val, btn){
  const current=getItem(indId,i);
  const newVal=current===val?null:val;
  setItem(indId,i,newVal);
  const ind=findInd(indId);
  if(ind) refreshCard(ind);
  updateScores();
}

function toggleNaAll(indId, checked){
  setNaAll(indId,checked);
  const ind=findInd(indId);
  if(ind) refreshCard(ind);
  updateScores();
}

function findInd(id){
  for(const d of DOMAINS)
    for(const s of d.sections)
      for(const ind of s.inds)
        if(ind.id===id) return ind;
  return null;
}

// ── 업종군 선택 / 해제 ──
function selectIndustry(igId){
  state['_industry'] = igId;
  saveState();
  renderIndustryBar();
  renderIgGrid();      // 패널 내 선택 상태 갱신
  renderAll();
  updateScores();
}

function clearIndustry(){
  delete state['_industry'];
  saveState();
  renderIndustryBar();
  closeIgPanel();
  renderAll();
  updateScores();
}

function renderIndustryBar(){
  const bar = document.getElementById('industry-bar');
  const ig  = getIndustryGroup();
  const isEn = esgLang==='en';
  if(!ig){
    bar.innerHTML=`
      <span style="font-size:16px;opacity:.6">🏢</span>
      <span class="ib-empty">${isEn?'Select an industry group to automatically handle non-applicable indicators.':'업종군을 선택하면 해당없음 항목을 자동으로 처리할 수 있습니다.'}</span>
      <button class="btn-xs btn-xs-accent" onclick="openIgPanel()">${isEn?'Set Industry':'업종군 설정'}</button>`;
  } else {
    const apply = ig.applicable.length;
    const excl  = ALL_IND_IDS.length - apply;
    bar.innerHTML=`
      <span style="font-size:16px">${ig.icon}</span>
      <span class="ib-name">${getIgName(ig)}</span>
      <span class="ib-chip ib-chip-apply">${isEn?'Applicable':'적용'} ${apply}${isEn?'':'개'}</span>
      <span class="ib-chip ib-chip-excl">${isEn?'Excluded':'열외'} ${excl}${isEn?'':'개'}</span>
      <button class="btn-xs btn-xs-ghost" onclick="openIgPanel()">${isEn?'Change':'업종 변경'}</button>
      <button class="btn-xs btn-xs-danger" onclick="clearIndustry()">${isEn?'Clear':'해제'}</button>`;
  }
}

function openIgPanel(){
  const panel = document.getElementById('ig-panel');
  renderIgGrid();
  panel.classList.add('open');
  panel.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function closeIgPanel(){
  document.getElementById('ig-panel').classList.remove('open');
}
function renderIgGrid(){
  const grid = document.getElementById('ig-grid');
  const cur  = getIndustryId();
  const isEn = esgLang==='en';
  grid.innerHTML = INDUSTRY_GROUPS.map(ig=>{
    const apply = ig.applicable.length;
    const excl  = ALL_IND_IDS.length - apply;
    const sel   = ig.id === cur;
    return `<div class="ig-card${sel?' ig-selected':''}" onclick="selectIndustry('${ig.id}')">
      <div class="ig-card-icon">${ig.icon}</div>
      <div class="ig-card-name">${getIgName(ig)}</div>

function confirmReset(){

}
function resetAll(){

// ── 테스트 모드 자동 채움 (test.worksfree.kr) — 총점 ~65%, 모든 항목 선택 ──
function autoFillTest(){
  if(!location.hostname.startsWith('test.')) return;
  // test 서버는 항상 데모 상태로 시작 (localStorage 덮어씀)
  state['_industry']='service'; // IT·서비스 업종 (업종별 지표 전체 해당없음)
  for(const dom of DOMAINS)
    for(const sec of dom.sections)
      for(const ind of sec.inds)
        for(let i=0;i<ind.items.length;i++){
          if(!state[ind.id]) state[ind.id]={};
          state[ind.id][i]='yes';
        }
  // 의도적 미준수 항목 — 총점 ~65% 목표 (23건 fail)
  const failIds=[
    'E-03','E-06','E-07',                        // E (3건)
    'S-05','S-12','S-15','S-17','S-19','S-20',  // S1 근로조건 (6건)
    'S-24','S-26','S-34','S-38','S-40',          // S2 작업환경 (5건)
    'S-43','S-48',                                // S3 협력사 (2건)
    'S-53','S-54',                                // S4 이해관계자 (2건)
    'G-02','G-05','G-07','G-10','G-11',          // G 지배구조 (5건)
  ];
  for(const indId of failIds){
    const ind=findInd(indId);
    if(!ind) continue;
    if(!state[indId]) state[indId]={};
    ind.items.forEach((item,i)=>{ if(item.t==='p') state[indId][i]='no'; });
  }
  saveState();
}

function getRootDomain(){
  const h = location.hostname;
  if(h==='localhost'||h==='127.0.0.1') return 'worksfree.kr';
  const p = h.split('.');
  return p.length>=2 ? p.slice(-2).join('.') : h;
}
async function initTenant(){
  try {
    const res  = await fetch(`${SUPABASE_URL}/rest/v1/tenants?domain=eq.${encodeURIComponent(getRootDomain())}&select=id`,
      { headers:{ 'apikey':SUPABASE_ANON } });

    tenantId   = rows?.[0]?.id ?? null;

async function doLogin(){
  const email    = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const btn = document.getElementById('auth-submit');
  const msg = document.getElementById('auth-msg');
  const isEn=esgLang==='en';
  if(!email || !password){ msg.textContent=isEn?'Please enter email and password.':'이메일과 비밀번호를 입력하세요.'; msg.style.color='#ef4444'; return; }
  btn.disabled = true; msg.textContent=''; msg.style.color='';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false;
  if(error){ msg.textContent=isEn?'Incorrect email or password.':'이메일 또는 비밀번호가 올바르지 않습니다.'; msg.style.color='#ef4444'; return; }
  closeAuthModal();
  if(_afterLogin){ const fn=_afterLogin; _afterLogin=null; fn(); }
}

function openAuthModal(afterLogin, subMsg){

function closeAuthModal(){

/* ── ESG 보고서 Supabase 저장 ── */
async function saveEsgReport(){
  if(!isMember()) return;
  const btn = document.getElementById('btn-save-esg');
  if(!btn) return;
  const isEn=esgLang==='en';
  btn.disabled = true; btn.textContent = isEn?'Saving…':'저장 중…';
  const scores = {};
  for(const dom of DOMAINS){
    const sc = calcDomainScore(dom);
    scores[dom.id] = { pass:sc.pass, eff:sc.effective, pct:sc.effective?Math.round(sc.pass/sc.effective*100):0 };
  }
  try {
    const { error } = await sb.from('esg_reports').insert({
      user_id:      currentUser.id,
      tenant_id:    tenantId || undefined,   // 미해석 시 DB DEFAULT(worksfree)
      state:        state,
      scores:       scores,
      company_size: document.getElementById('rb-emp').value,
      revenue:      document.getElementById('rb-rev').value,
      industry:     getIndustryId(),
    });
    btn.textContent = error ? (isEn?'❌ Save Failed':'❌ 저장 실패') : (isEn?'✓ Saved':'✓ 저장됨');
  } catch(e) {
    btn.textContent = isEn?'❌ Save Failed':'❌ 저장 실패';
  }
  setTimeout(()=>{ btn.disabled=false; btn.textContent=isEn?'💾 Save':'💾 저장'; }, 2500);
}
