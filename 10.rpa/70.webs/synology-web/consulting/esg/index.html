<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESG 자가진단 — WorksFree</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap');
:root{
  --bg:#0f1117;--panel:#1c2333;--panel2:#212d40;--border:#2a3347;
  --text:#e2e8f0;--muted:#64748b;--accent:#10b981;
  --E:#10b981;--S:#3b82f6;--G:#a855f7;
  --yes:#10b981;--no:#ef4444;--na:#64748b;--none:#2a3347;
  --radius:8px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'IBM Plex Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;}

/* ── top bar ── */
.topbar{position:sticky;top:0;z-index:100;background:var(--panel);border-bottom:1px solid var(--border);
  padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.topbar h1{font-size:16px;font-weight:600;flex:1;white-space:nowrap;}
.topbar small{color:var(--muted);font-size:12px;}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:500;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);border-color:var(--text);}
.btn-danger{background:transparent;color:#ef4444;border:1px solid #ef4444;}
.btn-danger:hover{background:#ef444420;}

/* ── score dashboard ── */
.dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;padding:16px 20px;background:var(--panel);border-bottom:1px solid var(--border);}
.score-card{background:var(--panel2);border-radius:var(--radius);padding:14px 16px;border:1px solid var(--border);}
.score-card .label{font-size:12px;color:var(--muted);margin-bottom:6px;}
.score-card .value{font-size:28px;font-weight:600;}
.score-card .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.bar{height:4px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden;}
.bar-fill{height:100%;border-radius:2px;transition:width .4s;}
.color-E{color:var(--E);} .fill-E{background:var(--E);}
.color-S{color:var(--S);} .fill-S{background:var(--S);}
.color-G{color:var(--G);} .fill-G{background:var(--G);}
.color-total{color:var(--accent);}

/* ── tabs ── */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 20px;background:var(--panel);}
.tab{padding:10px 20px;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .2s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--text);border-bottom-color:currentColor;}
.tab[data-tab="E"].active{color:var(--E);}
.tab[data-tab="S"].active{color:var(--S);}
.tab[data-tab="G"].active{color:var(--G);}

/* ── content area ── */
.content{padding:20px;max-width:900px;margin:0 auto;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ── section header ── */
.section-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin:24px 0 8px;padding-left:4px;}
.section-label:first-child{margin-top:0;}

/* ── indicator card ── */
.ind-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;}
.ind-head{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;user-select:none;}
.ind-head:hover{background:var(--panel2);}
.ind-num{font-size:12px;font-weight:600;color:var(--muted);min-width:44px;}
.ind-name{flex:1;font-weight:500;font-size:14px;}
.badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;letter-spacing:.04em;}
.badge-common{background:#1e3a2f;color:#6ee7b7;}
.badge-industry{background:#1e2d4a;color:#93c5fd;}
.ind-result{font-size:12px;font-weight:600;padding:3px 10px;border-radius:10px;min-width:52px;text-align:center;}
.result-pass{background:#0d2620;color:#34d399;}
.result-fail{background:#2d1515;color:#f87171;}
.result-na{background:#1f2937;color:#9ca3af;}
.result-pending{background:#1c2333;color:#64748b;}
.chevron{font-size:11px;color:var(--muted);transition:transform .2s;margin-left:4px;}
.ind-card.open .chevron{transform:rotate(180deg);}

/* ── indicator body ── */
.ind-body{display:none;padding:0 16px 16px;border-top:1px solid var(--border);}
.ind-card.open .ind-body{display:block;}
.na-all-row{display:flex;align-items:center;gap:10px;padding:10px 0 6px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.na-all-row label{font-size:12px;color:var(--muted);}
.toggle{position:relative;width:36px;height:20px;cursor:pointer;}
.toggle input{opacity:0;width:0;height:0;position:absolute;}
.slider{position:absolute;inset:0;background:var(--border);border-radius:10px;transition:.2s;}
.slider::before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:#9ca3af;border-radius:50%;transition:.2s;}
.toggle input:checked+.slider{background:#374151;}
.toggle input:checked+.slider::before{transform:translateX(16px);background:#6b7280;}

/* ── check items ── */
.item-row{display:flex;align-items:flex-start;gap:12px;padding:7px 0;border-bottom:1px solid #1a2235;}
.item-row:last-child{border-bottom:none;}
.item-type{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;min-width:30px;text-align:center;margin-top:2px;flex-shrink:0;}
.type-p{background:#0c2640;color:#60a5fa;}
.type-b{background:#1a2535;color:#94a3b8;}
.type-c{background:#1a1a2e;color:#7c3aed;}
.item-text{flex:1;font-size:13px;color:var(--text);}
.item-text.na-text{color:var(--muted);text-decoration:line-through;}
.pill-group{display:flex;gap:4px;flex-shrink:0;margin-top:1px;}
.pill{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);transition:.15s;white-space:nowrap;}
.pill:hover{border-color:var(--text);color:var(--text);}
.pill.active-yes{background:#0d2620;border-color:var(--yes);color:#34d399;}
.pill.active-no{background:#2d1515;border-color:var(--no);color:#f87171;}
.pill.active-na{background:#1f2937;border-color:#4b5563;color:#9ca3af;}
.pill:disabled,.pill[disabled]{opacity:.3;cursor:default;pointer-events:none;}

/* ── 업종 배너 ── */
.industry-bar{
  background:#0a1120;border-bottom:1px solid var(--border);
  padding:9px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;
}
.ib-empty{color:var(--muted);flex:1;}
.ib-name{font-weight:600;color:var(--text);}
.ib-chip{font-size:11px;padding:2px 8px;border-radius:8px;white-space:nowrap;}
.ib-chip-apply{background:#0a2a1f;color:#6ee7b7;}
.ib-chip-excl{background:#1f2937;color:#6b7280;}
.btn-xs{padding:3px 10px;font-size:11px;border-radius:5px;cursor:pointer;font-family:inherit;font-weight:500;border:none;}
.btn-xs-accent{background:var(--accent);color:#fff;}
.btn-xs-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-xs-ghost:hover{color:var(--text);}
.btn-xs-danger{background:transparent;color:#ef4444;border:1px solid #ef444460;}
.btn-xs-danger:hover{background:#ef444415;}

/* ── 업종 선택 패널 ── */
.ig-panel{background:#0d1623;border-bottom:2px solid var(--accent);padding:18px 20px;display:none;}
.ig-panel.open{display:block;}
.ig-panel-hdr{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.ig-panel-title{font-size:14px;font-weight:600;}
.ig-panel-sub{font-size:12px;color:var(--muted);}
.ig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:10px;}
.ig-card{
  background:var(--panel2);border:2px solid var(--border);border-radius:var(--radius);
  padding:14px;cursor:pointer;transition:border-color .15s,background .15s;
}
.ig-card:hover{border-color:#3b4f70;background:#1e2d42;}
.ig-card.ig-selected{border-color:var(--accent);background:#061a12;}
.ig-card-icon{font-size:22px;margin-bottom:8px;}
.ig-card-name{font-size:13px;font-weight:600;margin-bottom:3px;}
.ig-card-desc{font-size:11px;color:var(--muted);line-height:1.4;margin-bottom:10px;min-height:30px;}
.ig-card-chips{display:flex;gap:6px;flex-wrap:wrap;}
.ig-chip-s{font-size:10px;padding:2px 7px;border-radius:7px;}
.ig-chip-s-apply{background:#0a2a1f;color:#6ee7b7;}
.ig-chip-s-excl{background:#1f2937;color:#6b7280;}
.ig-panel-foot{margin-top:14px;display:flex;gap:8px;justify-content:flex-end;}

/* ── 열외 지표 카드 ── */
.badge-excluded{background:#1a1f2e;color:#4b5563;}
.ind-card.ind-excluded{opacity:0.45;}
.ind-card.ind-excluded .ind-head{background:transparent!important;cursor:default;}
.ind-excl-body{
  padding:12px 0 4px;display:flex;align-items:center;gap:8px;
  font-size:12px;color:var(--muted);
}

/* ── preview restrictions ── */
.tab.preview-disabled { opacity:.35; cursor:not-allowed; pointer-events:none; }

/* ── print ── */
@media print{
  .topbar .btn,.tabs{print-color-adjust:exact;}
  body{background:#fff;color:#111;}
  .topbar{position:static;background:#fff;border-color:#ccc;}
  .btn{display:none;}
  .dashboard{background:#fff;}
  .score-card{background:#f5f5f5;border-color:#ddd;}
  .score-card .label,.score-card .sub{color:#666;}
  .score-card .value{color:#111;}
  .ind-card{background:#fff;border-color:#ddd;break-inside:avoid;}
  .ind-body{display:block!important;}
  .ind-head{background:#f9f9f9;}
  .tabs{display:none;}
  .tab-panel{display:block!important;}
  .section-label{color:#444;}
  .item-text{color:#111;}
  .item-text.na-text{color:#999;}
  .bar-fill{print-color-adjust:exact;}
}
</style>
</head>
<body>

<div class="topbar">
  <h1>ESG 자가진단 <small>동반성장위원회 중소기업 ESG 표준 가이드라인</small></h1>
  <button class="btn btn-ghost" onclick="expandAll()">전체 펼치기</button>
  <button class="btn btn-primary" onclick="window.print()">🖨 인쇄 / PDF</button>
  <button class="btn btn-danger" onclick="confirmReset()">초기화</button>
</div>

<!-- 업종군 배너 -->
<div class="industry-bar" id="industry-bar"></div>

<!-- 업종군 선택 패널 -->
<div class="ig-panel" id="ig-panel">
  <div class="ig-panel-hdr">
    <span class="ig-panel-title">업종군 선택</span>
    <span class="ig-panel-sub">선택한 업종에 해당하지 않는 지표를 자동으로 '해당없음' 처리합니다</span>
  </div>
  <div class="ig-grid" id="ig-grid"></div>
  <div class="ig-panel-foot">
    <button class="btn btn-ghost" onclick="closeIgPanel()">닫기</button>
  </div>
</div>

<div class="dashboard">
  <div class="score-card">
    <div class="label">전체 준수율</div>
    <div class="value color-total" id="sc-total">—</div>
    <div class="sub" id="sc-total-sub">진단 진행 중</div>
    <div class="bar"><div class="bar-fill fill-E" id="bar-total" style="width:0%"></div></div>
  </div>
  <div class="score-card">
    <div class="label">E 환경</div>
    <div class="value color-E" id="sc-E">—</div>
    <div class="sub" id="sc-E-sub">14개 지표</div>
    <div class="bar"><div class="bar-fill fill-E" id="bar-E" style="width:0%"></div></div>
  </div>
  <div class="score-card">
    <div class="label">S 사회</div>
    <div class="value color-S" id="sc-S">—</div>
    <div class="sub" id="sc-S-sub">54개 지표</div>
    <div class="bar"><div class="bar-fill fill-S" id="bar-S" style="width:0%"></div></div>
  </div>
  <div class="score-card">
    <div class="label">G 지배구조</div>
    <div class="value color-G" id="sc-G">—</div>
    <div class="sub" id="sc-G-sub">11개 지표</div>
    <div class="bar"><div class="bar-fill fill-G" id="bar-G" style="width:0%"></div></div>
  </div>
  <div class="score-card">
    <div class="label">공통 지표 준수율</div>
    <div class="value" id="sc-common" style="color:var(--text)">—</div>
    <div class="sub" id="sc-common-sub">49개 공통 지표</div>
    <div class="bar"><div class="bar-fill" id="bar-common" style="width:0%;background:var(--accent)"></div></div>
  </div>
  <div class="score-card" id="sc-ind-card" onclick="openIgPanel()" style="cursor:pointer" title="클릭하여 업종군 선택">
    <div class="label">업종별 지표 준수율 <span id="sc-ind-ig" style="font-size:10px;color:var(--muted)"></span></div>
    <div class="value" id="sc-ind" style="color:var(--text)">—</div>
    <div class="sub" id="sc-ind-sub">30개 업종별 지표</div>
    <div class="bar"><div class="bar-fill" id="bar-ind" style="width:0%;background:#f59e0b"></div></div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="E" onclick="switchTab('E')">🌿 E 환경 (14)</div>
  <div class="tab" data-tab="S" onclick="switchTab('S')">👥 S 사회 (54)</div>
  <div class="tab" data-tab="G" onclick="switchTab('G')">⚖ G 지배구조 (11)</div>
</div>

<div class="content" id="content"></div>

<script>

const ALL_IND_IDS = ['E-08','E-10','E-11','E-12','E-13','E-14',
                     'S-29','S-30','S-31','S-32','S-33','S-35','S-36','S-42'];

const INDUSTRY_GROUPS = [

// p=점검(scoring), b=보조, c=확인
const DOMAINS = [
{id:'E',name:'환경',sections:[
  {id:'E1',name:'환경경영',inds:[

    {id:'E-02',name:'환경경영 체계 구축',t:'공통',items:[

      {t:'p',tx:'환경경영 담당자(부서)를 지정하고 있다'},

  {id:'E2',name:'환경관리',inds:[

// ── state ──
const KEY = 'wf_esg_v1';
let state = {};

function loadState(){
  try{ state = JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ state={}; }
}
function saveState(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}
function getItem(indId, i){ return (state[indId]||{})[i]||null; }
function setItem(indId, i, val){ if(!state[indId]) state[indId]={}; state[indId][i]=val; saveState(); }
function getNaAll(indId){
  // 업종군에 의해 열외인 경우도 NA로 처리
  const ind=findInd(indId);
  if(ind && isIndustryExcluded(ind)) return true;
  return !!(state[indId]||{})['_na'];
}
function setNaAll(indId, v){ if(!state[indId]) state[indId]={}; state[indId]['_na']=v; saveState(); }

// ── 업종 helpers ──
function getIndustryId(){ return state['_industry']||null; }
function getIndustryGroup(){
  const id=getIndustryId();
  return id ? INDUSTRY_GROUPS.find(g=>g.id===id)||null : null;
}
function isIndustryExcluded(ind){
  if(ind.t!=='업종별') return false;
  const ig=getIndustryGroup();
  if(!ig) return false;
  return !ig.applicable.includes(ind.id);
}

// ── scoring ──
function scoreIndicator(ind){
  if(getNaAll(ind.id)) return 'na';
  const primary = ind.items.filter(x=>x.t==='p');
  if(!primary.length) return 'pending';
  let anyNo=false, anyNull=false;
  for(let i=0;i<ind.items.length;i++){
    const item=ind.items[i];
    if(item.t!=='p') continue;
    const v=getItem(ind.id,i);
    if(v==='no'){ anyNo=true; break; }
    if(!v||v===null) anyNull=true;
  }
  if(anyNo) return 'fail';
  if(anyNull) return 'pending';
  return 'pass';
}

function calcDomainScore(domain){
  let pass=0,fail=0,na=0,total=0;
  for(const sec of domain.sections)
    for(const ind of sec.inds){
      total++;
      const s=scoreIndicator(ind);
      if(s==='pass') pass++;
      else if(s==='fail') fail++;
      else if(s==='na') na++;
    }
  return {pass,fail,na,total,effective:total-na};
}

function updateScores(){
  let totPass=0,totEff=0;
  let comPass=0,comEff=0,indPass=0,indEff=0;
  for(const dom of DOMAINS){
    const sc=calcDomainScore(dom);
    totPass+=sc.pass; totEff+=sc.effective;
    const pct=sc.effective?Math.round(sc.pass/sc.effective*100):0;
    document.getElementById('sc-'+dom.id).textContent=sc.effective?pct+'%':'—';
    document.getElementById('sc-'+dom.id+'-sub').textContent=`${sc.pass}/${sc.effective} 준수 (해당없음 ${sc.na})`;
    document.getElementById('bar-'+dom.id).style.width=(sc.effective?pct:0)+'%';
    for(const sec of dom.sections)
      for(const ind of sec.inds){
        const s=scoreIndicator(ind);
        if(ind.t==='공통'){ comEff++; if(s==='pass') comPass++; }
        else{ if(s!=='na'){ indEff++; if(s==='pass') indPass++; } }
      }
  }
  const tp=totEff?Math.round(totPass/totEff*100):0;
  document.getElementById('sc-total').textContent=totEff?tp+'%':'—';
  document.getElementById('sc-total-sub').textContent=totEff?`${totPass}/${totEff} 준수`:'진단 진행 중';
  document.getElementById('bar-total').style.width=(totEff?tp:0)+'%';
  const cp=comEff?Math.round(comPass/comEff*100):0;
  document.getElementById('sc-common').textContent=comEff?cp+'%':'—';
  document.getElementById('sc-common-sub').textContent=`${comPass}/${comEff} 준수 (공통)`;
  document.getElementById('bar-common').style.width=cp+'%';
  const ip=indEff?Math.round(indPass/indEff*100):0;
  document.getElementById('sc-ind').textContent=indEff?ip+'%':'—';
  document.getElementById('sc-ind-sub').textContent=`${indPass}/${indEff} 준수 (업종별·유효)`;
  document.getElementById('bar-ind').style.width=ip+'%';
  const igLabel = document.getElementById('sc-ind-ig');
  if(igLabel){ const ig=getIndustryGroup(); igLabel.textContent = ig ? ig.icon+' '+ig.name : '업종 미설정 ▸'; }
}

// ── render ──
function resultLabel(s){
  if(s==='pass') return '<span class="ind-result result-pass">준수</span>';
  if(s==='fail') return '<span class="ind-result result-fail">미준수</span>';
  if(s==='na') return '<span class="ind-result result-na">해당없음</span>';
  return '<span class="ind-result result-pending">미완료</span>';
}

function renderAll(){
  const content=document.getElementById('content');
  content.innerHTML='';
  for(const dom of DOMAINS){
    const panel=document.createElement('div');
    panel.className='tab-panel'+(dom.id===currentTab?' active':'');
    panel.id='panel-'+dom.id;
    for(const sec of dom.sections){
      const lbl=document.createElement('div');
      lbl.className='section-label';
      lbl.textContent=sec.name;
      panel.appendChild(lbl);
      for(const ind of sec.inds){
        panel.appendChild(buildCard(ind, dom.id));
      }
    }
    content.appendChild(panel);
  }
}

function buildCard(ind, domId){
  const card=document.createElement('div');
  card.className='ind-card';
  card.id='card-'+ind.id;

  const industryExcl = isIndustryExcluded(ind);
  const naAll = getNaAll(ind.id);
  const score = scoreIndicator(ind);
  const isIndustry = ind.t==='업종별';

  const badgeClass = industryExcl ? 'badge-excluded' : (isIndustry ? 'badge-industry' : 'badge-common');
  const badgeText  = industryExcl ? '업종 열외' : ind.t;

  if(industryExcl) card.classList.add('ind-excluded');

  if(industryExcl){
    // 업종 열외 카드: 클릭으로 펼치기 가능하나 항목 조작 불가
    const ig = getIndustryGroup();
    card.innerHTML=`
      <div class="ind-head" onclick="toggleCard('${ind.id}')">
        <span class="ind-num">${ind.id}</span>
        <span class="ind-name">${ind.name}</span>
        <span class="badge ${badgeClass}">${badgeText}</span>
        ${resultLabel(score)}
        <span class="chevron">▼</span>
      </div>
      <div class="ind-body">
        <div class="ind-excl-body">
          <span style="font-size:16px">⊘</span>
          선택한 업종군(<strong>${ig?ig.name:'—'}</strong>)에 해당하지 않는 지표입니다.
          업종을 변경하거나 <button class="btn-xs btn-xs-ghost" style="font-size:11px" onclick="openIgPanel()">업종 변경</button>하세요.
        </div>
        <div style="opacity:0.4;pointer-events:none">
          ${ind.items.map((item,i)=>buildItemRow(ind,item,i,true)).join('')}
        </div>
      </div>`;
  } else {
    card.innerHTML=`
      <div class="ind-head" onclick="toggleCard('${ind.id}')">
        <span class="ind-num">${ind.id}</span>
        <span class="ind-name">${ind.name}</span>
        <span class="badge ${badgeClass}">${badgeText}</span>
        ${resultLabel(score)}
        <span class="chevron">▼</span>
      </div>
      <div class="ind-body">
        ${isIndustry?`<div class="na-all-row">
          <label class="toggle">
            <input type="checkbox" id="na-${ind.id}" ${naAll?'checked':''} onchange="toggleNaAll('${ind.id}',this.checked)">
            <span class="slider"></span>
          </label>
          <label for="na-${ind.id}" style="cursor:pointer;font-size:13px;">이 지표 전체 해당없음 (업종 미해당)</label>
        </div>`:''}
        <div id="items-${ind.id}">
          ${ind.items.map((item,i)=>buildItemRow(ind,item,i,naAll)).join('')}
        </div>
      </div>`;
  }
  return card;
}

function buildItemRow(ind, item, i, naAll){
  const v=getItem(ind.id,i);
  const disabled=naAll||(item.t!=='p'&&naAll)?'disabled':'';
  const isNa=naAll;
  const typeLabel={'p':'점검','b':'보조','c':'확인'}[item.t];
  const typeClass={'p':'type-p','b':'type-b','c':'type-c'}[item.t];
  return `<div class="item-row">
    <span class="item-type ${typeClass}">${typeLabel}</span>
    <span class="item-text${isNa?' na-text':''}">${item.tx}</span>
    <div class="pill-group">
      <button class="pill${v==='yes'?' active-yes':''}" ${isNa?'disabled':''} onclick="setPill('${ind.id}',${i},'yes',this)">예</button>
      <button class="pill${v==='no'?' active-no':''}" ${isNa?'disabled':''} onclick="setPill('${ind.id}',${i},'no',this)">아니오</button>
      <button class="pill${v==='na'?' active-na':''}" ${isNa?'disabled':''} onclick="setPill('${ind.id}',${i},'na',this)">해당없음</button>
    </div>
  </div>`;
}

function refreshCard(ind){
  const oldCard=document.getElementById('card-'+ind.id);
  if(!oldCard) return;
  const wasOpen=oldCard.classList.contains('open');
  const domId=ind.id.split('-')[0];
  const newCard=buildCard(ind,domId);
  if(wasOpen) newCard.classList.add('open');
  oldCard.replaceWith(newCard);
}

// ── interactions ──
let currentTab='E';
const IS_PREVIEW = new URLSearchParams(location.search).get('preview') === '1';
function switchTab(id){
  if(IS_PREVIEW && id !== 'E') return;
  currentTab=id;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===id));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+id));
}

function toggleCard(indId){
  const card=document.getElementById('card-'+indId);
  card.classList.toggle('open');
}

function expandAll(){
  document.querySelectorAll('.ind-card').forEach(c=>c.classList.add('open'));
}

function setPill(indId, i, val, btn){
  const current=getItem(indId,i);
  const newVal=current===val?null:val;
  setItem(indId,i,newVal);
  const ind=findInd(indId);
  if(ind) refreshCard(ind);
  updateScores();
}

function toggleNaAll(indId, checked){
  setNaAll(indId,checked);
  const ind=findInd(indId);
  if(ind) refreshCard(ind);
  updateScores();
}

function findInd(id){
  for(const d of DOMAINS)
    for(const s of d.sections)
      for(const ind of s.inds)
        if(ind.id===id) return ind;
  return null;
}

// ── 업종군 선택 / 해제 ──
function selectIndustry(igId){
  state['_industry'] = igId;
  saveState();
  renderIndustryBar();
  renderIgGrid();      // 패널 내 선택 상태 갱신
  renderAll();
  updateScores();
}

function clearIndustry(){
  delete state['_industry'];
  saveState();
  renderIndustryBar();
  closeIgPanel();
  renderAll();
  updateScores();
}

// ── 업종 배너 렌더 ──
function renderIndustryBar(){
  const bar = document.getElementById('industry-bar');
  const ig  = getIndustryGroup();
  if(!ig){
    bar.innerHTML=`
      <span style="font-size:16px;opacity:.6">🏢</span>
      <span class="ib-empty">업종군을 선택하면 해당없음 항목을 자동으로 처리할 수 있습니다.</span>
      <button class="btn-xs btn-xs-accent" onclick="openIgPanel()">업종군 설정</button>`;
  } else {
    const apply = ig.applicable.length;
    const excl  = ALL_IND_IDS.length - apply;
    bar.innerHTML=`
      <span style="font-size:16px">${ig.icon}</span>
      <span class="ib-name">${ig.name}</span>
      <span class="ib-chip ib-chip-apply">적용 ${apply}개</span>
      <span class="ib-chip ib-chip-excl">열외 ${excl}개</span>
      <button class="btn-xs btn-xs-ghost" onclick="openIgPanel()">업종 변경</button>
      <button class="btn-xs btn-xs-danger" onclick="clearIndustry()">해제</button>`;
  }
}

// ── 업종 패널 ──
function openIgPanel(){
  const panel = document.getElementById('ig-panel');
  renderIgGrid();
  panel.classList.add('open');
  panel.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function closeIgPanel(){
  document.getElementById('ig-panel').classList.remove('open');
}
function renderIgGrid(){
  const grid = document.getElementById('ig-grid');
  const cur  = getIndustryId();
  grid.innerHTML = INDUSTRY_GROUPS.map(ig=>{
    const apply = ig.applicable.length;
    const excl  = ALL_IND_IDS.length - apply;
    const sel   = ig.id === cur;
    return `<div class="ig-card${sel?' ig-selected':''}" onclick="selectIndustry('${ig.id}')">
      <div class="ig-card-icon">${ig.icon}</div>
      <div class="ig-card-name">${ig.name}</div>
      <div class="ig-card-desc">${ig.desc}</div>
      <div class="ig-card-chips">
        <span class="ig-chip-s ig-chip-s-apply">✔ 적용 ${apply}개</span>
        <span class="ig-chip-s ig-chip-s-excl">⊘ 열외 ${excl}개</span>
      </div>
    </div>`;
  }).join('');
}

function confirmReset(){
  if(confirm('모든 진단 데이터를 초기화하시겠습니까?\n이 작업은 되돌릴 수 없습니다.'))
    resetAll();
}
function resetAll(){
  state={};
  saveState();
  renderIndustryBar();
  renderAll();
  updateScores();
}

// ── init ──
loadState();
renderIndustryBar();
renderAll();
updateScores();
if(IS_PREVIEW){
  document.querySelectorAll('.tab:not([data-tab="E"])').forEach(el=>el.classList.add('preview-disabled'));
}
</script>
