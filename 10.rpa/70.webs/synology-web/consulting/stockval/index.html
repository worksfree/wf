<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비상장주식 가치평가 진단 — WorksFree</title>
<meta name="description" content="비상장주식 가치평가 진단. 세법·투자·M&A·ESOP 목적별 주식 가치 산출 방법 안내. 순자산가치·수익가치 자동 계산. WorksFree 컨설팅 플랫폼 제공.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://www.worksfree.kr/consulting/stockval/">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap');
:root{
  --bg:#0f1117;--surface:#1c2333;--border:#2a3347;--border2:#3a4a5c;
  --text:#e2e8f0;--muted:#a8bdd1;--hint:#8fa3ba;
  --blue-bg:#0c1a30;--blue:#3b82f6;--blue-dark:#2563eb;
  --green-bg:#0d2620;--green:#10b981;
  --amber-bg:#2d1f08;--amber:#f59e0b;
  --red-bg:#2d1515;--red:#ef4444;
  --purple-bg:#1e1a3f;--purple:#a855f7;
  --gray-bg:#1f2937;--gray:#6b7280;
  --teal-bg:#0d2620;--teal:#14b8a6;
  --gold:#d97706;--gold-bg:#1c1508;
  --r:10px;--rl:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.65}

header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:14px;min-height:72px;position:sticky;top:0;z-index:100}
.hdr-icon{font-size:26px;flex-shrink:0}
.hdr-info{flex:1}
.hdr-title{font-size:17px;font-weight:600;letter-spacing:-.2px}
.hdr-sub{font-size:13px;color:var(--muted);margin-top:2px}
.hdr-r{font-size:12px;color:var(--hint);font-weight:500;margin-left:auto;flex-shrink:0}

.trend-banner{background:#0e1320;border-bottom:1px solid var(--border);padding:16px 24px}
.trend-inner{max-width:740px;margin:0 auto}
.trend-title{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.trend-title::before{content:'';width:16px;height:1px;background:var(--blue);flex-shrink:0}
.trend-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.trend-stat{background:#0c1525;border:1px solid #1e3050;border-radius:8px;padding:12px 14px}
.ts-val{font-size:22px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;margin-bottom:2px}
.ts-label{font-size:12px;color:var(--muted);line-height:1.4}
.trend-note{background:#0c1525;border:1px solid #1e3050;border-left:3px solid var(--blue);border-radius:6px;padding:11px 14px;font-size:12.5px;color:#93b4d8;line-height:1.65}
.trend-note strong{color:var(--blue)}

.page{max-width:740px;margin:0 auto;padding:8px 18px 72px}

.prog-wrap{position:sticky;top:72px;z-index:99;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px 0}
.prog-inner{max-width:740px;margin:0 auto}
.prog-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--hint);font-weight:500;margin-bottom:7px}
.prog-track{height:3px;background:var(--border);border-radius:2px}
.prog-fill{height:100%;background:var(--blue);border-radius:2px;transition:width .4s cubic-bezier(.4,0,.2,1)}

.breadcrumb{display:flex;flex-wrap:wrap;gap:4px;min-height:24px;padding-bottom:10px;align-items:center}
.crumb{font-size:12px;background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:2px 9px;border-radius:20px;white-space:nowrap}
.crumb-sep{color:var(--hint);font-size:12px}

.q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:26px 28px;animation:fu .22s ease}
@keyframes fu{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.q-step{font-size:10px;font-weight:700;letter-spacing:1.2px;color:var(--blue);text-transform:uppercase;margin-bottom:9px}
.q-text{font-size:17px;font-weight:700;line-height:1.5;margin-bottom:6px;letter-spacing:-.3px}
.q-sub{font-size:12.5px;color:var(--muted);margin-bottom:20px;line-height:1.6}
.q-law{font-size:11px;color:var(--blue);background:var(--blue-bg);border:1px solid #1e3a6e;border-radius:6px;padding:7px 12px;margin-bottom:16px;line-height:1.6}
.options{display:flex;flex-direction:column;gap:7px}
.opt{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:13px 16px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:400;color:var(--text);text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:border-color .12s,background .12s,transform .08s;line-height:1.5}
.opt:hover{border-color:var(--blue);background:var(--blue-bg);transform:translateX(3px)}
.opt:active{transform:translateX(2px) scale(.99)}
.opt-l{flex:1}
.opt-main{font-weight:500}
.opt-sub{font-size:12px;color:var(--hint);margin-top:2px}
.opt-tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.opt-arr{color:var(--hint);font-size:16px;flex-shrink:0;transition:transform .12s}
.opt:hover .opt-arr{transform:translateX(2px);color:var(--blue)}

.tag-blue{background:var(--blue-bg);color:var(--blue)}
.tag-green{background:var(--green-bg);color:var(--green)}
.tag-amber{background:var(--amber-bg);color:var(--amber)}
.tag-red{background:var(--red-bg);color:var(--red)}
.tag-purple{background:var(--purple-bg);color:var(--purple)}
.tag-gray{background:var(--gray-bg);color:var(--gray)}
.tag-teal{background:var(--teal-bg);color:var(--teal)}
.tag-gold{background:var(--gold-bg);color:var(--gold)}

.back-btn{background:none;border:none;font-family:inherit;font-size:12.5px;color:var(--hint);cursor:pointer;padding:0;display:flex;align-items:center;gap:4px;margin-bottom:14px;transition:color .12s}
.back-btn:hover{color:var(--text)}

/* ── RESULT ── */
.result-wrap{animation:fu .3s ease}
.r-hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:26px 28px;margin-bottom:14px}
.r-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.r-badge{font-size:11px;font-weight:700;letter-spacing:.4px;padding:4px 12px;border-radius:20px;margin-bottom:10px;display:inline-block}
.r-title{font-size:20px;font-weight:700;letter-spacing:-.4px;margin-bottom:5px}
.r-desc{font-size:13px;color:var(--muted);line-height:1.65}
.grade-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:14px 18px;min-width:150px;text-align:center;flex-shrink:0}
.grade-label{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--hint);text-transform:uppercase;margin-bottom:6px}
.grade-val{font-size:13px;font-weight:700;letter-spacing:.3px;margin-bottom:2px}
.grade-sub{font-size:12px;color:var(--hint);margin-top:2px}
.flags{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.flag{font-size:12px;background:var(--bg);border:1px solid var(--border);color:var(--muted);padding:2px 10px;border-radius:20px}

.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:14px}
.section-hd{padding:13px 22px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.section-hd-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.section-hd-title{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.section-hd-count{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:auto}

.item{padding:14px 22px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start}
.item:last-child{border-bottom:none}
.item-pri{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:700}
.item-body{flex:1}
.item-title{font-size:13.5px;font-weight:700;margin-bottom:3px}
.item-desc{font-size:12.5px;color:var(--muted);line-height:1.6}

.alert{border-radius:var(--r);padding:12px 16px;margin-bottom:14px;font-size:13px;display:flex;gap:10px;align-items:flex-start;border:1px solid;line-height:1.6}
.alert-amber{background:var(--amber-bg);border-color:#7a5000;color:var(--amber)}
.alert-red{background:var(--red-bg);border-color:#7a2020;color:var(--red)}
.alert-blue{background:var(--blue-bg);border-color:#1e3a6e;color:var(--blue)}
.alert-green{background:var(--green-bg);border-color:#0a4030;color:var(--green)}
.alert-icon{flex-shrink:0;margin-top:1px;font-size:15px}

.phase{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;gap:14px}
.phase:last-child{border-bottom:none}
.ph-num{width:30px;height:30px;border-radius:50%;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.ph-body{flex:1}
.ph-tag{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.ph-title{font-size:14.5px;font-weight:700;margin-bottom:10px;letter-spacing:-.2px}
.ph-items{display:flex;flex-direction:column;gap:6px}
.ph-item{font-size:13px;color:var(--muted);display:flex;gap:7px;align-items:flex-start;line-height:1.6}
.ph-dot{width:5px;height:5px;border-radius:50%;background:var(--border2);margin-top:8px;flex-shrink:0}
.ph-item-body{flex:1}
.ph-sub{font-size:12px;color:var(--hint);line-height:1.7;margin-top:5px;background:rgba(255,255,255,.04);border-left:3px solid var(--border2);padding:8px 11px;border-radius:0 6px 6px 0}

.action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.btn-p{flex:1;min-width:160px;background:var(--blue);color:#fff;border:none;border-radius:var(--r);padding:13px 20px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .12s}
.btn-p:hover{opacity:.85}
.btn-g{background:var(--surface);color:var(--muted);border:1.5px solid var(--border);border-radius:var(--r);padding:13px 20px;font-family:inherit;font-size:14px;cursor:pointer;transition:border-color .12s,color .12s;white-space:nowrap}
.btn-g:hover{border-color:var(--border2);color:var(--text)}

@media(max-width:500px){.page{padding:18px 12px 56px}.q-card{padding:18px 16px}.q-text{font-size:15px}.r-title{font-size:17px}.phase{padding:14px 16px}.action-row{flex-direction:column}.btn-p{min-width:unset}.trend-grid{grid-template-columns:1fr 1fr}}
@media(max-width:380px){.trend-grid{grid-template-columns:1fr}}
@media print{.no-print{display:none!important}}

/* ── 대표 사례 버튼 ── */
.cases-wrap{margin-bottom:18px}
.cases-label{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.cases-label::after{content:'';flex:1;height:1px;background:var(--border)}
.cases-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.case-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:12px 14px;cursor:pointer;font-family:inherit;text-align:left;transition:border-color .12s,background .12s,transform .08s;display:flex;flex-direction:column;gap:5px}
.case-btn:hover{border-color:var(--blue);background:var(--blue-bg);transform:translateY(-2px)}
.case-btn:active{transform:translateY(0)}
.cb-icon{font-size:20px;line-height:1}
.cb-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;align-self:flex-start}
.cb-title{font-size:12.5px;font-weight:700;color:var(--text);line-height:1.4}
.cb-sub{font-size:12px;color:var(--hint);line-height:1.4}

/* ── PDF 업로드 섹션 ── */
.pdf-wrap{background:#0a1220;border:1.5px solid #1e3050;border-radius:var(--rl);overflow:hidden;margin-bottom:14px}
.pdf-hd{padding:14px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #1e3050}
.pdf-hd-icon{font-size:20px;flex-shrink:0}
.pdf-hd-title{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#38bdf8}
.pdf-hd-sub{font-size:12px;color:var(--muted);margin-top:2px}
.pdf-body{padding:16px 20px}
.pdf-source-note{font-size:12px;color:var(--hint);margin-bottom:12px;padding:7px 10px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:7px}
.pdf-btn-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pdf-file-btn{padding:8px 18px;border-radius:7px;border:1.5px solid #1e4a70;background:#0c1a30;color:#60a5fa;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.pdf-file-btn:hover{border-color:#3b82f6;background:#0d2040}
.pdf-filename{font-size:12px;color:var(--muted);font-style:italic}
.pdf-status{font-size:12px;min-height:18px;margin-bottom:8px;line-height:1.5}
.pdf-status.loading{color:#60a5fa}.pdf-status.ok{color:var(--green)}.pdf-status.warn{color:var(--amber)}.pdf-status.error{color:var(--red)}
.pdf-preview{background:#07101c;border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.pdf-preview-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.pdf-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pdf-row-label{font-size:12px;color:var(--muted);flex:0 0 160px}
.pdf-row-inp{flex:1;background:#0f1a2e;border:1px solid var(--border2);border-radius:6px;padding:5px 8px;font-size:13px;font-weight:600;color:var(--text);font-family:inherit;min-width:0}
.pdf-row-inp.found{border-color:rgba(16,185,129,.5);background:rgba(16,185,129,.05)}
.pdf-row-inp.notfound{border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.04)}
.pdf-row-badge{font-size:9px;padding:1px 6px;border-radius:8px;font-weight:700;flex-shrink:0}
.pdf-badge-ok{background:rgba(16,185,129,.15);color:var(--green)}
.pdf-badge-miss{background:rgba(245,158,11,.15);color:var(--amber)}
.pdf-unit-note{font-size:12px;color:var(--hint);margin-bottom:10px;padding:5px 8px;background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.2);border-radius:6px}
.pdf-apply-btn{padding:9px 22px;border-radius:7px;border:none;background:var(--green);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s}
.pdf-apply-btn:hover{opacity:.85}
.claude-divider{text-align:center;position:relative;margin:16px 0}
.claude-divider::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:var(--border)}
.claude-divider span{background:#0a1220;padding:0 10px;position:relative;font-size:12px;color:var(--hint)}
.claude-card{border:1.5px solid var(--border);border-radius:var(--r);padding:14px;background:#070f1b}
.claude-card.disabled{opacity:.6}
.claude-card-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.claude-icon{font-size:22px;flex-shrink:0}
.claude-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px;display:flex;align-items:center;gap:7px}
.claude-desc{font-size:12px;color:var(--muted)}
.paid-badge{font-size:9px;font-weight:700;background:rgba(239,68,68,.2);color:#fca5a5;border:1px solid rgba(239,68,68,.4);padding:1px 7px;border-radius:10px;letter-spacing:.04em}
.claude-btn{width:100%;padding:9px;border-radius:7px;border:1.5px solid var(--border);background:#0c1220;color:var(--muted);font-size:12px;font-weight:600;cursor:not-allowed;font-family:inherit;margin-bottom:8px}
.claude-notice{font-size:12px;color:var(--hint);background:rgba(239,68,68,.05);border:1px solid rgba(239,68,68,.2);border-radius:6px;padding:7px 10px;line-height:1.6}

/* ── 가치평가 계산기 ── */
.calc-wrap{background:#0c1220;border:1px solid #1e3050;border-radius:var(--rl);overflow:hidden;margin-bottom:14px}
.calc-hd{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;border-bottom:1px solid #1e3050}
.calc-hd-l{display:flex;align-items:center;gap:10px}
.calc-hd-title{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.calc-hd-badge{font-size:10px;font-weight:600;background:#0c1a30;color:var(--blue);border:1px solid #1e3a6e;padding:2px 8px;border-radius:10px}
.calc-toggle{font-size:18px;color:var(--muted);transition:transform .2s;line-height:1}
.calc-toggle.open{transform:rotate(180deg)}
.calc-body{padding:18px 20px;display:none}
.calc-body.open{display:block}
.calc-section-title{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.calc-section-title:first-child{margin-top:0}
.calc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:6px}
.calc-field{display:flex;flex-direction:column;gap:4px}
.calc-label{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--muted)}
.calc-input-wrap{display:flex;align-items:center;gap:6px}
.calc-inp{background:#131b2a;border:1px solid var(--border2);border-radius:8px;padding:7px 10px;font-size:14px;font-weight:600;color:var(--text);font-family:inherit;width:100%;min-width:0}
.calc-inp:focus{outline:none;border-color:var(--blue)}
.calc-unit{font-size:12px;color:var(--muted);white-space:nowrap;flex-shrink:0}
.calc-btn{margin-top:14px;width:100%;background:var(--blue);color:#fff;border:none;border-radius:var(--r);padding:11px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .12s}
.calc-btn:hover{opacity:.85}
.calc-result{margin-top:14px;background:#0a1525;border:1px solid #1e3a6e;border-radius:var(--r);padding:16px 18px;display:none}
.calc-result.show{display:block}
.calc-result-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:12px}
.calc-row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.calc-row:last-child{border-bottom:none}
.calc-row-label{font-size:12px;color:var(--muted)}
.calc-row-val{font-size:14px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.calc-row-val.hi{color:var(--blue)}
.calc-row-val.warn{color:var(--amber)}
.calc-row-val.main{font-size:18px;color:var(--blue)}
.calc-note{font-size:12px;color:var(--hint);margin-top:10px;line-height:1.6;padding-top:8px;border-top:1px solid rgba(255,255,255,.05)}
.calc-divider{border:none;border-top:1px solid var(--border);margin:10px 0}
</style>
</head>
<body>

<header>
  <div class="hdr-icon">📊</div>
  <div class="hdr-info">
    <div class="hdr-title" id="sv-hdr-title">비상장주식 가치평가 진단</div>
    <div class="hdr-sub" id="sv-hdr-sub">평가 목적별 최적 방법론 안내 · 세무리스크 사전 차단</div>
  </div>
  <div class="hdr-r" id="hdr-r"></div>
</header>

<div class="trend-banner">
  <div class="trend-inner">
    <div class="trend-title" id="sv-trend-title">비상장주식 평가, 왜 중요한가</div>
    <div class="trend-grid">
      <div class="trend-stat">
        <div class="ts-val">3가지</div>
        <div class="ts-label" id="sv-ts-lbl-1">법정 평가방법<br>(상증세법·회계·협상)</div>

function _svR(rId){ return svLang==='en' ? SV_EN.r[rId] : null; }
function currentQId(){
  if(path.length===0) return 'q0';
  const last=path[path.length-1];
  return TREE[last.qId].opts[last.optIdx].next;
}

/* ── 상태 ── */
let path = [];   // [{qId, optIdx}]
let result = null;

/* ── 유틸 ── */
function scrollToQ() {
  const pw = document.querySelector('.prog-wrap');
  window.scrollTo({ top: pw ? Math.max(0, pw.offsetTop - 72) : 0, behavior: 'smooth' });
}

function totalSteps(qId) {
  const node = TREE[qId];
  if (!node) return 1;
  let max = 0;
  for (const o of node.opts) {
    if (o.next && TREE[o.next]) {
      const sub = totalSteps(o.next);
      if (sub > max) max = sub;
    }
  }
  return 1 + max;
}

function updateProg() {
  const depth = path.length;
  const firstQ = TREE[path[0]?.qId || 'q0'];
  const total = firstQ ? totalSteps('q0') : 4;
  const pct = result ? 100 : Math.round((depth / total) * 90);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-pct').textContent = pct + '%';

  const isEn = svLang === 'en';
  const lbl = result
    ? (result.type === 'tax'
        ? (isEn ? 'Tax-Based Valuation Assessment Complete' : '세법 기반 평가 진단 완료')
        : (isEn ? 'Negotiation-Based Valuation Assessment Complete' : '협상 기반 평가 진단 완료'))
    : (depth === 0
        ? (isEn ? 'Start Assessment' : '진단 시작')
        : (isEn ? `Step ${depth} in progress` : `${depth}단계 진행 중`));
  document.getElementById('prog-lbl').textContent = lbl;

  const bc = document.getElementById('bc');
  bc.innerHTML = '';
  path.forEach((s, i) => {
    const q = TREE[s.qId];
    if (!q) return;
    const o = q.opts[s.optIdx];
    if (!o) return;
    const oe = SV_EN.q[s.qId]?.opts?.[s.optIdx];
    if (i > 0) { const sep = document.createElement('span'); sep.className = 'crumb-sep'; sep.textContent = '›'; bc.appendChild(sep); }
    const c = document.createElement('span'); c.className = 'crumb'; c.textContent = (isEn && oe?.main) ? oe.main : o.main; bc.appendChild(c);
  });

  const hr = document.getElementById('hdr-r');
  hr.textContent = depth > 0 ? (isEn ? `Step ${depth} complete` : `${depth}단계 완료`) : '';
}

function pick(qId, optIdx) {
  const q = TREE[qId];
  if (!q) return;
  path.push({ qId, optIdx });
  const next = q.opts[optIdx].next;
  if (TREE[next]) {
    render(next);
  } else {
    result = RESULTS[next];
    renderResult();
  }
  scrollToQ();
}

function goBack() {
  if (!path.length) return;
  result = null;
  path.pop();
  const last = path[path.length - 1];
  render(last ? last.qId : 'q0', last ? last.optIdx : undefined, true);
  scrollToQ();
}

function restart() {
  path = [];
  result = null;
  render('q0');
  scrollToQ();
}

/* ── 질문 렌더링 ── */
function buildCasesHtml() {
  const isEn = svLang === 'en';
  return `<div class="cases-wrap no-print">
    <div class="cases-label">${isEn ? 'Sample Cases — One-Click Results' : '대표 사례 — 원클릭 결과 보기'}</div>
    <div class="cases-grid">
      ${CASES.map((c,i) => {
        const ce = SV_EN.cases[i];
        const tag   = (isEn && ce?.tag)   ? ce.tag   : c.tag;
        const title = (isEn && ce?.title) ? ce.title : c.title;
        const sub   = (isEn && ce?.sub)   ? ce.sub   : c.sub;
        return `<button class="case-btn" onclick="runCase(${i})">
          <span class="cb-icon">${c.icon}</span>
          <span class="cb-tag ${c.tagClass}">${tag}</span>
          <span class="cb-title">${title}</span>
          <span class="cb-sub">${sub}</span>
        </button>`;
      }).join('')}
    </div>
  </div>`;
}

function runCase(idx) {
  const c = CASES[idx];
  path = [...c.path];
  result = RESULTS[c.resultKey];
  renderResult();
  // 계산기 값 자동 입력 및 계산 (DOM 렌더 후 실행)
  setTimeout(() => fillCalc(c.calc), 50);
  scrollToQ();
}

function fillCalc(calc) {
  const s = (id, val) => { const el = document.getElementById(id); if (el) el.value = val; };
  if (calc.type === 'weighted') {
    s('c_shares', calc.shares); s('c_ni1', calc.ni1);
    s('c_ni2', calc.ni2); s('c_ni3', calc.ni3);
    s('c_asset', calc.asset); s('c_liab', calc.liab);
    // 계산기 패널 열기 후 계산
    const hd = document.querySelector('.calc-wrap .calc-hd');
    if (hd && !hd.nextElementSibling.classList.contains('open')) toggleCalc(hd);
    calcWeighted();
  } else if (calc.type === 'na') {
    s('c_shares_na', calc.shares); s('c_asset_na', calc.asset); s('c_liab_na', calc.liab);
    const hd = document.querySelector('.calc-wrap .calc-hd');
    if (hd && !hd.nextElementSibling.classList.contains('open')) toggleCalc(hd);
    calcNA();
  } else if (calc.type === 'dcf') {
    s('d_ebitda', calc.ebitda); s('d_capex', calc.capex); s('d_shares', calc.shares);
    s('d_grow', calc.grow); s('d_wacc', calc.wacc); s('d_tgrow', calc.tgrow); s('d_tax', calc.tax);
    const hd = document.querySelector('.calc-wrap .calc-hd');
    if (hd && !hd.nextElementSibling.classList.contains('open')) toggleCalc(hd);
    calcDCF();
  } else if (calc.type === 'multiple') {
    s('m_rev', calc.rev); s('m_ebitda', calc.ebitda); s('m_shares', calc.shares);
    s('m_rmu', calc.rmu); s('m_emu', calc.emu); s('m_dlom', calc.dlom);
    const hd = document.querySelector('.calc-wrap .calc-hd');
    if (hd && !hd.nextElementSibling.classList.contains('open')) toggleCalc(hd);
    calcMultiple();
  }
}

function render(qId = 'q0', _prevOpt, back = false) {
  updateProg();
  const q = TREE[qId];
  const qe = SV_EN.q[qId];
  const isEn = svLang === 'en';
  let html = '';
  if (path.length > 0) {
    html += `<button class="back-btn no-print" onclick="goBack()">${isEn ? '← Back' : '← 이전으로'}</button>`;
  }
  if (qId === 'q0' && path.length === 0) {
    html += buildCasesHtml();
  }
  html += `<div class="q-card">
    <div class="q-step">${q.step}</div>
    <div class="q-text">${(isEn && qe?.text) ? qe.text : q.text}</div>
    <div class="q-sub">${(isEn && qe?.sub) ? qe.sub : q.sub}</div>`;
  if (q.law) html += `<div class="q-law">📌 ${(isEn && qe?.law) ? qe.law : q.law}</div>`;
  html += `<div class="options">`;
  q.opts.forEach((o, i) => {
    const oe = qe?.opts?.[i];
    const main = (isEn && oe?.main) ? oe.main : o.main;
    const sub  = (isEn && oe?.sub)  ? oe.sub  : o.sub;
    const tag  = (isEn && oe?.tag)  ? oe.tag  : o.tag;
    html += `<button class="opt" onclick="pick('${qId}',${i})">
      <span class="opt-l">
        <span class="opt-main">${main}</span>
        ${sub ? `<span class="opt-sub">${sub}</span>` : ''}
      </span>
      <span class="opt-tag ${o.tagClass}">${tag}</span>
      <span class="opt-arr">›</span>
    </button>`;
  });
  html += `</div></div>`;
  document.getElementById('view').innerHTML = html;
}

        <button class="claude-btn" disabled title="${isEn ? 'Service pending — API costs apply when activated' : '서비스 준비 중 — 활성화 시 API 비용 발생'}">
          🔒 ${isEn ? 'Service Pending (Claude Vision API)' : '서비스 준비 중 (Claude Vision API)'}
        </button>
        <div class="claude-notice">
          ⚠ <strong>${isEn ? 'Members-only paid service' : '회원 전용 유료 서비스'}</strong> — ${isEn ? 'Consumes credits. Text PDFs are processed free via PDF.js above. Recommended for scanned documents or when PDF.js extraction fails.' : '크레딧을 소모합니다. 일반 텍스트 PDF는 위 PDF.js 방식으로 무료 처리됩니다. 스캔 문서·사진 파일 또는 PDF.js 추출 실패 시 사용을 권장합니다.'}
        </div>
      </div>
    </div>
  </div>`;
}

/* ── PDF 선택 & 텍스트 추출 ── */
async function onPdfSelected(e) {
  const file = e.target.files[0];
  if (!file) return;

  document.getElementById('pdf-filename').textContent = file.name;
  const st = document.getElementById('pdf-status');
  const isEn = svLang === 'en';
  st.textContent = isEn ? '⏳ Extracting PDF text...' : '⏳ PDF 텍스트 추출 중...';
  st.className = 'pdf-status loading';
  document.getElementById('pdf-preview').style.display = 'none';

  if (typeof pdfjsLib === 'undefined') {
    st.textContent = isEn ? '❌ PDF.js library failed to load — check network connection' : '❌ PDF.js 라이브러리 로드 실패 — 네트워크 연결을 확인하세요';
    st.className = 'pdf-status error';
    return;
  }

  try {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;

    let fullText = '';
    const maxPages = Math.min(pdf.numPages, 30);
    for (let i = 1; i <= maxPages; i++) {
      const page   = await pdf.getPage(i);
      const items  = (await page.getTextContent()).items;
      // 좌표 기반 정렬: y 내림차순, x 오름차순 (테이블 행 순서 보존)
      const sorted = items.slice().sort((a, b) => {
        const dy = Math.round(b.transform[5]) - Math.round(a.transform[5]);
        return dy !== 0 ? dy : a.transform[4] - b.transform[4];
      });
      fullText += sorted.map(it => it.str).join(' ') + '\n';
    }

    if (fullText.replace(/\s/g, '').length < 200) {
      st.textContent = isEn
        ? '⚠ Scanned (image) PDF detected — Claude Vision is recommended (currently inactive)'
        : '⚠ 스캔(이미지) PDF로 감지됩니다 — Claude Vision 사용을 권장합니다 (현재 비활성)';
      st.className = 'pdf-status warn';
      return;
    }

    const parsed = parseFsText(fullText);
    _parsedData  = parsed;
    showParsedPreview(parsed);
    const found  = Object.values(parsed.values).filter(v => v !== null).length;
    const total  = Object.keys(parsed.values).length;
    st.textContent = isEn
      ? `✅ Extraction complete — ${found}/${total} items recognized (enter unrecognized items manually)`
      : `✅ 추출 완료 — ${found}/${total}개 항목 인식 (미인식 항목은 직접 입력하세요)`;
    st.className = found > 0 ? 'pdf-status ok' : 'pdf-status warn';
  } catch (err) {
    document.getElementById('pdf-status').textContent = (isEn ? '❌ Error: ' : '❌ 오류: ') + err.message;
    document.getElementById('pdf-status').className = 'pdf-status error';
  }
}

/* ── 재무제표 텍스트 파싱 ── */
function parseFsText(text) {
  // 1. 단위 감지
  let unitLabel = '원(추정)';
  let toMan = 0.0001; // 원 → 만원
  const uMatch = text.match(/단\s*위\s*[:\s]*([천백만억\d,\s]+원)/);
  if (uMatch) {
    const u = uMatch[1].replace(/\s/g, '');
    if      (u.includes('백만')) { toMan = 100;      unitLabel = '백만원 → 만원 변환'; }
    else if (u.includes('천'))   { toMan = 0.1;      unitLabel = '천원 → 만원 변환';  }
    else if (u.includes('억'))   { toMan = 10000;    unitLabel = '억원 → 만원 변환';  }
    else                          { toMan = 0.0001;  unitLabel = '원 → 만원 변환';    }
  }

  // 2. 숫자 파싱 헬퍼: "(1,234)" | "△1,234" | "-1,234" | "1,234"
  function parseNum(s) {
    if (!s) return null;
    const neg = /^[△▲\-\(]/.test(s.trim()) || /\)$/.test(s.trim());
    const n = parseFloat(s.replace(/[△▲,\(\)\s\-]/g, '')) || null;
    return n !== null ? Math.round(n * toMan * (neg ? -1 : 1)) : null;
  }

  // 3. 레이블 뒤 숫자 N개 추출
  function extract(labelRe, count = 3) {
    const m = text.match(labelRe);
    if (!m) return Array(count).fill(null);
    // 레이블 이후 텍스트에서 숫자 토큰 추출
    const after = text.slice(m.index + m[0].length, m.index + m[0].length + 300);
    const tokens = after.match(/[-△▲(]?[\d,]+[)]?/g) || [];
    return tokens.slice(0, count).map(parseNum);
  }

  function extractOne(labelRe) {
    return extract(labelRe, 1)[0];
  }

  // 4. 핵심 항목 파싱
  // 당기순이익: 손익계산서 3년치 (최신 → 과거 순서로 나타남)
  const niNums = extract(/당\s*기\s*순\s*이\s*익/, 3);

  // 자산·부채·자본 총계
  const assetNums  = extract(/자\s*산\s*총\s*계/, 2);
  const liabNums   = extract(/부\s*채\s*총\s*계/, 2);

  // 발행주식수
  let shares = extractOne(/발\s*행\s*주\s*식\s*수\s*[:\s]*([\d,]+)/);
  if (!shares) shares = extractOne(/주\s*식\s*수\s*[:\s]*([\d,]+)/);
  if (shares) shares = Math.round(shares / toMan); // 주식수는 단위변환 불필요, 역변환

  const values = {
    ni3:   niNums[0] || null,   // 최근년 (PDF에서 첫 번째로 나옴)
    ni2:   niNums[1] || null,   // 2년 전
    ni1:   niNums[2] || null,   // 3년 전
    asset: assetNums[0] || null,
    liab:  liabNums[0]  || null,
    shares: shares || null,
  };

  return { values, unitLabel };
}

/* ── 미리보기 렌더링 ── */
function showParsedPreview(parsed) {
  const { values, unitLabel } = parsed;
  document.getElementById('pdf-unit-note').textContent = svLang === 'en'
    ? '📐 Unit conversion: ' + unitLabel + ' · Figures below are in units of ₩10,000'
    : '📐 단위 변환: ' + unitLabel + ' · 아래 수치는 만원 단위입니다';

  function setRow(id, val) {
    const inp = document.getElementById(id);
    const badge = document.getElementById(id + '-b');
    if (!inp || !badge) return;
    if (val !== null) {
      inp.value = val;
      inp.className = 'pdf-row-inp found';
      badge.textContent = '✓';
      badge.className = 'pdf-row-badge pdf-badge-ok';
    } else {
      inp.value = '';
      inp.className = 'pdf-row-inp notfound';
      badge.textContent = '?';
      badge.className = 'pdf-row-badge pdf-badge-miss';
    }
  }

  setRow('pp-ni1', values.ni1);
  setRow('pp-ni2', values.ni2);
  setRow('pp-ni3', values.ni3);
  setRow('pp-asset', values.asset);
  setRow('pp-liab', values.liab);
  setRow('pp-shares', values.shares);

  document.getElementById('pdf-preview').style.display = 'block';
}

/* ── 계산기에 값 적용 ── */
function applyParsedToCalc() {
  const g = id => parseFloat(document.getElementById(id)?.value) || null;
  const s = (id, val) => { if (val !== null) { const el = document.getElementById(id); if (el) el.value = val; } };

  if (_calcType === 'weighted') {
    s('c_shares', g('pp-shares'));
    s('c_ni1',    g('pp-ni1'));
    s('c_ni2',    g('pp-ni2'));
    s('c_ni3',    g('pp-ni3'));

    s('c_liab',   g('pp-liab'));

  } else {

}

/* ── 포맷 유틸 ── */
function fmt(v) {
  if (svLang === 'en') {
    if (Math.abs(v) >= 100000000) return '₩' + (v / 100000000).toFixed(2) + '억';
    if (Math.abs(v) >= 10000) return '₩' + (v / 10000).toFixed(1) + '만';
    return '₩' + Math.round(v).toLocaleString();
  }
  if (Math.abs(v) >= 100000000) return (v / 100000000).toFixed(2) + '억원';
  if (Math.abs(v) >= 10000) return (v / 10000).toFixed(1) + '만원';
  return Math.round(v).toLocaleString() + '원';
}
function fmtPer(v) {
  return svLang === 'en'
    ? '₩' + Math.round(v).toLocaleString() + '/sh'
    : Math.round(v).toLocaleString() + '원/주';
}
function g(id) { return parseFloat(document.getElementById(id)?.value) || 0; }
function set(id, val, cls) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = val;
  if (cls) { el.className = 'calc-row-val ' + cls; }
}

/* ── 상증세법 가중평균 계산 ── */
function calcWeighted() {
  const shares = g('c_shares') || 1;
  const ni1 = g('c_ni1'), ni2 = g('c_ni2'), ni3 = g('c_ni3');
  const asset = g('c_asset'), liab = g('c_liab');
  // 가중평균 순손익: (1×1 + 2×2 + 3×3) / 6
  const wni = (ni1 * 1 + ni2 * 2 + ni3 * 3) / 6;
  // 순손익가치 = 가중평균순손익 / 10%
  const epv = wni / 0.1;
  const epvPerShare = epv / shares;
  // 순자산
  const na = asset - liab;
  const nav = na / shares;
  // 가중평균: (순손익가치×3 + 순자산가치×2) / 5
  const finalPerShare = Math.max((epvPerShare * 3 + nav * 2) / 5, nav * 0.8);
  const total = finalPerShare * shares;

  set('cr-wni', fmt(wni * 10000) + '/년', 'hi');
  set('cr-epv', fmtPer(epvPerShare * 10000));
  set('cr-na', fmt(na * 10000));
  set('cr-nav', fmtPer(nav * 10000));
  set('cr-final', fmtPer(finalPerShare * 10000), 'main');
  set('cr-total', fmt(total * 10000), 'main');
  document.getElementById('calc-res-w').classList.add('show');
}

/* ── 순자산가치 계산 ── */
function calcNA() {
  const shares = g('c_shares_na') || 1;
  const na = g('c_asset_na') - g('c_liab_na');
  const nav = na / shares;
  const floor = nav * 0.8;
  const total = nav * shares;

  set('cr-na2', fmt(na * 10000), 'hi');
  set('cr-nav2', fmtPer(nav * 10000), 'main');
  set('cr-total2', fmt(total * 10000), 'main');
  set('cr-floor', fmtPer(floor * 10000), 'warn');
  document.getElementById('calc-res-na').classList.add('show');
}

/* ── DCF 계산 ── */
function calcDCF() {
  const ebitda = g('d_ebitda'), capex = g('d_capex');
  const shares = g('d_shares') || 1;
  const growR = g('d_grow') / 100, wacc = g('d_wacc') / 100;
  const tGrow = g('d_tgrow') / 100, taxR = g('d_tax') / 100;
  const fcf0 = ebitda * (1 - taxR) - capex;

  let pvFcf = 0;
  let fcfN = fcf0;
  for (let t = 1; t <= 5; t++) {
    fcfN *= (1 + growR);
    pvFcf += fcfN / Math.pow(1 + wacc, t);
  }
  const tv = fcfN * (1 + tGrow) / (wacc - tGrow);
  const pvTv = tv / Math.pow(1 + wacc, 5);
  const ev = pvFcf + pvTv;
  const perShare = ev / shares;

  // 민감도: WACC +2%, -2%
  const calcEV = (w) => {
    let pv = 0, f = fcf0;
    for (let t = 1; t <= 5; t++) { f *= (1 + growR); pv += f / Math.pow(1 + w, t); }
    return pv + (f * (1 + tGrow) / (w - tGrow)) / Math.pow(1 + w, 5);
  };
  const lo = calcEV(wacc + 0.02), hi = calcEV(Math.max(wacc - 0.02, 0.01));

  set('dr-fcf0', fmt(fcf0 * 10000), 'hi');
  set('dr-pvfcf', fmt(pvFcf * 10000));
  set('dr-pvtv', fmt(pvTv * 10000));
  set('dr-ev', fmt(ev * 10000), 'main');
  set('dr-per', fmtPer(perShare * 10000), 'main');
  set('dr-range', fmt(lo * 10000) + ' ~ ' + fmt(hi * 10000), 'warn');
  document.getElementById('calc-res-dcf').classList.add('show');
}

/* ── 멀티플 계산 ── */
function calcMultiple() {
  const rev = g('m_rev'), ebitda = g('m_ebitda');
  const shares = g('m_shares') || 1;
  const rMu = g('m_rmu'), eMu = g('m_emu'), dlom = g('m_dlom') / 100;

  const evRev = rev * rMu;
  const evEbd = ebitda > 0 ? ebitda * eMu : 0;
  const avg = evEbd > 0 ? (evRev + evEbd) / 2 : evRev;
  const afterDlom = avg * (1 - dlom);
  const perShare = afterDlom / shares;

  set('mr-rev', fmt(evRev * 10000), 'hi');
  set('mr-ebd', evEbd > 0 ? fmt(evEbd * 10000) : (svLang==='en'?'N/A':'미입력'), evEbd > 0 ? 'hi' : '');
  set('mr-avg', fmt(avg * 10000));
  set('mr-dlom', fmt(afterDlom * 10000), 'main');
  set('mr-per', fmtPer(perShare * 10000), 'main');
  document.getElementById('calc-res-mul').classList.add('show');
}

    : '<strong>핵심:</strong> 비상장주식은 평가 목적에 따라 반드시 다른 방법론을 써야 합니다. 세금 목적에 시장가치를 쓰거나, 투자 협상에 세법상 가격을 제시하면 양쪽 모두 손해입니다.');
