<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>컨설팅 전체 마인드맵</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap');
:root{
  --bg:#0a0d14;--panel:#131b2a;--surface:#1c2640;--border:#263354;
  --text:#e2e8f0;--muted:#64748b;--hint:#334155;
  --blue:#3b82f6;--green:#10b981;--amber:#f59e0b;--red:#ef4444;
  --purple:#a855f7;--teal:#14b8a6;--gold:#d97706;--pink:#ec4899;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'IBM Plex Sans KR',sans-serif;background:var(--bg);color:var(--text)}

header{position:fixed;top:0;left:0;right:0;height:52px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:200}
.logo{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.logo-dot{width:7px;height:7px;background:var(--gold);border-radius:50%}
.hdr-r{font-size:11px;color:var(--muted)}

/* ── MAP CANVAS ── */
#map-wrap{position:fixed;top:52px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab}
#map-wrap.dragging{cursor:grabbing}
#map-svg{width:100%;height:100%;position:absolute;top:0;left:0}
#map-nodes{position:absolute;top:0;left:0;width:0;height:0}

/* ── NODE ── */
.node{position:absolute;transform:translate(-50%,-50%);user-select:none}
.node-box{border-radius:12px;padding:0;cursor:pointer;border:1.5px solid transparent;transition:transform .15s,box-shadow .15s,border-color .15s;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.node-box:hover{transform:scale(1.05);box-shadow:0 8px 32px rgba(0,0,0,.6)}
.node-box:active{transform:scale(0.98)}
.node-inner{padding:12px 16px;border-radius:11px}
.node-icon{font-size:20px;margin-bottom:5px;text-align:center}
.node-title{font-size:12px;font-weight:700;text-align:center;line-height:1.35;white-space:nowrap}
.node-sub{font-size:10px;opacity:.65;text-align:center;margin-top:3px;white-space:nowrap}
.node-tag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;display:inline-block;margin-top:5px;letter-spacing:.03em}

/* CENTER NODE */
.node-center .node-box{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.node-center .node-inner{padding:8px 10px;border-radius:50%;text-align:center}
.node-center .node-title{font-size:13px}

/* CATEGORY NODE */
.node-cat .node-box{min-width:120px}

/* LEAF NODE */
.node-leaf .node-box{min-width:130px;max-width:160px}
.node-leaf .node-title{white-space:normal;font-size:11px}

/* ── DETAIL PANEL ── */
#detail{position:fixed;right:0;top:52px;bottom:0;width:360px;background:var(--panel);border-left:1px solid var(--border);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:150;overflow-y:auto;display:flex;flex-direction:column}
#detail.open{transform:translateX(0)}
.detail-hd{padding:18px 20px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.detail-close{float:right;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;padding:2px 4px}
.detail-close:hover{color:var(--text)}
.detail-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:8px;display:inline-block}
.detail-title{font-size:16px;font-weight:700;margin-bottom:4px}
.detail-sub{font-size:12.5px;color:var(--muted);line-height:1.6}
.detail-body{padding:16px 20px;flex:1}
.detail-section{margin-bottom:18px}
.ds-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.check-list{display:flex;flex-direction:column;gap:5px}
.check-item{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--text);opacity:.85;line-height:1.5}
.check-dot{width:5px;height:5px;border-radius:50%;margin-top:7px;flex-shrink:0}
.grade-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.grade-pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px}
.detail-cta{margin:0 20px 20px;border-radius:10px;padding:13px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;border:1.5px solid;transition:opacity .12s;text-decoration:none}
.detail-cta:hover{opacity:.8}
.cta-icon{font-size:18px;flex-shrink:0}
.cta-text .ct-main{font-size:13px;font-weight:700;margin-bottom:1px}
.cta-text .ct-sub{font-size:11px;opacity:.65}

/* ── LEGEND ── */
#legend{position:fixed;bottom:16px;left:16px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 14px;z-index:150}
.leg-title{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;text-transform:uppercase}
.leg-row{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);margin-bottom:4px}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* ── ZOOM ── */
#zoom-ctrl{position:fixed;bottom:16px;right:380px;display:flex;gap:4px;z-index:150;transition:right .3s}
#detail.open ~ #zoom-ctrl{right:376px}
.zoom-btn{width:34px;height:34px;background:var(--panel);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:16px;color:var(--text);display:flex;align-items:center;justify-content:center;transition:background .12s}
.zoom-btn:hover{background:var(--surface)}

/* ── TOOLTIP ── */
#tooltip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--text);z-index:300;opacity:0;transition:opacity .15s;max-width:200px;line-height:1.5}

/* ── OVERVIEW PANEL ── */
#overview{position:fixed;left:16px;top:68px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 14px;z-index:150;max-width:200px}
.ov-title{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-bottom:7px;text-transform:uppercase}
.ov-item{display:flex;align-items:center;gap:7px;padding:3px 0;cursor:pointer;transition:opacity .12s}
.ov-item:hover{opacity:.7}
.ov-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ov-label{font-size:11.5px;color:var(--text);font-weight:500}
</style>

<div id="tooltip"></div>

/* ═══════════════════════════════════════════════════
   레이아웃 계산
═══════════════════════════════════════════════════ */
function polar(cx, cy, angleDeg, r) {
  const rad = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

const CX = 0, CY = 0;   // 논리 좌표 중심

// 카테고리 좌표 설정
CATEGORIES.forEach(c => {
  const p = polar(CX, CY, c.angle, c.r);
  c.x = p.x; c.y = p.y;
});

// 리프 좌표 설정
LEAVES.forEach(l => {
  const p = polar(CX, CY, l.angle, l.r);
  l.x = p.x; l.y = p.y;
});

/* ═══════════════════════════════════════════════════
   뷰포트 / 변환
═══════════════════════════════════════════════════ */
let vx = 0, vy = 30, scale = 0.78;

function worldToScreen(wx, wy) {
  const W = window.innerWidth, H = window.innerHeight - 52;
  return {
    x: W/2 + (wx - vx) * scale,
    y: H/2 + (wy - vy) * scale,
  };
}

/* ═══════════════════════════════════════════════════
   SVG 연결선 그리기
═══════════════════════════════════════════════════ */
const svg = document.getElementById('map-svg');

function drawLines() {
  svg.innerHTML = '';
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');

  // center→cat 선
  CATEGORIES.forEach(c => {
    const s = worldToScreen(CX, CY);
    const e = worldToScreen(c.x, c.y);
    const grad = document.createElementNS('http://www.w3.org/2000/svg','linearGradient');
    grad.id = 'g-'+c.id;
    grad.setAttribute('x1','0%'); grad.setAttribute('y1','0%');
    grad.setAttribute('x2','100%'); grad.setAttribute('y2','0%');
    const s1 = document.createElementNS('http://www.w3.org/2000/svg','stop');
    s1.setAttribute('offset','0%'); s1.setAttribute('stop-color','#d97706'); s1.setAttribute('stop-opacity','0.6');
    const s2 = document.createElementNS('http://www.w3.org/2000/svg','stop');
    s2.setAttribute('offset','100%'); s2.setAttribute('stop-color',c.color); s2.setAttribute('stop-opacity','0.6');
    grad.appendChild(s1); grad.appendChild(s2);
    defs.appendChild(grad);

    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', s.x); line.setAttribute('y1', s.y);
    line.setAttribute('x2', e.x); line.setAttribute('y2', e.y);
    line.setAttribute('stroke', `url(#g-${c.id})`);
    line.setAttribute('stroke-width', 1.5 * scale);
    line.setAttribute('stroke-dasharray', `${4*scale} ${3*scale}`);
    svg.appendChild(line);
  });

  // 중복 항목 cross-connection 헬퍼
  function drawCross(fromCatId, toLeafId, color) {
    const cat  = CATEGORIES.find(c => c.id === fromCatId);
    const leaf = LEAVES.find(l => l.id === toLeafId);
    if (!cat || !leaf) return;
    const s = worldToScreen(cat.x, cat.y);
    const e = worldToScreen(leaf.x, leaf.y);
    const ln = document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('x1', s.x); ln.setAttribute('y1', s.y);
    ln.setAttribute('x2', e.x); ln.setAttribute('y2', e.y);
    ln.setAttribute('stroke', color);
    ln.setAttribute('stroke-opacity', '0.45');
    ln.setAttribute('stroke-width', 0.9 * scale);
    ln.setAttribute('stroke-dasharray', `${4*scale} ${3*scale}`);
    svg.appendChild(ln);
  }
  // 소상공인 — 개인 primary, 기업 secondary (소규모 법인 겹침)
  drawCross('cat-biz', 'soho', '#3b82f6');
  // 상속·증여 — 개인 primary, 기업 secondary (사업주 상속 설계)
  drawCross('cat-biz', 'inheritance', '#3b82f6');
  // 중대재해 — 기업 primary, 개인사업자 secondary
  drawCross('cat-indiv', 'jdh', '#f97316');

  // cat→leaf 선
  LEAVES.forEach(l => {
    const cat = CATEGORIES.find(c => c.id === l.cat);
    if (!cat) return;
    const s = worldToScreen(cat.x, cat.y);
    const e = worldToScreen(l.x, l.y);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', s.x); line.setAttribute('y1', s.y);
    line.setAttribute('x2', e.x); line.setAttribute('y2', e.y);
    line.setAttribute('stroke', l.color);
    line.setAttribute('stroke-opacity', '0.35');
    line.setAttribute('stroke-width', 1 * scale);
    svg.appendChild(line);
  });

  svg.insertBefore(defs, svg.firstChild);
}

/* ═══════════════════════════════════════════════════
   노드 DOM 렌더
═══════════════════════════════════════════════════ */
const nodesEl = document.getElementById('map-nodes');

function makeNode(data, nodeClass, size) {
  const pos = worldToScreen(data.x, data.y);
  const div = document.createElement('div');
  div.className = `node ${nodeClass}`;
  div.id = 'node-'+data.id;
  div.style.left = pos.x + 'px';
  div.style.top  = pos.y + 'px';

  const titleLines = data.title.split('\n');

  if (nodeClass === 'node-center') {
    div.innerHTML = `<div class="node-box" style="background:${data.bg};border-color:${data.border||data.color};width:${size}px;height:${size}px"
      onclick="openDetail('${data.id}')">
      <div class="node-inner">
        <div class="node-icon" style="font-size:16px;color:${data.color};font-weight:900">${data.icon}</div>
        <div class="node-title" style="color:${data.color}">${titleLines.join('<br>')}</div>
        <div class="node-sub">${data.sub}</div>
      </div>
    </div>`;
  } else {
    const tagHtml = data.tag ? `<div><span class="node-tag" style="background:${data.tagColor||data.bg};color:${data.tagText||data.color}">${data.tag}</span></div>` : '';
    div.innerHTML = `<div class="node-box" style="background:${data.bg};border-color:${data.border||data.color}"
      onclick="openDetail('${data.id}')"
      onmouseenter="showTip(event,'${data.sub||''}')"
      onmouseleave="hideTip()">
      <div class="node-inner">
        <div class="node-icon">${data.icon}</div>
        <div class="node-title" style="color:${data.color}">${titleLines.join('<br>')}</div>
        ${tagHtml}
      </div>
    </div>`;
  }
  nodesEl.appendChild(div);
  return div;
}

function renderNodes() {
  nodesEl.innerHTML = '';
  makeNode(CENTER, 'node-center', Math.round(100 * scale));

  CATEGORIES.forEach(c => makeNode(c, 'node-cat', 110));
  LEAVES.forEach(l => makeNode(l, 'node-leaf', 140));
}

function updateNodePositions() {
  [CENTER, ...CATEGORIES, ...LEAVES].forEach(d => {
    const el = document.getElementById('node-'+d.id);
    if (!el) return;
    const pos = worldToScreen(d.x, d.y);
    el.style.left = pos.x + 'px';
    el.style.top  = pos.y + 'px';
  });
}

function redraw() {
  drawLines();
  updateNodePositions();
}

/* ═══════════════════════════════════════════════════
   상세 패널

function openDetail(id) {
  let data = null;
  if (id === 'center') {
    data = {
      id:'center', detail:{
        badge:'파트너 컨설팅', badgeColor:'#1c1508', badgeText:'#d97706',
        title:'파트너 컨설팅 맵',
        sub:'3개 카테고리, 13개 진단/서비스 노드. 각 노드를 클릭해 체크리스트를 시작하세요.',
        checks:['기업 컨설팅 — 경영진단·CEO플랜·중대재해·DART·ESG·현장클리닉','개인 컨설팅 — 예비창업패키지·소상공인 지원·상속·증여 진단','서비스·도구 — QR 생성기·파일명 자소복원·변환 결과 검증'],
        grades:['파트너 전용','컨설턴트 전용','무료'],
        gradeColors:['#d97706','#3b82f6','#a855f7'],
        cta:'경영종합진단으로 시작', ctaSub:'가장 많이 이용하는 체크리스트',
      }, href:'../gfc/index.html',
    };
  } else {
    data = LEAVES.find(l => l.id === id) || CATEGORIES.find(c => c.id === id);
  }
  if (!data || !data.detail) return;

  const D = data.detail;
  document.getElementById('d-badge').textContent = D.badge;
  document.getElementById('d-badge').style.background = D.badgeColor;
  document.getElementById('d-badge').style.color = D.badgeText;
  document.getElementById('d-title').textContent = D.title;
  document.getElementById('d-sub').textContent = D.sub;

  const checksHtml = (D.checks||[]).map(c=>`
    <div class="check-item">
      <div class="check-dot" style="background:${data.color||'#3b82f6'}"></div>
      <span>${c}</span>
    </div>`).join('');

  const gradesHtml = (D.grades||[]).map((g,i)=>`
    <span class="grade-pill" style="background:${(D.gradeColors[i]||'#3b82f6')}22;color:${D.gradeColors[i]||'#3b82f6'}">${g}</span>
  `).join('');

  document.getElementById('d-body').innerHTML = `
    ${D.checks?.length ? `<div class="detail-section">
      <div class="ds-label">체크리스트 항목</div>
      <div class="check-list">${checksHtml}</div>
    </div>` : ''}
    ${D.grades?.length ? `<div class="detail-section">
      <div class="ds-label">${D.grades.length > 2 ? '등급 체계' : '분류 구분'}</div>
      <div class="grade-pills">${gradesHtml}</div>
    </div>` : ''}
  `;

  const cta = document.getElementById('d-cta');
  cta.style.background = (data.color||'#3b82f6')+'22';
  cta.style.borderColor = (data.color||'#3b82f6')+'88';
  document.getElementById('d-cta-icon').style.color = data.color||'#3b82f6';
  document.getElementById('d-cta-main').textContent = D.cta;
  document.getElementById('d-cta-main').style.color = data.color||'#3b82f6';
  document.getElementById('d-cta-sub').textContent = D.ctaSub;

  // href — iframe 부모에서 로드 or 새탭
  const inIframe = window.self !== window.top;
  if (inIframe && data.href) {
    cta.href = '#';
    cta.onclick = (e) => {
      e.preventDefault();
      try {
        const base = window.location.href.replace(/\/consulting\/mindmap\/index\.html.*/, '/');
        const abs = new URL(data.href, window.location.href).pathname;
        window.parent.postMessage({ type:'loadIframe', path: data.href }, '*');
      } catch(ex) { window.open(data.href, '_blank'); }
    };
  } else if (data.href) {
    cta.href = data.href;
    cta.onclick = null;
    cta.target = '_blank';
  }

  document.getElementById('detail').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail').classList.remove('open');
}

/* ═══════════════════════════════════════════════════
   드래그·줌
═══════════════════════════════════════════════════ */
let dragging = false, lastX, lastY;
const wrap = document.getElementById('map-wrap');

wrap.addEventListener('mousedown', e => {
  if (e.target.closest('.node-box')) return;
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  wrap.classList.add('dragging');
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  vx -= (e.clientX - lastX) / scale;
  vy -= (e.clientY - lastY) / scale;
  lastX = e.clientX; lastY = e.clientY;
  redraw();
});
window.addEventListener('mouseup', () => { dragging = false; wrap.classList.remove('dragging'); });

wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.91;
  scale = Math.max(0.3, Math.min(2.5, scale * factor));
  redraw();
}, {passive:false});

// 터치
let lastPinchDist = null;
wrap.addEventListener('touchstart', e => {
  if (e.touches.length === 1) { dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
  if (e.touches.length === 2) { lastPinchDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); }
}, {passive:true});
wrap.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && dragging) {
    vx -= (e.touches[0].clientX - lastX) / scale;
    vy -= (e.touches[0].clientY - lastY) / scale;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    redraw();
  }
  if (e.touches.length === 2 && lastPinchDist) {
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    scale = Math.max(0.3, Math.min(2.5, scale * d / lastPinchDist));
    lastPinchDist = d;
    redraw();
  }
}, {passive:true});
wrap.addEventListener('touchend', () => { dragging = false; lastPinchDist = null; });

function zoom(f) { scale = Math.max(0.3, Math.min(2.5, scale * f)); redraw(); }
function resetView() { vx = 0; vy = 30; scale = 0.78; redraw(); }

/* ── 툴팁 ── */
function showTip(e, txt) {
  if (!txt) return;
  const tip = document.getElementById('tooltip');
  tip.textContent = txt; tip.style.opacity = '1';
  tip.style.left = (e.clientX + 10) + 'px';
  tip.style.top  = (e.clientY + 10) + 'px';
}
function hideTip() { document.getElementById('tooltip').style.opacity = '0'; }

/* ── Overview nav ── */
function buildOverview() {
  const ov = document.getElementById('overview');
  CATEGORIES.forEach(c => {
    const div = document.createElement('div');
    div.className = 'ov-item';
    div.innerHTML = `<div class="ov-dot" style="background:${c.color}"></div><span class="ov-label">${c.title.replace('\n',' ')}</span>`;
    div.onclick = () => { vx = c.x; vy = c.y; scale = 0.9; redraw(); };
    ov.appendChild(div);
  });
}

/* ── 초기화 ── */
renderNodes();
drawLines();
buildOverview();

window.addEventListener('resize', redraw);
