<!DOCTYPE html>
<html lang="ko">
<head>
<script>
(function(){
  if(window.self !== window.top){
    document.addEventListener('DOMContentLoaded', function(){
      var h = document.querySelector('header');
      if(h) h.style.display = 'none';
      // header가 숨겨지면 맵 캔버스를 top:0으로 조정
      var mw = document.getElementById('map-wrap');
      var dt = document.getElementById('detail');
      if(mw) mw.style.top = '0';
      if(dt) dt.style.top = '0';
    });
  }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>컨설팅 전체 마인드맵 — WorksFree 체크리스트 노드 한눈에 보기</title>
<meta name="description" content="WorksFree 컨설팅 전체 메뉴를 마인드맵으로 한눈에 확인. 경영진단·재무·인사·마케팅·법무 체크리스트 노드 전체 구조 시각화.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://www.worksfree.kr/consulting/mindmap/">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap');
:root{
  --bg:#0a0d14;--panel:#131b2a;--surface:#1c2640;--border:#263354;
  --text:#e2e8f0;--muted:#a8bdd1;--hint:#8fa3ba;
  --blue:#3b82f6;--green:#10b981;--amber:#f59e0b;--red:#ef4444;
  --purple:#a855f7;--teal:#14b8a6;--gold:#d97706;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'IBM Plex Sans KR',sans-serif;background:var(--bg);color:var(--text)}

header{position:fixed;top:0;left:0;right:0;height:52px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:200}
.logo{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.logo-dot{width:7px;height:7px;background:var(--gold);border-radius:50%}
.hdr-r{display:flex;align-items:center;gap:8px}
.hdr-hint{font-size:11px;color:var(--muted)}
.hdr-btn{padding:5px 12px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
.hdr-btn:hover{border-color:var(--blue);color:var(--blue)}
.hdr-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.hdr-btn.danger{border-color:var(--red);color:var(--red)}
.hdr-btn.danger:hover{background:#3b0f0f}

/* ── MAP CANVAS ── */
#map-wrap{position:fixed;top:52px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab}
#map-wrap.dragging{cursor:grabbing}
#map-wrap.connect-mode{cursor:crosshair}
#map-svg{width:100%;height:100%;position:absolute;top:0;left:0}
#map-nodes{position:absolute;top:0;left:0;width:0;height:0}

/* ── NODE ── */
.node{position:absolute;transform:translate(-50%,-50%);user-select:none}
.node-box{border-radius:12px;padding:0;cursor:pointer;border:1.5px solid transparent;transition:transform .15s,box-shadow .15s,border-color .15s;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.node-box:hover{transform:scale(1.05);box-shadow:0 8px 32px rgba(0,0,0,.6)}
.node-box:active{transform:scale(0.98)}
.node-inner{padding:12px 16px;border-radius:11px}
.node-icon{font-size:20px;margin-bottom:5px;text-align:center}
.node-title{font-size:12px;font-weight:700;text-align:center;line-height:1.35;white-space:nowrap}
.node-sub{font-size:10px;opacity:.65;text-align:center;margin-top:3px;white-space:nowrap}
.node-tag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;display:inline-block;margin-top:5px;letter-spacing:.03em}

/* ── 계층별 노드 크기 ── */
/* 1단계: 중심 — 가장 크게 */
.node-center .node-box{width:180px;height:180px;border-radius:50%;display:flex;align-items:center;justify-content:center;border-width:3px}
.node-center .node-inner{padding:12px 14px;border-radius:50%;text-align:center}
.node-center .node-icon{font-size:30px;margin-bottom:8px}
.node-center .node-title{font-size:20px;font-weight:900;letter-spacing:-.5px}
.node-center .node-sub{font-size:12px}

/* 2단계: 카테고리 — 두꺼운 테두리로 구분 */
.node-cat .node-box{min-width:148px;border-width:3.5px;box-shadow:0 4px 24px rgba(0,0,0,.5),0 0 12px rgba(255,255,255,.06)}
.node-cat .node-inner{padding:16px 20px}
.node-cat .node-icon{font-size:26px;margin-bottom:7px}
.node-cat .node-title{font-size:14px;font-weight:700;white-space:normal}
.node-cat .node-sub{font-size:11px}

/* 3단계: 리프 — 현재 크기 유지 */
.node-leaf .node-box{min-width:130px;max-width:160px}
.node-leaf .node-title{white-space:normal;font-size:11px}

/* ── EDIT MODE NODE STYLES ── */
body.edit-mode .node-box{cursor:move}
body.edit-mode .node-box:hover{outline:2px dashed var(--blue);outline-offset:3px}
body.edit-mode .node.selected .node-box{outline:2px solid #fff;outline-offset:3px}
.node-edit-btn{position:absolute;top:-10px;right:-10px;width:20px;height:20px;border-radius:50%;border:none;font-size:11px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:10;font-weight:700;line-height:1}
.node-del-btn{background:#ef4444;color:#fff}
.node-edit-label{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted);white-space:nowrap;display:none}
body.edit-mode .node-edit-btn{display:flex}
body.edit-mode .node-edit-label{display:block}

/* ── EDGE DELETE ── */
.edge-del-marker{cursor:pointer;fill:#ef4444;opacity:0}
body.edit-mode .edge-del-marker{opacity:.85}
body.edit-mode .edge-del-marker:hover{opacity:1;fill:#ff6b6b}
body.edit-mode .edge-hit{cursor:pointer;stroke:transparent;stroke-width:12}

/* ── CONNECT MODE ── */
body.connect-mode-active .node-box{outline:1px dashed var(--amber)!important;outline-offset:2px}
.connect-from .node-box{outline:2px solid var(--amber)!important;box-shadow:0 0 16px rgba(245,158,11,.5)!important}

/* ── EDIT TOOLBAR ── */
#edit-toolbar{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 14px;z-index:160;display:none;align-items:center;gap:8px;box-shadow:0 8px 32px rgba(0,0,0,.6)}
#edit-toolbar.show{display:flex}
.tb-btn{padding:5px 12px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit;white-space:nowrap}
.tb-btn:hover{border-color:var(--blue);color:var(--blue)}
.tb-btn.active{background:var(--amber);border-color:var(--amber);color:#000}
.tb-sep{width:1px;height:24px;background:var(--border);margin:0 2px}
.tb-hint{font-size:11px;color:var(--amber);max-width:200px}

/* ── DETAIL PANEL ── */
#detail{position:fixed;right:0;top:52px;bottom:0;width:360px;background:var(--panel);border-left:1px solid var(--border);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:150;overflow-y:auto;display:flex;flex-direction:column}
#detail.open{transform:translateX(0)}
.detail-hd{padding:18px 20px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.detail-close{float:right;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;padding:2px 4px}
.detail-close:hover{color:var(--text)}
.detail-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:8px;display:inline-block}
.detail-title{font-size:16px;font-weight:700;margin-bottom:4px}
.detail-sub{font-size:12.5px;color:var(--muted);line-height:1.6}
.detail-body{padding:16px 20px;flex:1}
.detail-section{margin-bottom:18px}
.ds-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.ds-edit-btn{font-size:10px;color:var(--blue);cursor:pointer;background:none;border:none;padding:0;display:none}
body.edit-mode .ds-edit-btn{display:inline}
.check-list{display:flex;flex-direction:column;gap:5px}
.check-item{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--text);opacity:.85;line-height:1.5}
.check-dot{width:5px;height:5px;border-radius:50%;margin-top:7px;flex-shrink:0}
.grade-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.grade-pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px}
.detail-cta{margin:0 20px 20px;border-radius:10px;padding:13px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;border:1.5px solid;transition:opacity .12s;text-decoration:none}
.detail-cta:hover{opacity:.8}
.cta-icon{font-size:18px;flex-shrink:0}
.cta-text .ct-main{font-size:13px;font-weight:700;margin-bottom:1px}
.cta-text .ct-sub{font-size:11px;opacity:.65}

/* ── LEGEND ── */
#legend{position:fixed;bottom:16px;left:16px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 14px;z-index:150}
.leg-title{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;text-transform:uppercase}
.leg-row{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);margin-bottom:4px}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* ── ZOOM ── */
#zoom-ctrl{position:fixed;bottom:16px;right:380px;display:flex;gap:4px;z-index:150;transition:right .3s}
#detail.open~#zoom-ctrl{right:376px}
.zoom-btn{width:34px;height:34px;background:var(--panel);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:16px;color:var(--text);display:flex;align-items:center;justify-content:center;transition:background .12s}
.zoom-btn:hover{background:var(--surface)}

/* ── TOOLTIP ── */
#tooltip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--text);z-index:300;opacity:0;transition:opacity .15s;max-width:200px;line-height:1.5}

/* ── OVERVIEW ── */
#overview{position:fixed;left:16px;top:68px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 14px;z-index:150;max-width:200px}
.ov-title{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-bottom:7px;text-transform:uppercase}
.ov-item{display:flex;align-items:center;gap:7px;padding:3px 0;cursor:pointer;transition:opacity .12s}
.ov-item:hover{opacity:.7}
.ov-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ov-label{font-size:11.5px;color:var(--text);font-weight:500}

/* ── NODE EDITOR MODAL ── */
#node-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:none;align-items:center;justify-content:center}
#node-modal.show{display:flex}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px;width:360px;max-height:80vh;overflow-y:auto;box-shadow:0 16px 64px rgba(0,0,0,.8)}
.modal-title{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.modal-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
.modal-field{margin-bottom:12px}
.modal-label{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:4px;display:block}
.modal-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:8px 10px;outline:none;font-family:inherit}
.modal-input:focus{border-color:var(--blue)}
.modal-textarea{min-height:80px;resize:vertical}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal-btn{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;cursor:pointer;font-family:inherit}
.modal-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.modal-btn:hover{opacity:.85}
.color-picker-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.color-swatch{width:24px;height:24px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:border-color .1s}
.color-swatch.selected{border-color:#fff}

/* ── 편집 컨트롤: 항상 표시, 상세 패널 열리면 왼쪽으로 이동 ── */
#edit-ctrl{
  position:fixed;top:8px;right:8px;z-index:500;
  display:flex;align-items:center;gap:6px;
  transition:right .3s cubic-bezier(.4,0,.2,1);
}
#edit-ctrl #hdr-hint{font-size:11px;color:var(--muted);display:none}
/* 상세 패널이 열리면 패널 왼쪽 경계에 붙음 (360px + 8px) */
#detail.open ~ #edit-ctrl{right:368px}
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-dot"></div>컨설팅 전체 — 마인드맵</div>
  <div class="hdr-r">
    <span class="hdr-hint" id="hdr-hint-main">드래그·핀치 확대 · 노드 클릭 시 상세보기</span>
  </div>
</header>

<!-- 편집 툴바 -->
<div id="edit-toolbar">
  <button class="tb-btn" onclick="startAddNode()">＋ 노드 추가</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="connect-btn" onclick="toggleConnectMode()">⚡ 연결 추가</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="saveState(true)">💾 저장</button>
  <span class="tb-hint" id="tb-hint" style="display:none"></span>
</div>

<div id="map-wrap">
  <svg id="map-svg"></svg>
  <div id="map-nodes"></div>
</div>

<!-- 상세 패널 -->
<div id="detail">
  <div class="detail-hd">
    <button class="detail-close" onclick="closeDetail()">✕</button>
    <div id="d-badge" class="detail-badge"></div>
    <div id="d-title" class="detail-title"></div>
    <div id="d-sub" class="detail-sub"></div>
  </div>
  <div class="detail-body" id="d-body"></div>
  <a id="d-cta" class="detail-cta" href="#" target="_parent">
    <div class="cta-icon" id="d-cta-icon">→</div>
    <div class="cta-text">
      <div class="ct-main" id="d-cta-main">진단 시작하기</div>
      <div class="ct-sub" id="d-cta-sub">체크리스트 열기</div>
    </div>
  </a>
</div>

<!-- 편집 컨트롤: #detail 뒤에 위치해야 CSS ~ 셀렉터 작동 -->
<div id="edit-ctrl">
  <span id="hdr-hint"></span>
  <button class="hdr-btn danger" id="reset-btn" onclick="confirmReset()" style="display:none">↺ 초기화</button>
  <button class="hdr-btn" id="edit-toggle-btn" onclick="toggleEditMode()">✏ 편집</button>
</div>

<div id="legend">
  <div class="leg-title">카테고리</div>
  <div class="leg-row"><div class="leg-dot" style="background:#3b82f6"></div>기업 컨설팅</div>
  <div class="leg-row"><div class="leg-dot" style="background:#f97316"></div>개인 컨설팅</div>
  <div class="leg-row"><div class="leg-dot" style="background:#a855f7"></div>서비스·도구</div>
</div>

<div id="overview">
  <div class="ov-title">Quick Nav</div>
</div>

<div id="zoom-ctrl">
  <button class="zoom-btn" onclick="zoom(1.2)">+</button>
  <button class="zoom-btn" onclick="zoom(0.83)">−</button>
  <button class="zoom-btn" onclick="resetView()">⊙</button>
</div>

<div id="tooltip"></div>

<!-- 노드 편집 모달 -->
<div id="node-modal">
  <div class="modal-box">
    <div class="modal-title">
      <span id="modal-title-text">노드 편집</span>
      <button class="modal-close" onclick="closeNodeModal()">✕</button>
    </div>
    <div class="modal-field">
      <label class="modal-label">아이콘</label>
      <input class="modal-input" id="m-icon" placeholder="🔑" maxlength="10">
    </div>
    <div class="modal-field">
      <label class="modal-label">제목 (줄바꿈: \n)</label>
      <input class="modal-input" id="m-title" placeholder="노드 제목">
    </div>
    <div class="modal-field">
      <label class="modal-label">부제목</label>
      <input class="modal-input" id="m-sub" placeholder="설명">
    </div>
    <div class="modal-field">
      <label class="modal-label">태그 (없으면 비워두기)</label>
      <input class="modal-input" id="m-tag" placeholder="파트너 전용">
    </div>
    <div class="modal-field">
      <label class="modal-label">색상</label>
      <div class="color-picker-row" id="m-colors">
        <div class="color-swatch selected" data-color="#3b82f6" style="background:#3b82f6" onclick="pickColor(this,'#3b82f6')"></div>
        <div class="color-swatch" data-color="#f97316" style="background:#f97316" onclick="pickColor(this,'#f97316')"></div>
        <div class="color-swatch" data-color="#a855f7" style="background:#a855f7" onclick="pickColor(this,'#a855f7')"></div>
        <div class="color-swatch" data-color="#10b981" style="background:#10b981" onclick="pickColor(this,'#10b981')"></div>
        <div class="color-swatch" data-color="#ef4444" style="background:#ef4444" onclick="pickColor(this,'#ef4444')"></div>
        <div class="color-swatch" data-color="#f59e0b" style="background:#f59e0b" onclick="pickColor(this,'#f59e0b')"></div>
        <div class="color-swatch" data-color="#14b8a6" style="background:#14b8a6" onclick="pickColor(this,'#14b8a6')"></div>
        <div class="color-swatch" data-color="#d97706" style="background:#d97706" onclick="pickColor(this,'#d97706')"></div>
      </div>
    </div>
    <div class="modal-field" id="m-detail-section" style="display:none">
      <label class="modal-label">링크 (href)</label>
      <input class="modal-input" id="m-href" placeholder="../gfc/index.html">
    </div>
    <div class="modal-field" id="m-checks-section">
      <label class="modal-label">체크리스트 항목 (한 줄에 하나)</label>
      <textarea class="modal-input modal-textarea" id="m-checks" placeholder="항목 1&#10;항목 2&#10;항목 3"></textarea>
    </div>
    <div class="modal-field">
      <label class="modal-label">노드 유형</label>
      <select class="modal-input" id="m-type">
        <option value="leaf">리프 (leaf)</option>
        <option value="cat">카테고리 (cat)</option>
      </select>
    </div>
    <div class="modal-footer">
      <button class="modal-btn" onclick="closeNodeModal()">취소</button>
      <button class="modal-btn primary" onclick="saveNodeModal()">저장</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════
   기본 노드 데이터 (편집 초기화 기준)
═══════════════════════════════════════════════════ */
function polar(cx, cy, deg, r) {
  const rad = (deg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function buildDefaults() {
  // ── 노드 ──────────────────────────────────────────────
  const nodes = [
    { id:'center', type:'center', x:0, y:0,
      icon:'◈', title:'컨설팅', sub:'전체 솔루션 맵',
      color:'#d97706', bg:'#1c1508', border:'#4a3000', detail: {
        badge:'파트너 컨설팅', badgeColor:'#1c1508', badgeText:'#d97706',
        title:'파트너 컨설팅 맵',
        sub:'3개 카테고리, 13개 진단/서비스 노드. 각 노드를 클릭해 체크리스트를 시작하세요.',

let NODES = [], EDGES = [];
let _nodeId = 100; // auto-increment for new nodes

function saveState(showToast) {
  localStorage.setItem('wf_mindmap_v2', JSON.stringify({ nodes: NODES, edges: EDGES, _nodeId }));
  if (showToast) showToastMsg('저장됐습니다 💾');
}

function loadState() {
  try {
    const s = localStorage.getItem('wf_mindmap_v2');
    if (!s) { const d = buildDefaults(); NODES = d.nodes; EDGES = d.edges; return; }
    const d = JSON.parse(s);
    NODES = d.nodes; EDGES = d.edges; _nodeId = d._nodeId || 100;
  } catch { const d = buildDefaults(); NODES = d.nodes; EDGES = d.edges; }
}

function confirmReset() {
  if (!confirm('마인드맵을 기본값으로 초기화하시겠습니까? 모든 변경사항이 삭제됩니다.')) return;
  localStorage.removeItem('wf_mindmap_v2');
  const d = buildDefaults(); NODES = d.nodes; EDGES = d.edges; _nodeId = 100;
  fullRender();
  showToastMsg('초기화 완료');
}

let vx = 0, vy = 30, scale = 0.78;

function worldToScreen(wx, wy) {
  const W = window.innerWidth, H = window.innerHeight - 52;
  return { x: W/2 + (wx - vx) * scale, y: H/2 + (wy - vy) * scale };
}
function screenToWorld(sx, sy) {
  const W = window.innerWidth, H = window.innerHeight - 52;
  return { x: (sx - W/2) / scale + vx, y: (sy - H/2 + 52) / scale + vy };
}

/* ═══════════════════════════════════════════════════
   SVG 연결선
═══════════════════════════════════════════════════ */
const svg = document.getElementById('map-svg');

function getNode(id) { return NODES.find(n => n.id === id); }

function drawLines() {
  svg.innerHTML = '';
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');

  EDGES.forEach(edge => {
    const fromN = getNode(edge.from);
    const toN   = getNode(edge.to);
    if (!fromN || !toN) return;

    const s = worldToScreen(fromN.x, fromN.y);
    const e = worldToScreen(toN.x,   toN.y);
    const mid = { x: (s.x+e.x)/2, y: (s.y+e.y)/2 };

    if (edge.style === 'main') {
      // 계층별 선 굵기: center→cat(굵게), cat→leaf(중간)
      const isCenterEdge = edge.from === 'center';
      const lineW = isCenterEdge ? 2.5*scale : 1.5*scale;
      const opacity = isCenterEdge ? 0.75 : 0.5;
      const dash = isCenterEdge ? `${5*scale} ${3*scale}` : `${4*scale} ${3*scale}`;

      const gid = 'g-'+edge.id;
      const grad = document.createElementNS('http://www.w3.org/2000/svg','linearGradient');
      grad.id = gid;
      grad.setAttribute('x1','0%'); grad.setAttribute('y1','0%');
      grad.setAttribute('x2','100%'); grad.setAttribute('y2','0%');
      ['0%','100%'].forEach((off,i) => {
        const st = document.createElementNS('http://www.w3.org/2000/svg','stop');
        st.setAttribute('offset', off);
        st.setAttribute('stop-color', i===0 ? fromN.color||'#d97706' : toN.color||'#3b82f6');
        st.setAttribute('stop-opacity', opacity);
        grad.appendChild(st);
      });
      defs.appendChild(grad);
      const line = makeSvgLine(s,e,`url(#${gid})`,lineW,dash);
      svg.appendChild(line);
    } else {
      // cross 선: 얇게
      const line = makeSvgLine(s,e,edge.color||'#888',0.9*scale,`${4*scale} ${3*scale}`,0.4);
      svg.appendChild(line);
    }

    // 편집 모드: 히트영역 + 삭제 버튼
    if (editMode) {
      const hit = makeSvgLine(s,e,'transparent',12*scale,'none',0.01);
      hit.setAttribute('data-edge-id', edge.id);
      hit.classList.add('edge-hit');
      hit.addEventListener('click', (ev) => { ev.stopPropagation(); deleteEdge(edge.id); });
      svg.appendChild(hit);

      // 중간 × 마커
      const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
      circle.setAttribute('cx', mid.x); circle.setAttribute('cy', mid.y);
      circle.setAttribute('r', 7*scale);
      circle.classList.add('edge-del-marker');
      circle.setAttribute('data-edge-id', edge.id);
      circle.addEventListener('click', (ev) => { ev.stopPropagation(); deleteEdge(edge.id); });
      svg.appendChild(circle);

      const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
      txt.setAttribute('x', mid.x); txt.setAttribute('y', mid.y+4*scale);
      txt.setAttribute('text-anchor','middle');
      txt.setAttribute('font-size', 9*scale);
      txt.setAttribute('fill','#fff');
      txt.setAttribute('pointer-events','none');
      txt.textContent = '×';
      svg.appendChild(txt);
    }
  });

  // 연결 모드: 미리보기 선
  if (connectMode && connectFrom && connectPreview) {
    const fn = getNode(connectFrom);
    if (fn) {
      const s = worldToScreen(fn.x, fn.y);
      const line = makeSvgLine(s, connectPreview, '#f59e0b', 1.5*scale, `${5*scale} ${3*scale}`, 0.8);
      svg.appendChild(line);
    }
  }

  svg.insertBefore(defs, svg.firstChild);
}

function makeSvgLine(s, e, stroke, width, dashArr, opacity=1) {
  const line = document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1',s.x); line.setAttribute('y1',s.y);
  line.setAttribute('x2',e.x); line.setAttribute('y2',e.y);
  line.setAttribute('stroke',stroke);
  line.setAttribute('stroke-width',width);
  line.setAttribute('stroke-dasharray',dashArr);
  line.setAttribute('stroke-opacity',opacity);
  return line;
}

/* ═══════════════════════════════════════════════════
   노드 렌더
═══════════════════════════════════════════════════ */
const nodesEl = document.getElementById('map-nodes');

function makeNodeEl(data) {
  const pos = worldToScreen(data.x, data.y);
  const div = document.createElement('div');
  div.className = `node node-${data.type}`;
  div.id = 'node-'+data.id;
  div.style.left = pos.x+'px';
  div.style.top  = pos.y+'px';

  const titleLines = (data.title||'').split('\n');
  const tagHtml = data.tag ? `<div><span class="node-tag" style="background:${data.tagColor||data.bg};color:${data.tagText||data.color}">${data.tag}</span></div>` : '';

  if (data.type === 'center') {
    const sz = Math.round(180 * scale);
    div.innerHTML = `<div class="node-box" style="background:${data.bg};border-color:${data.border||data.color};width:${sz}px;height:${sz}px">
      <div class="node-inner">
        <div class="node-icon" style="color:${data.color};font-weight:900">${data.icon||'◈'}</div>
        <div class="node-title" style="color:${data.color}">${titleLines.join('<br>')}</div>
        <div class="node-sub">${data.sub||''}</div>
      </div>
    </div>`;
  } else {
    div.innerHTML = `<div class="node-box" style="background:${data.bg};border-color:${data.border||data.color}"
      onmouseenter="showTip(event,'${(data.sub||'').replace(/'/g,'')}')"
      onmouseleave="hideTip()">
      <div class="node-inner">
        <div class="node-icon">${data.icon||'●'}</div>
        <div class="node-title" style="color:${data.color}">${titleLines.join('<br>')}</div>
        ${tagHtml}
      </div>
    </div>
    <button class="node-edit-btn node-del-btn" onclick="deleteNode('${data.id}')" title="삭제">✕</button>
    <span class="node-edit-label">더블클릭 편집</span>`;
  }

  // 클릭 핸들러
  div.querySelector('.node-box').addEventListener('click', (e) => {
    if (nodeDragging) return;
    if (connectMode) { handleConnectClick(data.id); return; }
    if (!editMode) { openDetail(data.id); return; }
    // 편집 모드에서 단순 클릭은 아무것도 안 함 (더블클릭으로 편집)
  });
  div.querySelector('.node-box').addEventListener('dblclick', (e) => {
    if (editMode) { e.stopPropagation(); openNodeModal(data.id); }
  });

  // 노드 드래그 (편집 모드)
  div.querySelector('.node-box').addEventListener('mousedown', (e) => {
    if (!editMode || connectMode) return;
    e.stopPropagation();
    startNodeDrag(e, data.id);
  });

  nodesEl.appendChild(div);
  return div;
}

function renderNodes() {
  nodesEl.innerHTML = '';
  NODES.forEach(n => makeNodeEl(n));
}

function updateNodePositions() {
  NODES.forEach(n => {
    const el = document.getElementById('node-'+n.id);
    if (!el) return;
    const pos = worldToScreen(n.x, n.y);
    el.style.left = pos.x+'px';
    el.style.top  = pos.y+'px';
  });
}

function redraw() { drawLines(); updateNodePositions(); }
function fullRender() { renderNodes(); drawLines(); buildOverview(); }

/* ═══════════════════════════════════════════════════
   편집 모드
═══════════════════════════════════════════════════ */
let editMode = false;

function toggleEditMode() {
  editMode = !editMode;
  document.body.classList.toggle('edit-mode', editMode);
  document.getElementById('edit-toggle-btn').classList.toggle('active', editMode);
  document.getElementById('edit-toggle-btn').textContent = editMode ? '✓ 완료' : '✏ 편집';
  document.getElementById('reset-btn').style.display = editMode ? '' : 'none';
  document.getElementById('edit-toolbar').classList.toggle('show', editMode);
  const hint = document.getElementById('hdr-hint');
  hint.textContent = editMode ? '더블클릭: 편집  드래그: 이동  ✕: 삭제' : '';
  hint.style.display = editMode ? '' : 'none';
  if (!editMode) { saveState(false); setConnectMode(false); }
  fullRender();
}

/* ── 노드 드래그 ── */
let nodeDragging = false;
let nodeDragId = null, nodeDragStartX, nodeDragStartY, nodeDragOrigX, nodeDragOrigY;

function startNodeDrag(e, id) {
  nodeDragging = false; // will set true on first move
  nodeDragId = id;
  nodeDragStartX = e.clientX;
  nodeDragStartY = e.clientY;
  const n = getNode(id);
  nodeDragOrigX = n.x; nodeDragOrigY = n.y;
}

window.addEventListener('mousemove', e => {
  if (nodeDragId) {
    const dx = e.clientX - nodeDragStartX;
    const dy = e.clientY - nodeDragStartY;
    if (!nodeDragging && (Math.abs(dx) > 3 || Math.abs(dy) > 3)) nodeDragging = true;
    if (nodeDragging) {
      const n = getNode(nodeDragId);
      if (n) { n.x = nodeDragOrigX + dx / scale; n.y = nodeDragOrigY + dy / scale; redraw(); }
    }
  }
});
window.addEventListener('mouseup', () => {
  if (nodeDragId) { if (nodeDragging) saveState(false); nodeDragId = null; setTimeout(()=>{ nodeDragging=false; },50); }
});

/* ═══════════════════════════════════════════════════
   연결 추가/삭제
═══════════════════════════════════════════════════ */
let connectMode = false, connectFrom = null, connectPreview = null;

function toggleConnectMode() {
  setConnectMode(!connectMode);
}

function setConnectMode(on) {
  connectMode = on;
  connectFrom = null;
  connectPreview = null;
  document.getElementById('connect-btn').classList.toggle('active', on);
  document.getElementById('map-wrap').classList.toggle('connect-mode', on);
  document.body.classList.toggle('connect-mode-active', on);
  const hint = document.getElementById('tb-hint');
  if (on) { hint.style.display=''; hint.textContent='첫 번째 노드 클릭 → 두 번째 노드 클릭'; }
  else { hint.style.display='none'; }
  drawLines();
}

function handleConnectClick(id) {
  if (!connectFrom) {
    connectFrom = id;
    document.getElementById('node-'+id)?.classList.add('connect-from');
    document.getElementById('tb-hint').textContent = '두 번째 노드를 클릭하세요 (ESC 취소)';
  } else {
    if (id === connectFrom) { cancelConnect(); return; }
    // 이미 존재하는 엣지인지 확인
    const exists = EDGES.some(e => (e.from===connectFrom&&e.to===id)||(e.from===id&&e.to===connectFrom));
    if (!exists) {
      const fromN = getNode(connectFrom);
      EDGES.push({ id:'e-u-'+(++_nodeId), from:connectFrom, to:id, style:'cross', color:fromN?.color||'#888' });
      saveState(false);
    }
    cancelConnect();
    drawLines();
  }
}

function cancelConnect() {
  if (connectFrom) document.getElementById('node-'+connectFrom)?.classList.remove('connect-from');
  setConnectMode(false);
}

function deleteEdge(edgeId) {
  if (!confirm('연결선을 삭제하시겠습니까?')) return;
  EDGES = EDGES.filter(e => e.id !== edgeId);
  saveState(false);
  drawLines();
}

// 연결 모드에서 마우스 이동 → 미리보기 선
document.getElementById('map-wrap').addEventListener('mousemove', e => {
  if (connectMode && connectFrom) {
    connectPreview = { x: e.clientX, y: e.clientY - 52 + 52 }; // adjust for header
    connectPreview = { x: e.clientX, y: e.clientY };
    drawLines();
  }
});

/* ═══════════════════════════════════════════════════
   노드 추가/삭제
═══════════════════════════════════════════════════ */
let addingNode = false;

function startAddNode() {
  if (addingNode) { addingNode=false; document.getElementById('map-wrap').style.cursor=''; return; }
  addingNode = true;
  document.getElementById('map-wrap').style.cursor = 'cell';
  showToastMsg('캔버스를 클릭해 노드를 배치하세요');
}

document.getElementById('map-wrap').addEventListener('click', e => {
  if (!addingNode) return;
  if (e.target.closest('.node-box')) return;
  addingNode = false;
  document.getElementById('map-wrap').style.cursor = '';
  const wp = screenToWorld(e.clientX, e.clientY - 52);
  const newId = 'user-'+(++_nodeId);
  const newNode = {
    id: newId, type:'leaf', x: wp.x, y: wp.y,
    icon:'●', title:'새 노드', sub:'',
    color:'#3b82f6', bg:'#0c1a30', border:'#2563eb',
    tag:'', tagColor:'', tagText:'',
    href:'', detail:{ badge:'', badgeColor:'#0c1a30', badgeText:'#3b82f6',
      title:'새 노드', sub:'', checks:[], grades:[], gradeColors:[],
      cta:'열기', ctaSub:'',
    }
  };
  NODES.push(newNode);
  saveState(false);
  fullRender();
  openNodeModal(newId);
});

function deleteNode(id) {
  if (!editMode) return;
  if (!confirm('이 노드를 삭제하시겠습니까?')) return;
  NODES = NODES.filter(n => n.id !== id);
  EDGES = EDGES.filter(e => e.from !== id && e.to !== id);
  const el = document.getElementById('node-'+id);
  if (el) el.remove();
  saveState(false);
  drawLines();
}

/* ═══════════════════════════════════════════════════
   노드 편집 모달
═══════════════════════════════════════════════════ */
let editingNodeId = null;
let pickedColor = '#3b82f6';

function pickColor(el, color) {
  pickedColor = color;
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
  el.classList.add('selected');
}

function openNodeModal(id) {
  editingNodeId = id;
  const n = getNode(id);
  if (!n) return;
  document.getElementById('modal-title-text').textContent = n.id.startsWith('user-') ? '노드 편집' : '노드 편집';
  document.getElementById('m-icon').value = n.icon||'';
  document.getElementById('m-title').value = n.title||'';
  document.getElementById('m-sub').value = n.sub||'';
  document.getElementById('m-tag').value = n.tag||'';
  document.getElementById('m-href').value = n.href||'';
  document.getElementById('m-type').value = n.type==='cat' ? 'cat' : 'leaf';
  document.getElementById('m-detail-section').style.display = '';
  const checks = n.detail?.checks || [];
  document.getElementById('m-checks').value = checks.join('\n');

  pickedColor = n.color||'#3b82f6';
  document.querySelectorAll('.color-swatch').forEach(s => {
    s.classList.toggle('selected', s.dataset.color === pickedColor);
  });
  document.getElementById('node-modal').classList.add('show');
}

function closeNodeModal() {
  document.getElementById('node-modal').classList.remove('show');
  editingNodeId = null;
}

function saveNodeModal() {
  const n = getNode(editingNodeId);
  if (!n) { closeNodeModal(); return; }

  n.icon  = document.getElementById('m-icon').value.trim() || n.icon;
  n.title = document.getElementById('m-title').value.trim() || n.title;
  n.sub   = document.getElementById('m-sub').value.trim();
  n.tag   = document.getElementById('m-tag').value.trim();
  n.href  = document.getElementById('m-href').value.trim();
  n.type  = document.getElementById('m-type').value;
  n.color  = pickedColor;
  n.border = pickedColor;
  n.tagColor = pickedColor+'33';
  n.tagText  = pickedColor;

  const checksRaw = document.getElementById('m-checks').value;
  const checks = checksRaw.split('\n').map(s=>s.trim()).filter(Boolean);
  if (!n.detail) n.detail = {};
  n.detail.checks = checks;
  n.detail.title  = n.title.replace('\n',' ');

  saveState(false);
  closeNodeModal();
  const el = document.getElementById('node-'+n.id);
  if (el) el.remove();
  makeNodeEl(n);
  drawLines();
}

document.getElementById('node-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('node-modal')) closeNodeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('node-modal').classList.contains('show')) { closeNodeModal(); return; }
    if (connectMode) { cancelConnect(); return; }
    if (addingNode) { addingNode=false; document.getElementById('map-wrap').style.cursor=''; }
  }
});

/* ═══════════════════════════════════════════════════
   상세 패널 (뷰 모드)
═══════════════════════════════════════════════════ */
function openDetail(id) {
  const data = NODES.find(n => n.id === id);
  if (!data || !data.detail) return;
  const D = data.detail;

  document.getElementById('d-badge').textContent = D.badge||'';
  document.getElementById('d-badge').style.background = D.badgeColor||data.bg||'#1c2640';
  document.getElementById('d-badge').style.color = D.badgeText||data.color||'#3b82f6';
  document.getElementById('d-title').textContent = D.title||data.title||'';
  document.getElementById('d-sub').textContent   = D.sub||data.sub||'';

  const col = data.color||'#3b82f6';
  const checksHtml = (D.checks||[]).map(c=>`
    <div class="check-item">
      <div class="check-dot" style="background:${col}"></div><span>${c}</span>
    </div>`).join('');
  const gradesHtml = (D.grades||[]).map((g,i)=>`
    <span class="grade-pill" style="background:${(D.gradeColors[i]||col)}22;color:${D.gradeColors[i]||col}">${g}</span>`).join('');

  document.getElementById('d-body').innerHTML = `
    ${D.checks?.length?`<div class="detail-section">
      <div class="ds-label">체크리스트 항목
        <button class="ds-edit-btn" onclick="openNodeModal('${id}')">✏ 편집</button>
      </div>
      <div class="check-list">${checksHtml}</div>
    </div>`:''}
    ${D.grades?.length?`<div class="detail-section">
      <div class="ds-label">${D.grades.length>2?'등급 체계':'분류 구분'}</div>
      <div class="grade-pills">${gradesHtml}</div>
    </div>`:''}`;

  const cta = document.getElementById('d-cta');
  cta.style.background = col+'22';
  cta.style.borderColor = col+'88';
  document.getElementById('d-cta-icon').style.color = col;
  document.getElementById('d-cta-main').textContent = D.cta||'열기';
  document.getElementById('d-cta-main').style.color = col;
  document.getElementById('d-cta-sub').textContent = D.ctaSub||'';

  const inIframe = window.self !== window.top;
  if (inIframe && data.href) {
    cta.href = '#';
    cta.onclick = ev => {
      ev.preventDefault();
      try { window.parent.postMessage({ type:'loadIframe', path: data.href }, '*'); } catch { window.open(data.href,'_blank'); }
    };
  } else if (data.href) {
    cta.href = data.href; cta.onclick = null; cta.target = '_blank';
  } else { cta.style.display='none'; }

  document.getElementById('detail').classList.add('open');
}

function closeDetail() { document.getElementById('detail').classList.remove('open'); }

/* ═══════════════════════════════════════════════════
   캔버스 드래그·줌
═══════════════════════════════════════════════════ */
let canvasDragging = false, lastX, lastY;
const wrap = document.getElementById('map-wrap');

wrap.addEventListener('mousedown', e => {
  if (nodeDragId) return;
  if (e.target.closest('.node-box')) return;
  if (connectMode) return;
  canvasDragging = true; lastX = e.clientX; lastY = e.clientY;
  wrap.classList.add('dragging');
});
window.addEventListener('mousemove', e => {
  if (!canvasDragging) return;
  vx -= (e.clientX - lastX) / scale;
  vy -= (e.clientY - lastY) / scale;
  lastX = e.clientX; lastY = e.clientY;
  redraw();
});
window.addEventListener('mouseup', () => { canvasDragging = false; wrap.classList.remove('dragging'); });

wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.1 : 0.91;
  scale = Math.max(0.3, Math.min(2.5, scale * f));
  redraw();
}, {passive:false});

let lastPinchDist = null;
wrap.addEventListener('touchstart', e => {
  if (e.touches.length===1) { canvasDragging=true; lastX=e.touches[0].clientX; lastY=e.touches[0].clientY; }
  if (e.touches.length===2) lastPinchDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
}, {passive:true});
wrap.addEventListener('touchmove', e => {
  if (e.touches.length===1 && canvasDragging) {
    vx -= (e.touches[0].clientX - lastX) / scale;
    vy -= (e.touches[0].clientY - lastY) / scale;
    lastX=e.touches[0].clientX; lastY=e.touches[0].clientY; redraw();
  }
  if (e.touches.length===2 && lastPinchDist) {
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    scale = Math.max(0.3, Math.min(2.5, scale * d / lastPinchDist));
    lastPinchDist = d; redraw();
  }
}, {passive:true});
wrap.addEventListener('touchend', () => { canvasDragging=false; lastPinchDist=null; });

function zoom(f) { scale = Math.max(0.3, Math.min(2.5, scale * f)); redraw(); }
function resetView() { fitAll(); }

function fitAll() {
  if (!NODES.length) return;
  const HEADER = 52;
  const W = window.innerWidth;
  const H = window.innerHeight - HEADER;
  const PAD_NODE = 100; // 노드 크기 여유분
  const MARGIN   = 60;  // 화면 가장자리 여백

  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  NODES.forEach(n => {
    minX = Math.min(minX, n.x - PAD_NODE);
    maxX = Math.max(maxX, n.x + PAD_NODE);
    minY = Math.min(minY, n.y - PAD_NODE);
    maxY = Math.max(maxY, n.y + PAD_NODE);
  });

  const contentW = maxX - minX;
  const contentH = maxY - minY;
  const scaleX = (W - MARGIN * 2) / contentW;
  const scaleY = (H - MARGIN * 2) / contentH;
  scale = Math.max(0.2, Math.min(1.5, Math.min(scaleX, scaleY)));

  vx = (minX + maxX) / 2;
  vy = (minY + maxY) / 2;
  redraw();
}

/* ── 툴팁 ── */
function showTip(e, txt) {
  if (!txt || editMode) return;
  const tip = document.getElementById('tooltip');
  tip.textContent = txt; tip.style.opacity='1';
  tip.style.left = (e.clientX+10)+'px'; tip.style.top = (e.clientY+10)+'px';
}
function hideTip() { document.getElementById('tooltip').style.opacity='0'; }

/* ── 토스트 ── */
function showToastMsg(msg) {
  let t = document.getElementById('toast-msg');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast-msg';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1c2640;color:#e2e8f0;border:1px solid #263354;border-radius:8px;padding:8px 18px;font-size:13px;z-index:9999;transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(t._to); t._to = setTimeout(()=>{ t.style.opacity='0'; },2000);
}

/* ── Overview nav ── */
function buildOverview() {
  const ov = document.getElementById('overview');
  ov.innerHTML = '<div class="ov-title">Quick Nav</div>';
  NODES.filter(n=>n.type==='cat').forEach(c => {
    const div = document.createElement('div');
    div.className = 'ov-item';
    div.innerHTML = `<div class="ov-dot" style="background:${c.color}"></div><span class="ov-label">${c.title.replace('\n',' ')}</span>`;
    div.onclick = () => { vx=c.x; vy=c.y; scale=0.9; redraw(); };
    ov.appendChild(div);
  });
}

/* ─── iframe 메시지 ─── */
window.addEventListener('message', e => {
  if (e.data?.type==='wf_lang' || e.data?.type==='wf_role') return;
});

/* ── 초기화 ── */
loadState();
fullRender();
fitAll();
window.addEventListener('resize', () => { fitAll(); });
</script>
</body>
</html>
