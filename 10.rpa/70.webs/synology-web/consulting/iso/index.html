<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISO 자가진단 — WorksFree</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap');
:root{
  --bg:#0f1117;--panel:#1c2333;--panel2:#212d40;--border:#2a3347;
  --text:#e2e8f0;--muted:#a8bdd1;--hint:#8fa3ba;--radius:8px;
  --acc:#3b82f6;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'IBM Plex Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;}

/* topbar */
.topbar{position:sticky;top:0;z-index:100;background:var(--panel);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.topbar-title{font-size:16px;font-weight:600;}
.topbar-sub{font-size:12px;color:var(--muted);margin-left:6px;}
.std-select{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 10px;font-size:13px;font-family:inherit;cursor:pointer;flex:1;min-width:200px;max-width:340px;}
.std-select:focus{outline:none;border-color:var(--acc);}
.tb-spacer{flex:1;}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:500;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);border-color:var(--text);}
.btn-primary{background:var(--acc);color:#fff;}
.btn-primary:hover{opacity:.9;}
.btn-danger{background:transparent;color:#ef4444;border:1px solid #ef4444;}
.btn-danger:hover{background:#ef444415;}

/* std info banner */
.std-banner{padding:12px 20px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);background:#0d1220;}
.std-icon{font-size:26px;flex-shrink:0;}
.std-name{font-size:15px;font-weight:600;}
.std-desc{font-size:12px;color:var(--muted);margin-top:2px;}
.std-chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;}
.std-chip{font-size:11px;font-weight:600;padding:3px 10px;border-radius:10px;border:1px solid;}

/* score dashboard */
.dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--border);}
.sc{background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;}
.sc-label{font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500;}
.sc-val{font-size:24px;font-weight:700;}
.sc-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.sc-bar{height:3px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden;}
.sc-fill{height:100%;border-radius:2px;transition:width .4s;}

/* content */
.content{padding:16px 20px;max-width:860px;margin:0 auto;}

/* clause accordion */
.clause{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
.clause-head{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;user-select:none;}
.clause-head:hover{background:var(--panel2);}
.clause-num{font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--panel2);min-width:36px;text-align:center;}
.clause-name{flex:1;font-weight:600;font-size:14px;}
.clause-score{font-size:13px;font-weight:600;margin-left:auto;margin-right:8px;}
.chevron{font-size:12px;color:var(--muted);transition:transform .2s;}
.clause.open .chevron{transform:rotate(180deg);}
.clause-body{display:none;border-top:1px solid var(--border);}
.clause.open .clause-body{display:block;}

/* req row */
.req-row{display:flex;align-items:flex-start;gap:12px;padding:10px 16px;border-bottom:1px solid #1a2235;}
.req-row:last-child{border-bottom:none;}
.req-id{font-size:12px;font-weight:600;color:var(--muted);min-width:38px;flex-shrink:0;padding-top:2px;}
.req-text{flex:1;font-size:13px;}
.pill-group{display:flex;gap:4px;flex-shrink:0;}
.pill{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);transition:.15s;white-space:nowrap;}
.pill:hover{border-color:var(--text);color:var(--text);}
.pill.py{background:#0d2620;border-color:#10b981;color:#34d399;}
.pill.pn{background:#2d1515;border-color:#ef4444;color:#f87171;}
.pill.pa{background:#1f2937;border-color:#4b5563;color:#9ca3af;}

/* report overlay */
.iso-report{display:none;position:fixed;inset:0;background:#fff;z-index:200;overflow-y:auto;font-family:'IBM Plex Sans KR',sans-serif;color:#111;font-size:14px;line-height:1.6;}
.iso-report.open{display:block;}
.rp-topbar{position:sticky;top:0;background:#fff;border-bottom:2px solid #e5e7eb;padding:12px 24px;display:flex;align-items:center;gap:12px;z-index:10;}
.rp-topbar h2{font-size:16px;font-weight:700;flex:1;}
.rp-btn{padding:7px 18px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;}
.rp-btn-print{color:#fff;}
.rp-btn-close{background:#f3f4f6;color:#374151;border:1px solid #d1d5db;}
.rp-body{max-width:780px;margin:0 auto;padding:24px 24px 60px;}
.rp-hdr{text-align:center;padding:20px 0 28px;border-bottom:2px solid #111;margin-bottom:24px;}
.rp-hdr h1{font-size:20px;font-weight:700;margin-bottom:6px;}
.rp-hdr-meta{font-size:12px;color:#6b7280;}
.rp-section{margin-bottom:28px;}
.rp-hd{font-size:15px;font-weight:700;padding-left:12px;margin-bottom:12px;}
.rp-score-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px;}
.rp-sc{border:1px solid #e5e7eb;border-radius:8px;padding:14px;text-align:center;}
.rp-sc-label{font-size:11px;font-weight:600;color:#6b7280;margin-bottom:4px;}
.rp-sc-val{font-size:26px;font-weight:700;}
.rp-sc-sub{font-size:11px;color:#9ca3af;margin-top:2px;}
.rp-clause-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:8px;}
.rp-clause-table th{background:#f9fafb;padding:7px 10px;text-align:left;font-weight:600;border:1px solid #e5e7eb;}
.rp-clause-table td{padding:7px 10px;border:1px solid #e5e7eb;}
.rp-clause-table tr:nth-child(even) td{background:#f9fafb;}
.rp-fails{margin-bottom:8px;}
.rp-fail-hd{font-size:13px;font-weight:700;color:#dc2626;margin-bottom:6px;padding:4px 0;border-bottom:1px solid #fee2e2;}
.rp-fail-row{font-size:12px;padding:5px 8px;display:flex;gap:8px;}
.rp-fail-row:nth-child(even){background:#fff5f5;}
.rp-fail-id{font-size:11px;font-weight:600;color:#dc2626;min-width:42px;}
.rp-gap{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:14px 16px;margin-bottom:8px;}
.rp-gap-hd{font-size:13px;font-weight:700;color:#166534;margin-bottom:6px;}
.rp-gap-item{font-size:12px;color:#15803d;padding:3px 0;display:flex;gap:8px;}
.rp-gap-item::before{content:'→';}

@media print{
  .rp-topbar{display:none!important;}
  .iso-report{position:static!important;overflow:visible!important;}
  .rp-body{max-width:100%;padding:0;}
}
</style>
</head>
<body>

<!-- topbar -->
<div class="topbar">
  <span class="topbar-title">ISO 자가진단</span>
  <select class="std-select" id="std-select" onchange="selectStd(this.value)">
    <option value="9001">ISO 9001:2015 — 품질경영시스템 (QMS)</option>
    <option value="14001">ISO 14001:2015 — 환경경영시스템 (EMS)</option>
    <option value="45001">ISO 45001:2018 — 안전보건경영시스템 (OH&SMS)</option>
    <option value="42001">ISO 42001:2023 — AI 경영시스템 (AIMS)</option>
    <option value="27001">ISO 27001:2022 — 정보보안경영시스템 (ISMS)</option>
  </select>
  <div class="tb-spacer"></div>
  <button class="btn btn-ghost" onclick="expandAll()">전체 펼치기</button>
  <button class="btn btn-primary" id="btn-report" onclick="showReport()">📋 보고서 생성</button>
  <button class="btn btn-danger" onclick="confirmReset()">초기화</button>
</div>

<!-- std info banner -->
<div class="std-banner" id="std-banner"></div>

<!-- score dashboard -->
<div class="dashboard" id="dashboard"></div>

<!-- content area -->
<div class="content" id="content"></div>

<!-- report overlay -->
<div class="iso-report" id="iso-report">
  <div class="rp-topbar">
    <h2 id="rp-title">ISO 준비도 진단 보고서</h2>
    <button class="rp-btn rp-btn-print" id="rp-btn-print" onclick="window.print()">🖨 인쇄 / PDF</button>
    <button class="rp-btn rp-btn-close" onclick="closeReport()">✕ 닫기</button>
  </div>
  <div class="rp-body" id="rp-body"></div>
</div>

/* ════════════════════════════════════════════════════════
   상태 관리
════════════════════════════════════════════════════════ */
let curStd = '9001';
// state: { '9001': { '4.1a': 'y'|'n'|'na', ... }, '14001': { ... }, ... }
let state = JSON.parse(localStorage.getItem('wf_iso_state') || '{}');

function saveState() {
  localStorage.setItem('wf_iso_state', JSON.stringify(state));
}

function getAns(stdId, reqId) {
  return (state[stdId] || {})[reqId] || '';
}

function setAns(stdId, reqId, val) {
  if (!state[stdId]) state[stdId] = {};
  if (state[stdId][reqId] === val) {
    delete state[stdId][reqId]; // 같은 값 클릭 시 해제
  } else {
    state[stdId][reqId] = val;
  }
  saveState();
  renderDashboard();
  updateClauseScore(reqId);
}

/* ════════════════════════════════════════════════════════
   점수 계산
════════════════════════════════════════════════════════ */
function calcScore(stdId) {
  const std = STANDARDS[stdId];
  const st  = state[stdId] || {};
  let total = {y:0, n:0, na:0, total:0};
  const byClause = {};
  std.clauses.forEach(cl => {
    let c = {y:0, n:0, na:0};
    cl.reqs.forEach(r => {
      const v = st[r.id] || '';
      if (v === 'y')  { c.y++;  total.y++;  }
      if (v === 'n')  { c.n++;  total.n++;  }
      if (v === 'na') { c.na++; total.na++; }
    });
    byClause[cl.id] = c;
    total.total += cl.reqs.length;
  });
  const applicable = total.y + total.n;
  const pct = applicable > 0 ? Math.round(total.y / applicable * 100) : 0;
  return { total, byClause, pct, applicable };
}

function clausePct(c) {
  const a = c.y + c.n;
  return a > 0 ? Math.round(c.y / a * 100) : null;
}

  const el = document.getElementById('std-banner');
  el.style.borderBottom = `1px solid ${std.border}`;
  el.style.background = std.bg;
  el.innerHTML = `
    <div class="std-icon">${std.icon}</div>
    <div>
      <div class="std-name" style="color:${std.color}">${std.name}</div>
      <div class="std-desc">${std.sub}</div>
    </div>
    <div class="std-chips">
      ${std.chips.map(c=>`<span class="std-chip" style="background:${std.chipBg};color:${std.chipText};border-color:${std.border}">${c}</span>`).join('')}
    </div>
  `;
  document.getElementById('btn-report').style.background = std.color;
}

    <div class="sc">
      <div class="sc-label">전체 준비율</div>
      <div class="sc-val" style="color:${color}">${score.applicable > 0 ? score.pct + '%' : '—'}</div>
      <div class="sc-sub">${score.total.y} / ${score.applicable} 충족 (해당없음 ${score.total.na}건 제외)</div>
      <div class="sc-bar"><div class="sc-fill" style="background:${color};width:${score.pct}%"></div></div>
    </div>
    <div class="sc">
      <div class="sc-label">응답 현황</div>
      <div class="sc-val">${score.total.y + score.total.n + score.total.na}</div>
      <div class="sc-sub">전체 ${score.total.total}개 요건 중 응답</div>
      <div class="sc-bar"><div class="sc-fill" style="background:#6b7280;width:${Math.round((score.total.y+score.total.n+score.total.na)/score.total.total*100)}%"></div></div>
    </div>
  `;

  std.clauses.forEach(cl => {
    const c   = score.byClause[cl.id] || {y:0,n:0,na:0};
    const pct = clausePct(c);
    html += `
      <div class="sc">
        <div class="sc-label">조항 ${cl.id}. ${cl.name}</div>
        <div class="sc-val" style="color:${pct===null?'var(--muted)':pct>=80?color:pct>=60?'#f97316':'#ef4444'}">${pct !== null ? pct + '%' : '—'}</div>
        <div class="sc-sub">${c.y}/${c.y+c.n} 충족</div>
        <div class="sc-bar"><div class="sc-fill" style="background:${pct===null?'#374151':pct>=80?color:pct>=60?'#f97316':'#ef4444'};width:${pct||0}%"></div></div>
      </div>
    `;
  });

  el.innerHTML = html;
}

/* ════════════════════════════════════════════════════════
   렌더 — 조항 목록
════════════════════════════════════════════════════════ */
function renderContent() {
  const std   = STANDARDS[curStd];
  const st    = state[curStd] || {};
  const score = calcScore(curStd);
  const el    = document.getElementById('content');
  let html    = '';

  std.clauses.forEach((cl, ci) => {
    const c   = score.byClause[cl.id] || {y:0,n:0,na:0};
    const pct = clausePct(c);
    const pctLabel = pct !== null ? `<span style="color:${pct>=80?std.color:pct>=60?'#f97316':'#ef4444'}">${pct}%</span>` : '<span style="color:var(--muted)">—</span>';
    let reqHtml = '';
    cl.reqs.forEach(r => {
      const v = st[r.id] || '';
      reqHtml += `
        <div class="req-row">
          <div class="req-id">${r.id}</div>
          <div class="req-text">${r.txt}</div>
          <div class="pill-group">
            <button class="pill ${v==='y'?'py':''}" onclick="setAns('${curStd}','${r.id}','y')" data-req="${r.id}" data-val="y">충족</button>
            <button class="pill ${v==='n'?'pn':''}" onclick="setAns('${curStd}','${r.id}','n')" data-req="${r.id}" data-val="n">미충족</button>
            <button class="pill ${v==='na'?'pa':''}" onclick="setAns('${curStd}','${r.id}','na')" data-req="${r.id}" data-val="na">해당없음</button>
          </div>
        </div>
      `;
    });
    html += `
      <div class="clause" id="clause-${cl.id}">
        <div class="clause-head" onclick="toggleClause('${cl.id}')">
          <div class="clause-num" style="color:${std.color};border:1px solid ${std.border}">${cl.id}</div>
          <div class="clause-name">${cl.name}</div>
          <div class="clause-score">${pctLabel}</div>
          <div class="chevron">▼</div>
        </div>
        <div class="clause-body">${reqHtml}</div>
      </div>
    `;
  });

  el.innerHTML = html;
}

function updateClauseScore(reqId) {
  // 해당 조항 헤더 점수만 갱신 (전체 재렌더 방지)
  const std   = STANDARDS[curStd];
  const score = calcScore(curStd);
  const clId  = reqId.split('.')[0];
  const cl    = std.clauses.find(c => c.id === clId);
  if (!cl) return;
  const c   = score.byClause[clId] || {y:0,n:0,na:0};
  const pct = clausePct(c);
  const el  = document.querySelector(`#clause-${clId} .clause-score`);
  if (el) el.innerHTML = pct !== null
    ? `<span style="color:${pct>=80?std.color:pct>=60?'#f97316':'#ef4444'}">${pct}%</span>`
    : '<span style="color:var(--muted)">—</span>';
  // pill 상태 갱신
  cl.reqs.forEach(r => {
    const v = getAns(curStd, r.id);
    ['y','n','na'].forEach(val => {
      const pills = document.querySelectorAll(`[data-req="${r.id}"][data-val="${val}"]`);
      pills.forEach(p => {
        p.classList.toggle('py', val==='y' && v==='y');
        p.classList.toggle('pn', val==='n' && v==='n');
        p.classList.toggle('pa', val==='na' && v==='na');
      });
    });
  });
}

/* ════════════════════════════════════════════════════════
   UI 액션
════════════════════════════════════════════════════════ */
function selectStd(id) {
  curStd = id;
  const std = STANDARDS[id];
  renderBanner(std);
  renderDashboard();
  renderContent();
}

function toggleClause(id) {
  const el = document.getElementById('clause-' + id);
  if (el) el.classList.toggle('open');
}

function expandAll() {
  document.querySelectorAll('.clause').forEach(el => el.classList.add('open'));
}

function confirmReset() {
  if (confirm(`${STANDARDS[curStd].name} 진단 내용을 모두 초기화하시겠습니까?`)) {
    delete state[curStd];
    saveState();
    renderDashboard();
    renderContent();
  }
}

/* ════════════════════════════════════════════════════════
   보고서
════════════════════════════════════════════════════════ */
function showReport() {
  const std   = STANDARDS[curStd];
  const score = calcScore(curStd);
  const st    = state[curStd] || {};
  const date  = new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});

  // grade
  const grade = score.pct >= 85 ? '우수 (인증 준비 완료)'
               : score.pct >= 70 ? '양호 (일부 보완 필요)'
               : score.pct >= 50 ? '보통 (개선 계획 수립 필요)'
               : score.applicable > 0 ? '미흡 (전면적 개선 필요)'
               : '미응답';

  // 미충족 요건 목록
  let failRows = '';
  std.clauses.forEach(cl => {
    const fails = cl.reqs.filter(r => (st[r.id] || '') === 'n');
    if (fails.length > 0) {
      failRows += `<div class="rp-fail-hd">조항 ${cl.id}. ${cl.name}</div>`;
      fails.forEach(r => {
        failRows += `<div class="rp-fail-row"><span class="rp-fail-id">${r.id}</span><span>${r.txt}</span></div>`;
      });
    }
  });

  // 조항별 점수 표
  let clauseRows = '';
  std.clauses.forEach(cl => {
    const c   = score.byClause[cl.id] || {y:0,n:0,na:0};
    const pct = clausePct(c);
    const status = pct === null ? '미응답' : pct >= 85 ? '✅ 우수' : pct >= 70 ? '🟡 양호' : pct >= 50 ? '🟠 보통' : '🔴 미흡';
    clauseRows += `<tr><td>${cl.id}</td><td>${cl.name}</td><td>${c.y}</td><td>${c.n}</td><td>${c.na}</td><td style="font-weight:600">${pct !== null ? pct + '%' : '—'}</td><td>${status}</td></tr>`;
  });

  // 개선 권고
  let gapItems = '';
  const lowClauses = std.clauses.filter(cl => {
    const c = score.byClause[cl.id] || {y:0,n:0,na:0};
    const p = clausePct(c);
    return p !== null && p < 70;
  });
  if (lowClauses.length > 0) {
    lowClauses.forEach(cl => {
      const c = score.byClause[cl.id] || {y:0,n:0,na:0};
      gapItems += `<div class="rp-gap-item">조항 ${cl.id} (${cl.name}): 미충족 ${c.n}건 개선 계획 수립 필요</div>`;
    });
  } else if (score.applicable > 0) {
    gapItems = '<div class="rp-gap-item">전반적으로 양호합니다. 정기적인 내부 심사를 통해 유지관리하세요.</div>';
  } else {
    gapItems = '<div class="rp-gap-item">진단을 완료한 후 보고서를 생성하세요.</div>';
  }

  document.getElementById('rp-title').textContent = `${std.name} 준비도 진단 보고서`;
  document.getElementById('rp-btn-print').style.background = std.color;
  document.getElementById('rp-body').innerHTML = `
    <div class="rp-hdr">
      <h1>${std.name} — ${std.sub}</h1>
      <h1>준비도 자가진단 보고서</h1>
      <div class="rp-hdr-meta">작성일: ${date} &nbsp;|&nbsp; WorksFree ISO 진단 도구</div>
    </div>

    <div class="rp-section">
      <div class="rp-hd" style="border-left-color:${std.color}">종합 준비율</div>
      <div class="rp-score-grid">
        <div class="rp-sc">
          <div class="rp-sc-label">전체 준비율</div>
          <div class="rp-sc-val" style="color:${std.color}">${score.applicable > 0 ? score.pct + '%' : '—'}</div>
          <div class="rp-sc-sub">${grade}</div>
        </div>
        <div class="rp-sc">
          <div class="rp-sc-label">충족</div>
          <div class="rp-sc-val" style="color:#16a34a">${score.total.y}</div>
          <div class="rp-sc-sub">요건</div>
        </div>
        <div class="rp-sc">
          <div class="rp-sc-label">미충족</div>
          <div class="rp-sc-val" style="color:#dc2626">${score.total.n}</div>
          <div class="rp-sc-sub">요건</div>
        </div>
        <div class="rp-sc">
          <div class="rp-sc-label">해당없음</div>
          <div class="rp-sc-val" style="color:#6b7280">${score.total.na}</div>
          <div class="rp-sc-sub">요건</div>
        </div>
      </div>
    </div>

    <div class="rp-section">
      <div class="rp-hd" style="border-left-color:${std.color}">조항별 준비율</div>
      <table class="rp-clause-table">
        <thead><tr><th>조항</th><th>명칭</th><th>충족</th><th>미충족</th><th>해당없음</th><th>준비율</th><th>수준</th></tr></thead>
        <tbody>${clauseRows}</tbody>
      </table>
    </div>

    ${failRows ? `
    <div class="rp-section">
      <div class="rp-hd" style="border-left-color:#dc2626">미충족 요건 목록</div>
      <div class="rp-fails">${failRows}</div>
    </div>` : ''}

    <div class="rp-section">
      <div class="rp-hd" style="border-left-color:#16a34a">개선 권고사항</div>
      <div class="rp-gap">
        <div class="rp-gap-hd">우선 개선 조항</div>
        ${gapItems}
      </div>
      <div style="font-size:12px;color:#6b7280;margin-top:10px;">
        ※ 본 보고서는 자가진단 결과이며 공식 인증과는 무관합니다.<br>
        ※ 인증 취득을 위해서는 인정된 인증기관(CB)의 외부 심사가 필요합니다.
      </div>
    </div>
  `;

  document.getElementById('iso-report').classList.add('open');
}

function closeReport() {
  document.getElementById('iso-report').classList.remove('open');
}

/* ════════════════════════════════════════════════════════
   초기화
════════════════════════════════════════════════════════ */
selectStd('9001');
</script>
</body>
</html>
