<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>타코매니저 AI — WorksFree</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c14;--panel:#0f1623;--panel2:#141e2e;
  --border:#1e2d45;--border2:#253450;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --accent:#3b82f6;--accent2:#6366f1;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'Segoe UI','Noto Sans KR',sans-serif;}
body{display:flex;}

/* ── 사이드바 ── */
#sidebar{
  width:200px;flex-shrink:0;
  background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  padding:0;overflow:hidden;
}
.sb-header{
  padding:16px 16px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:9px;
}
.sb-logo-icon{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,#f97316,#ef4444);
  display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;
}
.sb-logo-title{font-size:13px;font-weight:700;line-height:1.3;}
.sb-logo-sub{font-size:10px;color:var(--text3);margin-top:1px;}

.sb-section{padding:12px 10px 6px;font-size:10px;font-weight:700;
  color:var(--text3);text-transform:uppercase;letter-spacing:.08em;}

.sb-node{
  display:flex;align-items:center;gap:9px;
  padding:9px 14px;margin:1px 6px;border-radius:8px;
  cursor:pointer;transition:all .18s;
  font-size:12.5px;font-weight:500;color:var(--text2);
  border:1px solid transparent;user-select:none;
}
.sb-node:hover{background:rgba(255,255,255,.05);color:var(--text);}
.sb-node.active{
  background:rgba(99,102,241,.18);color:#a5b4fc;
  border-color:rgba(99,102,241,.3);
}
.sb-node-icon{font-size:15px;flex-shrink:0;}
.sb-node-info{display:flex;flex-direction:column;gap:1px;}
.sb-node-label{font-size:12.5px;font-weight:600;}
.sb-node-desc{font-size:10px;color:var(--text3);font-weight:400;}
.sb-node.active .sb-node-desc{color:rgba(165,180,252,.7);}

.sb-badge{
  margin-left:auto;font-size:9px;font-weight:800;
  padding:2px 6px;border-radius:8px;flex-shrink:0;
}
.sb-badge-new{background:rgba(34,197,94,.2);color:#4ade80;}
.sb-badge-v2 {background:rgba(100,116,139,.2);color:var(--text3);}

.sb-footer{
  margin-top:auto;padding:12px 14px;border-top:1px solid var(--border);
  font-size:10px;color:var(--text3);line-height:1.6;
}

/* ── 콘텐츠 iframe ── */
#content{flex:1;border:none;display:block;height:100%;}
</style>
</head>
<body>

<div id="sidebar">
  <div class="sb-header">
    <div class="sb-logo-icon">🌮</div>
    <div>
      <div class="sb-logo-title">타코매니저 AI</div>
      <div class="sb-logo-sub">WorksFree</div>
    </div>
  </div>

  <div class="sb-section">버전 선택</div>

  <div class="sb-node active" id="node-v1" onclick="switchTo('v1')">
    <div class="sb-node-icon">✦</div>
    <div class="sb-node-info">
      <div class="sb-node-label">일일 보고서형</div>
      <div class="sb-node-desc">POS 분석 · 오늘의 타코</div>
    </div>
    <span class="sb-badge sb-badge-new">NEW</span>
  </div>

  <div class="sb-node" id="node-v2" onclick="switchTo('v2')">
    <div class="sb-node-icon">🗺</div>
    <div class="sb-node-info">
      <div class="sb-node-label">실시간 관제형</div>
      <div class="sb-node-desc">재고 · SCM · 매트릭스</div>
    </div>
    <span class="sb-badge sb-badge-v2">v2</span>
  </div>

  <div class="sb-footer">
    화면 클릭 시 데모 종료<br>직접 조작 가능
  </div>
</div>

<iframe id="content" src="v1/index.html" title="타코매니저 AI"></iframe>

<script>
function switchTo(ver) {
  document.getElementById('node-v1').classList.toggle('active', ver === 'v1');
  document.getElementById('node-v2').classList.toggle('active', ver === 'v2');
  document.getElementById('content').src = ver + '/index.html';
}
</script>
</body>
</html>
