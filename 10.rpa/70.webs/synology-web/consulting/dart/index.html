<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DART 기업공시 조회</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0f1117;
      --panel:   #1c2333;
      --border:  #2d3748;
      --text:    #e2e8f0;
      --sub:     #94a3b8;
      --accent:  #3b82f6;
      --success: #10b981;
      --warn:    #f59e0b;
      --danger:  #ef4444;
    }
    body { font-family:'IBM Plex Sans KR',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

    /* ── Topbar ── */
    .topbar { display:flex; align-items:center; padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--border); gap:10px; }
    .topbar-title { flex:1; }
    .topbar-title h1 { font-size:16px; font-weight:600; }
    .topbar-title .sub { font-size:12px; color:var(--sub); margin-top:1px; }
    .icon-btn { background:none; border:1px solid var(--border); color:var(--sub); border-radius:6px; padding:5px 10px; font-size:13px; cursor:pointer; font-family:inherit; }
    .icon-btn:hover { background:var(--border); color:var(--text); }
    .lang-active { color:var(--accent) !important; border-color:var(--accent) !important; }

    /* ── Settings panel ── */
    .settings-panel { background:var(--panel); border-bottom:1px solid var(--border); padding:16px 20px; display:none; }
    .settings-panel.open { display:block; }
    .settings-title { font-size:11px; font-weight:600; color:var(--sub); text-transform:uppercase; letter-spacing:.06em; margin-bottom:12px; }
    .field-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .field-row label { font-size:12px; color:var(--sub); width:110px; flex-shrink:0; }
    .field-row input {
      flex:1; max-width:480px;
      background:var(--bg); border:1px solid var(--border); border-radius:6px;
      color:var(--text); padding:7px 10px; font-size:13px; font-family:inherit;
    }
    .field-row input:focus { outline:none; border-color:var(--accent); }
    .btn-primary { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:7px 18px; font-size:14px; font-family:inherit; cursor:pointer; font-weight:500; }
    .btn-primary:hover { opacity:.85; }
    .settings-note { font-size:11px; color:var(--sub); margin-top:10px; line-height:1.7; }
    .settings-note code { background:rgba(255,255,255,.07); padding:1px 5px; border-radius:3px; font-size:11px; }
    .settings-note a { color:var(--accent); text-decoration:none; }

    /* ── Search ── */
    .search-wrap { padding:24px 20px 0; max-width:800px; }
    .search-row { display:flex; gap:8px; }
    .search-input {
      flex:1; background:var(--panel); border:1px solid var(--border); border-radius:8px;
      color:var(--text); padding:10px 16px; font-size:15px; font-family:inherit;
    }
    .search-input:focus { outline:none; border-color:var(--accent); }
    .btn-search { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:10px 22px; font-size:15px; font-family:inherit; cursor:pointer; font-weight:500; white-space:nowrap; }
    .btn-search:hover { opacity:.85; }
    .btn-search:disabled { opacity:.45; cursor:default; }
    .recent-row { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:10px; min-height:24px; }
    .recent-label { font-size:11px; color:var(--sub); }
    .recent-chip { background:var(--panel); border:1px solid var(--border); border-radius:4px; padding:2px 10px; font-size:13px; cursor:pointer; color:var(--sub); }
    .recent-chip:hover { color:var(--text); border-color:var(--accent); }
    .filter-row { display:flex; align-items:center; gap:8px; margin-top:8px; min-height:24px; }
    .filter-chk-label { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--sub); cursor:pointer; user-select:none; }
    .filter-chk-label input[type=checkbox] { cursor:pointer; width:14px; height:14px; accent-color:var(--accent); }

    /* ── Results ── */
    .results-wrap { padding:16px 20px 40px; max-width:800px; }
    .results-meta { font-size:13px; color:var(--sub); margin-bottom:12px; }
    .result-list { display:flex; flex-direction:column; gap:8px; }

    /* ── Corp card ── */
    .corp-card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px 16px; cursor:pointer; transition:border-color .15s; }
    .corp-card:hover { border-color:var(--accent); }
    .corp-card.selected { border-color:var(--accent); background:#192640; }
    .card-top { display:flex; align-items:flex-start; gap:10px; margin-bottom:7px; }
    .card-names { flex:1; }
    .corp-name { font-size:16px; font-weight:600; }
    .corp-eng  { font-size:12px; color:var(--sub); margin-top:2px; }
    .cls-badge { font-size:10px; font-weight:700; padding:3px 8px; border-radius:4px; white-space:nowrap; flex-shrink:0; margin-top:2px; }
    .cls-Y { background:rgba(245,158,11,.15); color:#f59e0b; }
    .cls-K { background:rgba(16,185,129,.15); color:#10b981; }
    .cls-N { background:rgba(99,102,241,.15); color:#818cf8; }
    .cls-E { background:rgba(148,163,184,.1); color:#94a3b8; }
    .cls-L { background:rgba(59,130,246,.12); color:#60a5fa; }

    /* ── Mode tabs ── */
    .mode-tabs { display:flex; border-bottom:1px solid var(--border); padding:0 20px; background:var(--bg); }
    .mode-tab { background:none; border:none; border-bottom:2px solid transparent; color:var(--sub); padding:10px 16px; font-size:15px; font-family:inherit; cursor:pointer; font-weight:500; margin-bottom:-1px; transition:color .15s; }
    .mode-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
    .mode-tab:hover:not(.active) { color:var(--text); }

    /* ── Bulk panel ── */
    .bulk-wrap { padding:20px 20px 40px; max-width:960px; }
    .dropzone { border:2px dashed var(--border); border-radius:10px; padding:28px 20px; text-align:center; cursor:pointer; transition:border-color .15s,background .15s; margin-bottom:10px; }
    .dropzone.drag-over,.dropzone:hover { border-color:var(--accent); background:rgba(59,130,246,.04); }
    .drop-icon { font-size:28px; margin-bottom:6px; }
    .drop-msg  { font-size:14px; font-weight:500; margin-bottom:3px; }
    .drop-sub  { font-size:12px; color:var(--sub); }
    .drop-file { font-size:12px; color:var(--success); margin-top:6px; font-weight:500; }
    .bulk-textarea { width:100%; background:var(--panel); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:10px 14px; font-size:14px; font-family:inherit; resize:vertical; min-height:72px; margin-bottom:12px; }
    .bulk-textarea:focus { outline:none; border-color:var(--accent); }
    .bulk-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
    .bulk-count { font-size:12px; color:var(--sub); }

    /* ── Progress ── */
    .progress-wrap { margin-bottom:14px; }
    .progress-bar  { background:var(--border); border-radius:4px; height:5px; overflow:hidden; margin-bottom:5px; }
    .progress-fill { background:var(--accent); height:100%; border-radius:4px; transition:width .25s; width:0%; }
    .progress-info { font-size:13px; color:var(--sub); }

    /* ── Bulk results table ── */
    .bulk-table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:8px; }
    .bulk-table { width:100%; border-collapse:collapse; font-size:12px; }
    .bulk-table th { background:var(--panel); color:var(--sub); font-weight:600; padding:8px 10px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
    .bulk-table td { padding:7px 10px; border-bottom:1px solid rgba(45,55,72,.5); vertical-align:top; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .bulk-table tr:last-child td { border-bottom:none; }
    .bulk-table tr:hover td { background:rgba(255,255,255,.02); }
    .bs { display:inline-block; font-size:10px; font-weight:700; padding:2px 6px; border-radius:3px; }
    .bs-ok   { background:rgba(16,185,129,.15);  color:#10b981; }
    .bs-miss { background:rgba(245,158,11,.15);  color:#f59e0b; }
    .bs-err  { background:rgba(239,68,68,.15);   color:#ef4444; }
    .bs-pend { background:rgba(148,163,184,.1);  color:#94a3b8; }
    .btn-dl-csv { background:var(--success); color:#fff; border:none; border-radius:6px; padding:6px 14px; font-size:13px; font-family:inherit; cursor:pointer; font-weight:500; }
    .btn-dl-csv:hover { opacity:.85; }
    .btn-stop { background:none; border:1px solid var(--danger); color:var(--danger); border-radius:6px; padding:6px 14px; font-size:13px; font-family:inherit; cursor:pointer; }
    .bulk-result-actions { display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
    .bulk-result-meta { font-size:13px; color:var(--sub); }
    .btn-sel-dl { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:6px 14px; font-size:13px; font-family:inherit; cursor:pointer; font-weight:500; }
    .btn-sel-dl:disabled { opacity:.6; cursor:default; }
    .btn-fs-row { background:none; border:1px solid var(--border); color:var(--sub); border-radius:4px; padding:2px 8px; font-size:12px; cursor:pointer; font-family:inherit; transition:all .15s; white-space:nowrap; }
    .btn-fs-row:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
    .bulk-table td.chk-cell, .bulk-table th.chk-cell { width:32px; text-align:center; padding:7px 4px; }
    .bulk-table td.act-cell, .bulk-table th.act-cell { width:56px; text-align:center; padding:5px 4px; }
    .bulk-fs-bar { display:none; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:8px 14px; margin-bottom:10px; align-items:center; gap:8px; flex-wrap:wrap; }
    .bulk-fs-bar.show { display:flex; }
    .bulk-fs-bar-label { font-size:12px; color:var(--sub); font-weight:600; white-space:nowrap; }
    .bulk-fs-sel { background:var(--panel); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:4px 8px; font-size:12px; font-family:inherit; cursor:pointer; }
    .dl-progress-wrap { display:none; margin-top:10px; }

    .card-meta { display:flex; flex-wrap:wrap; gap:4px 18px; font-size:12px; }
    .card-meta-item { display:flex; gap:4px; }
    .mk { color:var(--sub); }
    .mv { color:var(--text); }

    /* ── Detail panel ── */
    .detail-panel { background:#111927; border-top:1px solid var(--border); margin-top:12px; border-radius:8px; padding:18px; }
    .detail-head { font-size:13px; font-weight:600; color:var(--sub); text-transform:uppercase; letter-spacing:.05em; margin-bottom:14px; }
    .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px 24px; }
    @media(max-width:500px){ .detail-grid { grid-template-columns:1fr; } }
    .detail-row .dk { font-size:11px; color:var(--sub); margin-bottom:2px; }
    .detail-row .dv { font-size:13px; word-break:break-all; }
    .detail-row .dv a { color:var(--accent); text-decoration:none; }
    .detail-row .dv a:hover { text-decoration:underline; }
    .btn-coming { margin-top:16px; background:none; border:1px dashed var(--border); color:var(--sub); border-radius:6px; padding:7px 14px; font-size:12px; font-family:inherit; cursor:default; }

    /* ── Pagination ── */
    .pagination { display:flex; align-items:center; gap:8px; margin-top:16px; }
    .page-btn { background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:5px 14px; font-size:13px; font-family:inherit; cursor:pointer; }
    .page-btn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
    .page-btn:disabled { opacity:.35; cursor:default; }
    .page-info { font-size:12px; color:var(--sub); }

    /* ── States ── */
    .state-box { padding:48px 20px; text-align:center; color:var(--sub); font-size:15px; }
    .state-icon { font-size:36px; margin-bottom:10px; }
    .state-err { color:var(--danger); }
    .spinner { display:inline-block; width:18px; height:18px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:8px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .inline-spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; }

    /* ── 재무제표 버튼 ── */
    .btn-fin-active {
      background:var(--accent); color:#fff; border:none; border-radius:6px;
      padding:7px 16px; font-size:12px; font-family:inherit; cursor:pointer;
      font-weight:500; margin-top:14px; display:inline-flex; align-items:center; gap:6px;
    }
    .btn-fin-active:hover { opacity:.85; }
    .btn-fin-locked {
      background:none; border:1px solid var(--border); color:var(--sub);
      border-radius:6px; padding:7px 16px; font-size:12px; font-family:inherit;
      cursor:default; margin-top:14px; display:inline-flex; align-items:center; gap:6px;
    }

    /* ── 재무제표 모달 ── */
    #fs-modal {
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,.72); z-index:9000;
      align-items:center; justify-content:center; padding:16px;
    }
    #fs-modal.show { display:flex; }
    .fs-box {
      background:var(--panel); border:1px solid var(--border); border-radius:12px;
      width:100%; max-width:960px; max-height:92vh;
      display:flex; flex-direction:column; overflow:hidden;
    }
    .fs-header {
      display:flex; justify-content:space-between; align-items:flex-start;
      padding:18px 20px 14px; border-bottom:1px solid var(--border); flex-shrink:0;
    }
    .fs-corp-name { font-size:16px; font-weight:700; }
    .fs-header-sub { font-size:12px; color:var(--sub); margin-top:3px; }
    .fs-close {
      background:none; border:none; color:var(--sub); cursor:pointer;
      font-size:18px; line-height:1; padding:4px 6px; border-radius:4px;
    }
    .fs-close:hover { color:var(--text); background:var(--border); }

    .fs-controls {
      padding:12px 20px; border-bottom:1px solid var(--border);
      flex-shrink:0; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    }
    .fs-select {
      background:var(--bg); border:1px solid var(--border); border-radius:6px;
      color:var(--text); padding:6px 10px; font-size:13px; font-family:inherit; cursor:pointer;
    }
    .fs-select:focus { outline:none; border-color:var(--accent); }
    .fs-query-btn {
      background:var(--accent); color:#fff; border:none; border-radius:6px;
      padding:6px 20px; font-size:13px; font-family:inherit; cursor:pointer; font-weight:500;
    }
    .fs-query-btn:hover { opacity:.85; }
    .fs-query-btn:disabled { opacity:.4; cursor:default; }

    .fs-content { flex:1; overflow-y:auto; }
    .fs-section { border-bottom:1px solid var(--border); }
    .fs-section:last-child { border-bottom:none; }
    .fs-section-title {
      font-size:11px; font-weight:700; color:var(--sub); letter-spacing:.06em;
      text-transform:uppercase; padding:9px 20px; background:rgba(255,255,255,.025);
      border-bottom:1px solid var(--border); position:sticky; top:0; z-index:1;
    }
    .fs-table { width:100%; border-collapse:collapse; font-size:12px; }
    .fs-table th {
      background:var(--panel); color:var(--sub); font-weight:600;
      padding:7px 14px; text-align:left; border-bottom:1px solid var(--border);
      white-space:nowrap; position:sticky; top:32px; z-index:1;
    }
    .fs-table th:not(:first-child) { text-align:right; min-width:110px; }
    .fs-table td { padding:5px 14px; border-bottom:1px solid rgba(45,55,72,.35); vertical-align:middle; }
    .fs-table td:not(:first-child) { text-align:right; font-family:'IBM Plex Mono',monospace; font-size:11px; }
    .fs-table tr:hover td { background:rgba(255,255,255,.025); }
    .fs-table tr:last-child td { border-bottom:none; }
    .fs-acc-main { font-weight:600; color:var(--text); }
    .fs-acc-sub  { color:var(--sub); padding-left:18px; font-size:11px; }
    .fs-neg      { color:var(--danger); }
    .fs-zero     { color:var(--sub); }
    /* account_detail 레이블 (SCE 자본 구성요소 등) */
    .fs-detail-label { color:var(--sub); font-size:10px; font-weight:400; margin-left:3px; }
    /* SCE 구조 안내 문구 */
    .fs-sce-note { font-size:10px; font-weight:400; color:var(--muted); margin-left:8px;
                   vertical-align:middle; letter-spacing:0; text-transform:none; }

    .fs-actions {
      padding:12px 20px; border-top:1px solid var(--border);
      display:none; align-items:center; gap:10px; flex-shrink:0; flex-wrap:wrap;
    }
    .fs-actions.show { display:flex; }
    .fs-unit-note { font-size:11px; color:var(--sub); margin-left:auto; }
  </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-title">
    <h1 id="tb-title">DART 기업공시 조회</h1>
    <div class="sub" id="tb-sub">금융감독원 전자공시시스템</div>
  </div>
  <button class="icon-btn" onclick="toggleSettings()">⚙ <span id="lbl-settings">설정</span></button>
  <button class="icon-btn" id="btn-ko" onclick="setLang('ko')">KO</button>
  <button class="icon-btn" id="btn-en" onclick="setLang('en')">EN</button>
</div>

<!-- SETTINGS -->
<div class="settings-panel" id="settings-panel">
  <div class="settings-title" id="lbl-settings-ttl">API 설정</div>
  <div class="field-row">
    <label id="lbl-proxy">Worker URL</label>
    <input type="url" id="inp-proxy" placeholder="https://dart-api-worker.insung-lee.workers.dev">
  </div>
  <div style="display:flex;gap:8px;align-items:center;margin-top:4px;">
    <div style="width:110px"></div>
    <button class="btn-primary" id="btn-save" onclick="saveSettings()">저장</button>
  </div>
  <div class="settings-note" id="settings-note"></div>
</div>

<!-- MODE TABS -->
<div class="mode-tabs">
  <button class="mode-tab active" id="tab-single" onclick="switchMode('single')">단건 조회</button>
  <button class="mode-tab" id="tab-bulk" onclick="switchMode('bulk')">다건조회</button>
</div>

<!-- BULK MODE -->
<div id="mode-bulk" style="display:none">
  <div class="bulk-wrap">
    <div class="dropzone" id="dropzone"
         onclick="document.getElementById('csv-file').click()"
         ondragover="event.preventDefault();this.classList.add('drag-over')"
         ondragleave="this.classList.remove('drag-over')"
         ondrop="onFileDrop(event)">
      <input type="file" id="csv-file" accept=".csv,.txt" style="display:none" onchange="onFileSelect(event)">
      <div class="drop-icon">📄</div>
      <div class="drop-msg" id="drop-msg">CSV 파일을 드래그하거나 클릭하여 업로드</div>
      <div class="drop-sub" id="drop-sub">또는 아래에 직접 입력</div>
      <div class="drop-file" id="drop-file"></div>
    </div>
    <textarea class="bulk-textarea" id="bulk-textarea" rows="4"></textarea>
    <div class="bulk-actions">
      <button class="btn-primary" id="btn-start" onclick="startBulk()">조회 시작</button>
      <button class="icon-btn" id="btn-tmpl" onclick="downloadTemplate()">템플릿 다운로드</button>
      <span class="bulk-count" id="bulk-count"></span>
      <button class="btn-stop" id="btn-stop" onclick="stopBulk()" style="display:none">중지</button>
    </div>
    <div class="progress-wrap" id="bulk-progress" style="display:none">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-info" id="progress-info"></div>
    </div>
    <div class="bulk-fs-bar" id="bulk-fs-bar">
      <span class="bulk-fs-bar-label" id="bulk-fs-bar-label">재무제표 옵션:</span>
      <select class="bulk-fs-sel" id="bulk-fs-year"></select>
      <select class="bulk-fs-sel" id="bulk-fs-reprt">
        <option value="11011">사업보고서 (연간)</option>
        <option value="11012">반기보고서</option>
        <option value="11013">1분기보고서</option>
        <option value="11014">3분기보고서</option>
      </select>
      <select class="bulk-fs-sel" id="bulk-fs-div">
        <option value="CFS">연결재무제표</option>
        <option value="OFS">개별재무제표</option>
      </select>
    </div>
    <div id="bulk-results"></div>
  </div>
</div>

<!-- SINGLE MODE -->
<div id="mode-single">

<!-- SEARCH -->
<div class="search-wrap">
  <div class="search-row">
    <input type="text" class="search-input" id="inp-search" onkeydown="if(event.key==='Enter')doSearch()">
    <button class="btn-search" id="btn-search" onclick="doSearch()">조회</button>
  </div>
  <div class="recent-row" id="recent-row"></div>
  <div class="filter-row" id="filter-row">
    <label class="filter-chk-label">

/* ── Settings ── */
const DEFAULT_PROXY = 'https://dart-api-worker.worksfree.workers.dev';
function getProxy(){ return localStorage.getItem('dart_proxy_url') || DEFAULT_PROXY; }

function toggleSettings(){
  document.getElementById('settings-panel').classList.toggle('open');
}
function saveSettings(){
  const v = document.getElementById('inp-proxy').value.trim();
  if(v && v !== DEFAULT_PROXY){
    localStorage.setItem('dart_proxy_url', v);
  } else {
    localStorage.removeItem('dart_proxy_url');
    document.getElementById('inp-proxy').value = DEFAULT_PROXY;
  }
  const btn = document.getElementById('btn-save');
  btn.textContent = t('saved');
  setTimeout(() => btn.textContent = t('save'), 1500);
}
function loadSettings(){
  document.getElementById('inp-proxy').value = getProxy();
}

/* ── Recent searches ── */
function getRecent(){ try{ return JSON.parse(localStorage.getItem('dart_recent')||'[]'); }catch{ return []; } }
function pushRecent(q){
  let r = getRecent().filter(x=>x!==q);
  r.unshift(q);
  localStorage.setItem('dart_recent', JSON.stringify(r.slice(0,5)));
  renderRecent();
}
function renderRecent(){
  const r = getRecent();
  const el = document.getElementById('recent-row');
  if(!r.length){ el.innerHTML=''; return; }
  el.innerHTML = `<span class="recent-label">${t('recent_lbl')}</span>` +
    r.map(q=>`<span class="recent-chip" onclick="pickRecent('${q.replace(/'/g,"\\'")}')">${q}</span>`).join('');
}
function pickRecent(q){ document.getElementById('inp-search').value=q; doSearch(); }

/* ── DART API ── */
async function dartCall(ep, params){
  const proxy = getProxy();
  if(!proxy){ showError(t('no_proxy')); return null; }
  const url = new URL(proxy);
  url.searchParams.set('ep', ep);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, String(v)));
  const resp = await fetch(url.toString());
  if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.json();
}

function indutyName(code){
  if(!code||!code.trim()) return t('dash');
  const sector = (INDUTY[lang]||INDUTY.ko)[code[0].toUpperCase()];
  return sector ? `${sector} (${code})` : code;
}
function fmtDate(d){ return (d&&d.length>=8) ? `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}` : (d||t('dash')); }
function fmtBizno(n){ return (n&&n.length>=10) ? `${n.slice(0,3)}-${n.slice(3,5)}-${n.slice(5)}` : (n||t('dash')); }
function fmtAccMt(m){ return m ? (lang==='ko' ? `${m}월` : `Month ${m}`) : t('dash'); }
function fmtHm(url){ if(!url||!url.trim()) return t('dash'); const href=url.startsWith('http')?url:'http://'+url; return `<a href="${href}" target="_blank">${url}</a>`; }

/* ── App state ── */
const state = { query:'', page:1, total:0, results:[], selectedIdx:null, detailData:null };

/* ── Search ── */
function doSearch(page){
  const q = document.getElementById('inp-search').value.trim();
  if(!q) return;
  state.query = q;
  state.page  = page || 1;
  state.selectedIdx = null;
  state.detailData  = null;
  runSearch(q, state.page);
}
async function runSearch(q, page){
  const wrap = document.getElementById('results-wrap');
  wrap.innerHTML = `<div class="state-box"><span class="spinner"></span>${t('searching')}</div>`;
  try{
    const data = await dartCall('company.json', { corp_name:q, page_no:page, page_count:10 });
    if(!data) return;
    if(data.status !== '000'){ showError(data.message||t('err_net')); return; }
    pushRecent(q);
    state.total   = parseInt(data.total_count)||0;
    state.results = data.list || [];
    renderResults(state.results, page, state.total, q);
  }catch(e){
    showError(`${t('err_net')} (${e.message})`);
  }
}

/* ── Render results ── */
function renderResults(list, page, total, q){
  const wrap = document.getElementById('results-wrap');
  const listedOnly = document.getElementById('chk-listed')?.checked;
  // preserve original indices for selectCard / selectCard to work correctly
  const items = list.reduce((acc, c, i) => {
    const cls = c.corp_cls || (c.stock_code?.trim() ? 'L' : 'E');
    // 'L' = stock_code는 있지만 corp_cls가 검색 API에서 미반환된 경우 (상장사로 간주)
    if (!listedOnly || ['Y','K','N','L'].includes(cls)) acc.push({c, i});
    return acc;
  }, []);
  if(!items.length){
    const msg = list.length && listedOnly ? t('no_listed_result') : t('no_result');
    wrap.innerHTML = `<div class="state-box"><div class="state-icon">🔎</div><div>${msg}</div></div>`;
    return;
  }
  const totalPages = Math.ceil(total/10);
  let metaHtml = `"${q}" — ${total.toLocaleString()} ${t('results_count')}`;
  if (listedOnly && items.length < list.length) {
    metaHtml += ` &nbsp;·&nbsp; <span style="color:var(--success);font-size:12px">${t('lbl_listed_only')} ${items.length}건</span>`;
  }
  let html = `<div class="results-meta">${metaHtml}</div><div class="result-list">`;
  items.forEach(({c, i}) => { html += buildCard(c, i); });
  html += `</div>`;
  if(totalPages>1){
    html += `<div class="pagination">
      <button class="page-btn" onclick="doSearch(${page-1})" ${page<=1?'disabled':''}>${t('prev')}</button>
      <span class="page-info">${page} / ${totalPages}</span>
      <button class="page-btn" onclick="doSearch(${page+1})" ${page>=totalPages?'disabled':''}>${t('next')}</button>
    </div>`;
  }
  wrap.innerHTML = html;
  // Re-select if language changed while detail was open
  if(state.selectedIdx !== null){
    document.getElementById(`card-${state.selectedIdx}`)?.classList.add('selected');

/* ── CSV parser ── */
function parseCsvLine(line) {
  const result = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    if (line[i] === '"') { inQ = !inQ; }
    else if (line[i] === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
    else { cur += line[i]; }
  }
  result.push(cur.trim());
  return result;
}

function parseBulkInput(raw) {
  const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(l => l && !l.startsWith('#'));
  if (!lines.length) return [];
  const first = lines[0].toLowerCase().replace(/['"()]/g, '');
  const isCSV = lines[0].includes(',');
  let hasHeader = false, colName = 0, colStock = 1, colMemo = 2, dataStart = 0;
  if (isCSV && (first.includes('corp_name') || first.includes('회사명') ||
                first.includes('stock_code') || first.includes('종목코드'))) {
    hasHeader = true; dataStart = 1;
    const cols = parseCsvLine(lines[0]).map(c => c.toLowerCase().replace(/['"()\s]/g, ''));
    const fn = (a,b) => { const i = cols.findIndex(c=>c.includes(a)||c.includes(b)); return i>=0?i:-1; };
    colName  = fn('corp_name','회사명');  if (colName  < 0) colName  = 0;
    colStock = fn('stock_code','종목코드'); if (colStock < 0) colStock = 1;
    colMemo  = fn('memo','메모');          if (colMemo  < 0) colMemo  = 2;
  }
  return lines.slice(dataStart).map(line => {
    if (isCSV) {
      const c = parseCsvLine(line);
      return { corp_name: c[colName]||'', stock_code: c[colStock]||'', memo: c[colMemo]||'', status:'pend', result:null };
    }
    const cleaned = line.replace(/"/g,'').trim();
    const isStock = /^\d{6}$/.test(cleaned);
    return { corp_name: isStock?'':cleaned, stock_code: isStock?cleaned:'', memo:'', status:'pend', result:null };
  }).filter(r => r.corp_name || r.stock_code);
}

const MAX_BULK = 20;

  const rows = parseBulkInput(document.getElementById('bulk-textarea').value);
  let msg = rows.length ? t('bulk_rows').replace('{n}', rows.length) : '';

/* ── Bulk processing ── */
const CHUNK = 5;

async function startBulk() {
  if (IS_PREVIEW) {
    document.getElementById('bulk-results').innerHTML =
      `<div class="state-box"><div class="state-icon">🔒</div><div>${t('bulk_preview')}</div></div>`;
    return;
  }
  const raw = document.getElementById('bulk-textarea').value;
  let rows = parseBulkInput(raw);
  if (!rows.length) return;
  if (rows.length > MAX_BULK) {
    alert(t('bulk_limit_warn').replace(/{n}/g, MAX_BULK));
    rows = rows.slice(0, MAX_BULK);
  }

  bulkAbort = false;
  bulkState.rows  = rows.map(r => ({...r, status:'pend', result:null}));
  bulkState.total = rows.length;

  document.getElementById('btn-start').disabled = true;
  document.getElementById('btn-stop').style.display = '';
  document.getElementById('bulk-progress').style.display = '';
  document.getElementById('progress-fill').style.width = '3%';  // 즉시 시작 표시
  document.getElementById('progress-info').textContent =
    t('bulk_processing').replace('{done}', 0).replace('{total}', rows.length);
  renderBulkTable(bulkState.rows);
  await new Promise(r => setTimeout(r, 60));  // 브라우저 첫 렌더 보장

  let done = 0;
  for (let i = 0; i < rows.length; i += CHUNK) {
    if (bulkAbort) break;
    const chunk = bulkState.rows.slice(i, i + CHUNK);
    await Promise.all(chunk.map((row, j) => processOne(row, i + j)));
    done = Math.min(i + CHUNK, rows.length);
    const pct = Math.round(done / rows.length * 100);
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-info').textContent =
      t('bulk_processing').replace('{done}', done).replace('{total}', rows.length);
    renderBulkTable(bulkState.rows);
  }

  const ok   = bulkState.rows.filter(r => r.status === 'ok').length;
  const miss = bulkState.rows.filter(r => r.status === 'miss').length;
  const err  = bulkState.rows.filter(r => r.status === 'err').length;
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('progress-info').textContent =
    t('bulk_done').replace('{ok}',ok).replace('{miss}',miss).replace('{err}',err);
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-stop').style.display = 'none';
  renderBulkTable(bulkState.rows, true);
}

function stopBulk() {
  bulkAbort = true;
  document.getElementById('btn-stop').style.display = 'none';
  document.getElementById('btn-start').disabled = false;
}

async function processOne(row, idx) {
  try {
    const params = {};
    if (row.stock_code) params.stock_code = row.stock_code;
    else                params.corp_name  = row.corp_name;
    const data = await dartCall('corp_info.json', params);
    if (!data || data.status !== '000') {
      row.status = 'err'; return;
    }
    if (!data.corp_code) { row.status = 'miss'; return; }
    row.status = 'ok';
    row.result = data;
  } catch(e) {
    row.status = 'err';
  }
}

/* ── Bulk FS year 초기화 ── */
function initBulkFsYear() {
  const sel = document.getElementById('bulk-fs-year');
  if (!sel || sel.options.length > 0) return;
  const latest = new Date().getFullYear() - 1;
  for (let y = latest; y >= latest - 4; y--) {
    const opt = document.createElement('option');
    opt.value = String(y); opt.textContent = String(y);
    sel.appendChild(opt);
  }
}

    const code = cb.dataset.corpCode;
    return bulkState.rows.find(r => r.result?.corp_code === code) || null;
  }).filter(Boolean);
}

/* ── Bulk Excel 다운로드 (단일 xlsx: 요약+개별시트) ── */
async function downloadBulkExcel() {
  const selected = getSelectedBulkRows();
  if (!selected.length) return;

  const toProcess = selected.slice(0, MAX_BULK);
  if (selected.length > MAX_BULK) alert(t('bulk_dl_limit').replace(/{n}/g, MAX_BULK));

  const year  = document.getElementById('bulk-fs-year')?.value  || String(new Date().getFullYear() - 1);
  const reprt = document.getElementById('bulk-fs-reprt')?.value || '11011';
  const fsDiv = document.getElementById('bulk-fs-div')?.value   || 'CFS';

  const btn = document.getElementById('btn-sel-dl');
  if (btn) btn.disabled = true;

  const progWrap = document.getElementById('dl-progress-wrap');
  const progFill = document.getElementById('dl-progress-fill');
  const progInfo = document.getElementById('dl-progress-info');
  if (progWrap) {
    progWrap.style.display = 'block';
    progWrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  if (progFill) progFill.style.width = '3%';
  if (progInfo) progInfo.textContent = t('bulk_dl_progress').replace('{done}', 0).replace('{total}', toProcess.length);
  await new Promise(r => setTimeout(r, 60));

  // Phase 1: 재무제표 데이터 일괄 fetch
  const fetched = [];
  let done = 0;
  for (const bulkRow of toProcess) {
    const d = bulkRow.result || {};
    try {
      const data = await dartCall('fnlttSinglAcntAll.json', {
        corp_code: d.corp_code, bsns_year: year, reprt_code: reprt, fs_div: fsDiv,
      });
      fetched.push({ d, fsList: (data?.status === '000' && data.list?.length) ? data.list : null });
    } catch(e) {
      fetched.push({ d, fsList: null });
    }
    done++;
    if (progFill) progFill.style.width = Math.max(3, Math.round(done / toProcess.length * 100)) + '%';
    if (progInfo) progInfo.textContent = t('bulk_dl_progress').replace('{done}', done).replace('{total}', toProcess.length);
  }

  // Phase 2: 워크북 조립
  const wb   = XLSX.utils.book_new();
  let   ok = 0, fail = 0;

  // 요약 시트 (첫 번째)
  const sumHdr = lang === 'ko'
    ? ['번호','회사명','종목코드','상장구분','대표자','업종','설립일','결산월','고유번호','재무제표']
    : ['#','Company','Ticker','Listed','CEO','Industry','Founded','FY Month','Corp Code','FS'];
  const sumData = [sumHdr, ...fetched.map(({d, fsList}, idx) => [
    idx + 1, d.corp_name||'', d.stock_code||'',
    t('cls_'+(d.corp_cls||'E'))||d.corp_cls||'',
    d.ceo_nm||'', indutyName(d.induty_code),
    fmtDate(d.est_dt), fmtAccMt(d.acc_mt), d.corp_code||'',
    fsList ? (lang==='ko'?'있음':'Available') : (lang==='ko'?'없음':'N/A'),
  ])];
  const sumWs = XLSX.utils.aoa_to_sheet(sumData);
  sumWs['!cols'] = [{wch:4},{wch:18},{wch:8},{wch:10},{wch:14},{wch:18},{wch:12},{wch:8},{wch:12},{wch:8}];
  XLSX.utils.book_append_sheet(wb, sumWs, lang === 'ko' ? '요약' : 'Summary');

  // 개별 시트 (회사별)
  const usedNames = new Set([lang==='ko'?'요약':'Summary']);
  for (const {d, fsList} of fetched) {
    if (!fsList) { fail++; continue; }
    const aoa = buildCorpSheetAoa(d, fsList, year, fsDiv);
    const ws  = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{wch:30},{wch:16},{wch:16},{wch:16},{wch:16},{wch:14}];
    setIntegerFormat(ws);
    let nm = (d.corp_name||'corp').replace(/[\\/:*?"[\]]/g,'_').slice(0, 28);
    let final = nm, sfx = 1;
    while (usedNames.has(final)) { final = nm.slice(0, 25) + '_' + sfx++; }
    usedNames.add(final);
    XLSX.utils.book_append_sheet(wb, ws, final);
    ok++;
  }

  if (progFill) progFill.style.width = '100%';
  if (progInfo) progInfo.textContent = t('bulk_dl_done').replace('{ok}', ok).replace('{fail}', fail);

  if (ok > 0) {
    XLSX.writeFile(wb, `dart_fs_bulk_${year}_${new Date().toISOString().slice(0,10)}.xlsx`);
  }
  if (btn) btn.disabled = false;
  setTimeout(() => { if (progWrap) progWrap.style.display = 'none'; }, 3000);
}

/* ── 회사별 재무제표 AOA 생성 (다건 xlsx 개별 시트용) ── */
function buildCorpSheetAoa(d, list, year, fsDiv) {
  const fsDivNm = fsDiv === 'CFS' ? '연결재무제표' : '별도재무제표';
  const first   = list[0] || {};
  const colCur  = first.thstrm_nm    || (year + ' 당기');
  const colPrev = first.frmtrm_nm    || ((+year - 1) + ' 전기');
  const colPP   = first.bfefrmtrm_nm || ((+year - 2) + ' 전전기');
  const hasPP   = list.some(r => r.bfefrmtrm_amount?.trim() && r.bfefrmtrm_amount.trim() !== '-');
  const currency = first.currency || 'KRW';
  const unitNote = currency === 'KRW' ? '(단위: 백만원)' : '(Unit: ' + currency + ')';

  const rows = [];
  rows.push([d.corp_name||'', d.stock_code||'', t('cls_'+(d.corp_cls||'E'))||d.corp_cls||'', year+'년', fsDivNm, unitNote]);
  rows.push(['대표자: '+(d.ceo_nm||'-'), '설립일: '+fmtDate(d.est_dt), '결산월: '+fmtAccMt(d.acc_mt), '', '', '']);
  rows.push(['출처: DART 금융감독원 전자공시시스템', '', '', '', '조회일: '+new Date().toLocaleDateString('ko-KR'), '']);
  rows.push([]);

  const ORDER = ['BS','IS','CIS','CF','SCE'];
  const SNMS  = {BS:'재무상태표',IS:'손익계산서',CIS:'포괄손익계산서',CF:'현금흐름표',SCE:'자본변동표'};
  const groups = {};
  for (const r of list) {
    if (!groups[r.sj_div]) groups[r.sj_div] = {rows:[]};
    groups[r.sj_div].rows.push(r);
  }
  const divs = [...ORDER.filter(x => groups[x]), ...Object.keys(groups).filter(x => !ORDER.includes(x))];

  for (const div of divs) {
    const grp   = groups[div];
    const sjNm  = (t('fs_sj')||{})[div] || div;
    const isSCE = div === 'SCE';
    rows.push([`── ${sjNm} (${div}) ──`]);
    if (isSCE) {
      rows.push(['계정과목', '자본구성요소', colCur, colPrev, ...(hasPP ? [colPP] : [])]);
      for (const r of grp.rows) {
        const nm  = cleanXbrlLabel(r.account_nm.trim());
        const det = cleanXbrlLabel((r.account_detail||'').trim());
        const eq  = (det && det !== '-') ? det.replace(/^자본\s*\|?\s*/, '') : '';
        rows.push([nm, eq, parseFsAmount(r.thstrm_amount), parseFsAmount(r.frmtrm_amount), ...(hasPP ? [parseFsAmount(r.bfefrmtrm_amount)] : [])]);
      }
    } else {
      rows.push(['계정과목', colCur, colPrev, ...(hasPP ? [colPP] : [])]);
      for (const r of grp.rows) {
        rows.push([cleanXbrlLabel(r.account_nm.trim()), parseFsAmount(r.thstrm_amount), parseFsAmount(r.frmtrm_amount), ...(hasPP ? [parseFsAmount(r.bfefrmtrm_amount)] : [])]);
      }
    }
    rows.push([]);
  }
  return rows;
}

/* ── 기업 재무제표 Excel 워크북 생성 (DART API 호출) ── */
async function buildCorpExcelWb(corpCode, corpName, year, reprt, fsDiv) {
  const proxy = getProxy();
  const url   = new URL(proxy);
  url.searchParams.set('ep',         'fnlttSinglAcntAll.json');
  url.searchParams.set('corp_code',  corpCode);
  url.searchParams.set('bsns_year',  year);
  url.searchParams.set('reprt_code', reprt);
  url.searchParams.set('fs_div',     fsDiv);
  const resp = await fetch(url.toString());
  const data = await resp.json();
  if (data.status !== '000' || !data.list?.length) return null;
  return buildFinExcelWb(data.list, corpName, year, fsDiv);
}

/* ═══════════════════════════════════════
   재무제표 조회 (Financial Statements)
═══════════════════════════════════════ */
let _fsData     = null;  // 마지막 조회 결과 (Excel 다운로드용)
let _fsCorpName = '';

/* ── 상세 패널의 버튼 → 현재 detail 데이터로 모달 열기 ── */
function openFinSheetFromDetail() {
  if (!_lastDetail) return;
  openFinSheet(_lastDetail.corp_code, _lastDetail.corp_name, _lastDetail.acc_mt);
}

/* ── 모달 열기 ── */
function openFinSheet(corpCode, corpName, accMt) {
  if (IS_PREVIEW) return;
  _fsCorpName = corpName || '';

  document.getElementById('fs-corp-name').textContent = _fsCorpName;

  // 사업연도 옵션: 당해연도-1 ~ 당해연도-4
  const yearSel = document.getElementById('fs-year');
  const now = new Date();
  // 3월 이전이면 작년 데이터도 미공시일 수 있으므로 -1부터 시작
  const latestYear = now.getFullYear() - 1;
  yearSel.innerHTML = '';
  for (let y = latestYear; y >= latestYear - 3; y--) {
    const opt = document.createElement('option');
    opt.value = String(y);
    opt.textContent = y + (lang === 'ko' ? '년' : '');
    yearSel.appendChild(opt);
  }

  // 재무제표 내용/버튼 초기화
  _fsData = null;
  const content = document.getElementById('fs-content');
  content.innerHTML = `<div class="state-box" id="fs-init-msg">${t('fs_init_msg')}</div>`;
  document.getElementById('fs-actions').classList.remove('show');

  // corp_code를 dataset에 저장 (queryFinSheet에서 참조)
  document.getElementById('fs-modal').dataset.corpCode = corpCode;
  document.getElementById('fs-modal').classList.add('show');
}

/* ── 모달 닫기 ── */
function closeFinSheet() {
  document.getElementById('fs-modal').classList.remove('show');
}

/* ── 조회 실행 ── */
async function queryFinSheet() {
  const corpCode = document.getElementById('fs-modal').dataset.corpCode;
  const year     = document.getElementById('fs-year').value;
  const reprt    = document.getElementById('fs-reprt').value;
  const fsDiv    = document.getElementById('fs-div').value;
  if (!corpCode || !year) return;

  const content  = document.getElementById('fs-content');
  const queryBtn = document.getElementById('fs-query-btn');
  content.innerHTML = `<div class="state-box"><span class="spinner"></span>${t('fs_loading')}</div>`;
  document.getElementById('fs-actions').classList.remove('show');
  queryBtn.disabled = true;

  try {
    const proxy = getProxy();
    const url   = new URL(proxy);
    url.searchParams.set('ep',         'fnlttSinglAcntAll.json');
    url.searchParams.set('corp_code',  corpCode);
    url.searchParams.set('bsns_year',  year);
    url.searchParams.set('reprt_code', reprt);
    url.searchParams.set('fs_div',     fsDiv);

    const resp = await fetch(url.toString());
    const data = await resp.json();

    if (data.status !== '000' || !data.list?.length) {
      content.innerHTML = `<div class="state-box"><div class="state-icon">📭</div><div>${t('fs_empty')}</div></div>`;
      return;
    }

    _fsData = { list: data.list, year, fsDiv };
    renderFinSheet(data.list);
    document.getElementById('fs-actions').classList.add('show');

  } catch(e) {
    content.innerHTML = `<div class="state-box state-err"><div class="state-icon">⚠</div><div>${t('err_net')}: ${e.message}</div></div>`;
  } finally {
    queryBtn.disabled = false;
  }
}

/* ── 재무제표 테이블 렌더 ── */
function renderFinSheet(list) {
  // sj_div 순서 보장: BS → IS → CIS → CF → SCE → 기타
  const ORDER = ['BS','IS','CIS','CF','SCE'];
  const groups = {};
  for (const r of list) {
    if (!groups[r.sj_div]) groups[r.sj_div] = { nm: r.sj_nm, rows: [] };
    groups[r.sj_div].rows.push(r);
  }

  // 컬럼 헤더 (첫 행에서 추출)
  const first   = list[0];
  const colCur  = first.thstrm_nm  || '';
  const colPrev = first.frmtrm_nm  || '';
  const colPP   = first.bfefrmtrm_nm || '';
  const hasPP   = list.some(r => r.bfefrmtrm_amount && r.bfefrmtrm_amount !== '-' && r.bfefrmtrm_amount.trim() !== '');

  // 통화 단위 표시
  const currency = first.currency || 'KRW';
  document.getElementById('fs-unit-note').textContent =
    currency === 'KRW' ? t('fs_unit_krw') : `Unit: ${currency}`;

  const divs = [...ORDER.filter(d => groups[d]), ...Object.keys(groups).filter(d => !ORDER.includes(d))];

  let html = '';
  for (const div of divs) {
    const grp    = groups[div];
    const sjNm   = (t('fs_sj') || {})[div] || grp.nm;
    const sceTag = div === 'SCE'
      ? `<span class="fs-sce-note">${t('fs_sce_note')}</span>` : '';
    html += `<div class="fs-section">
      <div class="fs-section-title">${sjNm} (${div})${sceTag}</div>
      <table class="fs-table">
        <thead><tr>
          <th>${t('fs_account')}</th>
          <th>${colCur}</th>
          <th>${colPrev}</th>
          ${hasPP ? `<th>${colPP}</th>` : ''}
        </tr></thead>
        <tbody>${grp.rows.map(r => buildFsRow(r, hasPP)).join('')}</tbody>
      </table>
    </div>`;
  }
  document.getElementById('fs-content').innerHTML = html;
}

/* ── 재무제표 행 렌더 ── */
function buildFsRow(r, hasPP) {
  const detail    = cleanXbrlLabel((r.account_detail || '').trim());
  const hasDetail = detail && detail !== '-';

  const isSub = /^\s/.test(r.account_nm);
  const cls   = isSub ? 'fs-acc-sub' : 'fs-acc-main';
  const nm    = cleanXbrlLabel(r.account_nm.trim());

  const label = hasDetail
    ? `${nm}<span class="fs-detail-label">(${detail})</span>`
    : nm;

  return `<tr>
    <td class="${cls}" title="${r.account_id||''}">${label}</td>
    <td>${fmtFsAmount(r.thstrm_amount)}</td>
    <td>${fmtFsAmount(r.frmtrm_amount)}</td>
    ${hasPP ? `<td>${fmtFsAmount(r.bfefrmtrm_amount)}</td>` : ''}
  </tr>`;
}

/* ── XBRL 타입 주석 제거 ── */
// DART API는 XBRL 분류체계 주석을 bracket으로 반환:
//   "별도재무제표 [member]" → "별도재무제표"
//   "주식발행초과금 [구성요소]" → "주식발행초과금"
function cleanXbrlLabel(str) {
  if (!str) return str;
  return str.replace(/\s*\[[^\]]+\]/g, '').trim();
}

/* ── 금액 포매팅 (백만원 단위) ── */
function fmtFsAmount(raw) {
  if (!raw || raw.trim() === '' || raw.trim() === '-') return '<span class="fs-zero">—</span>';
  const n = parseInt(String(raw).replace(/,/g, ''), 10);
  if (isNaN(n)) return raw;
  if (n === 0) return '<span class="fs-zero">0</span>';
  const abs = Math.abs(n).toLocaleString('ko-KR');
  return n < 0
    ? `<span class="fs-neg">(${abs})</span>`
    : abs;
}

/* ── Excel 다운로드 (SheetJS) ── */
function downloadFinSheetExcel() {
  if (!_fsData?.list?.length) return;
  const { list, year, fsDiv } = _fsData;
  const wb   = buildFinExcelWb(list, _fsCorpName, year, fsDiv);
  const safe = _fsCorpName.replace(/[\\/:*?"<>|]/g, '_');
  XLSX.writeFile(wb, `fs_${safe}_${year}_${fsDiv}.xlsx`);
}

/* ── Excel 워크북 조립 (단건·대량 공통) ── */
function buildFinExcelWb(list, corpName, year, fsDiv) {
  const first    = list[0];
  const colCur   = first.thstrm_nm      || year + ' 당기';
  const colPrev  = first.frmtrm_nm      || (parseInt(year) - 1) + ' 전기';
  const colPP    = first.bfefrmtrm_nm   || (parseInt(year) - 2) + ' 전전기';
  const hasPP    = list.some(r => r.bfefrmtrm_amount && r.bfefrmtrm_amount.trim() !== '' && r.bfefrmtrm_amount.trim() !== '-');
  const currency = first.currency || 'KRW';
  const unitNote = currency === 'KRW' ? '(단위: 백만원)' : `(Unit: ${currency})`;
  const fsDivNm  = fsDiv === 'CFS' ? '연결재무제표' : '별도재무제표';

  const ORDER   = ['BS', 'IS', 'CIS', 'CF', 'SCE'];
  const SHEET_NM = { BS:'재무상태표', IS:'손익계산서', CIS:'포괄손익계산서', CF:'현금흐름표', SCE:'자본변동표' };

  const groups = {};
  for (const r of list) {
    if (!groups[r.sj_div]) groups[r.sj_div] = { nm: r.sj_nm, rows: [] };
    groups[r.sj_div].rows.push(r);
  }
  const divs = [...ORDER.filter(d => groups[d]), ...Object.keys(groups).filter(d => !ORDER.includes(d))];

  const wb = XLSX.utils.book_new();

  // ── 시트 1: 📌 안내
  const noteRows = [
    [`${corpName} 재무제표  |  ${year}년  ${fsDivNm}  ${unitNote}`],
    [''],
    ['■ 시트 구성'],
    ...divs.map(d => [`    ${SHEET_NM[d] || d}  (${d})`]),
    [''],
    ['■ 자본변동표(SCE) 안내'],
    ['    행 = 거래유형 (배당, 유상증자, 당기순이익 등)'],
    ['    열 = 자본구성요소 (자본금, 이익잉여금, 총계 등)'],
    ['    같은 거래가 여러 자본항목에 영향을 미치므로 행렬 형태로 표시됩니다.'],
    [''],
    ['■ 출처: DART 금융감독원 전자공시시스템 (opendart.fss.or.kr)'],
    [`■ 조회일: ${new Date().toLocaleDateString('ko-KR')}`],
  ];
  const noteWs = XLSX.utils.aoa_to_sheet(noteRows);
  noteWs['!cols'] = [{ wch: 70 }];
  XLSX.utils.book_append_sheet(wb, noteWs, '📌 안내');

  // ── BS / IS / CIS / CF 플랫 테이블
  for (const div of divs.filter(d => d !== 'SCE')) {
    const grp = groups[div];
    const hdr = ['계정과목ID', '계정과목', colCur, colPrev];
    if (hasPP) hdr.push(colPP);
    const dataRows = [hdr];
    for (const r of grp.rows) {
      const row = [r.account_id || '', cleanXbrlLabel(r.account_nm.trim()), parseFsAmount(r.thstrm_amount), parseFsAmount(r.frmtrm_amount)];
      if (hasPP) row.push(parseFsAmount(r.bfefrmtrm_amount));
      dataRows.push(row);
    }
    const ws = XLSX.utils.aoa_to_sheet(dataRows);
    ws['!cols'] = [{ wch: 18 }, { wch: 30 }, { wch: 16 }, { wch: 16 }, ...(hasPP ? [{ wch: 16 }] : [])];
    setIntegerFormat(ws);
    XLSX.utils.book_append_sheet(wb, ws, SHEET_NM[div] || div);
  }

  // ── SCE 행렬 피벗
  if (groups['SCE']) {
    const sceRows = groups['SCE'].rows;
    const txTypes = [], txSeen = new Set();
    for (const r of sceRows) { const nm = cleanXbrlLabel(r.account_nm.trim()); if (!txSeen.has(nm)) { txTypes.push(nm); txSeen.add(nm); } }
    const eqCols = [], eqSeen = new Set();
    for (const r of sceRows) {
      const raw = cleanXbrlLabel((r.account_detail || '').trim());
      const lbl = (raw && raw !== '-') ? raw.replace(/^자본\s*\|?\s*/, '') : '합계';
      if (!eqSeen.has(lbl)) { eqCols.push(lbl); eqSeen.add(lbl); }
    }
    const mapCur = {}, mapPrev = {}, mapPP = {};
    for (const r of sceRows) {
      const nm  = cleanXbrlLabel(r.account_nm.trim());
      const raw = cleanXbrlLabel((r.account_detail || '').trim());
      const lbl = (raw && raw !== '-') ? raw.replace(/^자본\s*\|?\s*/, '') : '합계';
      const key = `${nm}||${lbl}`;
      mapCur[key]  = parseFsAmount(r.thstrm_amount);
      mapPrev[key] = parseFsAmount(r.frmtrm_amount);
      if (hasPP) mapPP[key] = parseFsAmount(r.bfefrmtrm_amount);
    }
    const buildMatrix = (map, lbl) => {
      const hdr = ['구분', ...eqCols];
      const tbl = [[''], [`[ ${lbl} ]`], hdr];
      for (const tx of txTypes) { const row = [tx]; for (const eq of eqCols) row.push(map[`${tx}||${eq}`] ?? ''); tbl.push(row); }
      return tbl;
    };
    const matrix = [...buildMatrix(mapCur, colCur), [''], ...buildMatrix(mapPrev, colPrev)];
    if (hasPP) matrix.push([''], ...buildMatrix(mapPP, colPP));
    const sceWs = XLSX.utils.aoa_to_sheet(matrix);
    sceWs['!cols'] = [{ wch: 26 }, ...eqCols.map(() => ({ wch: 14 }))];
    setIntegerFormat(sceWs);
    XLSX.utils.book_append_sheet(wb, sceWs, '자본변동표');
  }

  return wb;
}

/* ── 금액 문자열 → 숫자 (Excel용) ── */
function parseFsAmount(raw) {
  if (!raw || raw.trim() === '' || raw.trim() === '-') return '';
  const n = parseInt(String(raw).replace(/,/g, ''), 10);
  return isNaN(n) ? raw : n;
}

/* ── SheetJS 워크시트 숫자 셀에 정수 포맷 적용 (E+14 방지) ── */
function setIntegerFormat(ws) {
  if (!ws['!ref']) return;
  const range = XLSX.utils.decode_range(ws['!ref']);
  for (let R = range.s.r; R <= range.e.r; R++) {
    for (let C = range.s.c; C <= range.e.c; C++) {
      const cell = ws[XLSX.utils.encode_cell({ r: R, c: C })];
      if (cell && cell.t === 'n') cell.z = '0';
    }
  }
}
