<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페이지 권한 관리 — WorksFree O&M</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#222536;--border:#2d3047;
  --text:#e2e8f0;--muted:#94a3b8;--hint:#64748b;
  --blue:#3b82f6;--green:#10b981;--yellow:#f59e0b;--red:#ef4444;
  --purple:#8b5cf6;--orange:#f97316;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px}

header{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.hdr-icon{font-size:22px}.hdr-title{font-size:16px;font-weight:600;flex:1}
.admin-badge{font-size:10px;font-weight:700;background:#3b0f0f;color:#fca5a5;border:1px solid rgba(220,38,38,.4);border-radius:10px;padding:2px 9px}

.page{max-width:1000px;margin:0 auto;padding:24px 16px 60px}

.section-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border)}

/* ── 권한 매트릭스 테이블 ── */
.perm-table{width:100%;border-collapse:collapse;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.perm-table thead th{background:var(--surface);padding:10px 14px;text-align:left;color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap}
.perm-table tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
.perm-table tbody tr:last-child{border-bottom:none}
.perm-table tbody tr:hover{background:var(--surface)}
td{padding:10px 14px;vertical-align:middle}
.page-name{font-weight:600;font-size:13px}
.page-path{font-size:11px;color:var(--hint);font-family:monospace;margin-top:2px}

/* 역할별 select */
.role-sel{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:6px;color:var(--text);padding:5px 8px;
  font-size:12px;font-family:inherit;cursor:pointer;outline:none;
  width:110px;
}
.role-sel:focus{border-color:var(--blue)}
.role-sel.level-full    {border-color:rgba(16,185,129,.5);color:var(--green)}
.role-sel.level-blur    {border-color:rgba(245,158,11,.5);color:var(--yellow)}
.role-sel.level-readonly{border-color:rgba(59,130,246,.5);color:#60a5fa}
.role-sel.level-hidden  {border-color:rgba(100,116,139,.4);color:var(--hint)}

/* 저장 버튼 */
.btn{padding:7px 18px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;transition:.15s}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{opacity:.85;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* 상태 메시지 */
#save-msg{font-size:13px;min-height:20px;margin-top:10px}
#save-msg.ok{color:var(--green)}
#save-msg.err{color:var(--red)}

/* 설명 카드 */
.info-card{background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.2);border-radius:10px;padding:14px 16px;margin-bottom:20px;font-size:12px;color:var(--muted);line-height:1.7}
.level-badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;margin-right:6px}
.lb-full    {background:rgba(16,185,129,.15);color:var(--green)}
.lb-blur    {background:rgba(245,158,11,.15);color:var(--yellow)}
.lb-readonly{background:rgba(59,130,246,.15);color:#60a5fa}
.lb-hidden  {background:rgba(100,116,139,.15);color:var(--muted)}

/* 어드민 게이트 */
#admin-gate{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;text-align:center}
#admin-gate.visible{display:flex}
</style>
</head>
<body>

<div id="admin-gate">
  <div style="font-size:48px">🔒</div>
  <div style="font-size:18px;font-weight:600">관리자 전용 페이지</div>
  <div style="font-size:13px;color:var(--muted)">이 페이지는 관리자 계정으로만 접근할 수 있습니다.</div>
</div>

<div id="main-content" style="display:none">

<header>
  <div class="hdr-icon">🔐</div>
  <div class="hdr-title">페이지 권한 관리 · Page Access Control</div>
  <span class="admin-badge">🔒 ADMIN</span>
</header>

<div class="page">

  <div class="info-card">
    <strong style="color:var(--text)">접근 레벨 설명</strong><br>
    <span class="level-badge lb-full">full</span> 정상 사용 가능<br>
    <span class="level-badge lb-blur">blur</span> 내용이 흐릿하게 표시 + "파트너 전용" 오버레이 — 유도용<br>
    <span class="level-badge lb-readonly">readonly</span> 선명하게 보이지만 클릭·입력 불가 (읽기 전용)<br>
    <span class="level-badge lb-hidden">hidden</span> 잠금 오버레이 표시 (기존 방식)
  </div>

  <div class="section-title">페이지별 역할 접근 권한</div>

  <table class="perm-table" id="perm-table">
    <thead>
      <tr>
        <th style="width:280px">페이지</th>
        <th>비로그인·일반</th>
        <th>컨설턴트</th>
        <th style="color:var(--hint)">파트너(GFC)</th>
        <th style="color:var(--hint)">관리자</th>
      </tr>
    </thead>
    <tbody id="perm-tbody">
      <tr><td colspan="5" style="text-align:center;padding:24px;color:var(--hint)">로딩 중...</td></tr>
    </tbody>
  </table>

  <div style="display:flex;align-items:center;gap:12px;margin-top:16px">
    <button class="btn btn-primary" id="btn-save" onclick="saveRules()">💾 저장</button>
    <button class="btn" onclick="resetToDefaults()">↺ 기본값으로 초기화</button>
    <span id="save-msg"></span>
  </div>

</div>
</div><!-- /main-content -->

<script>
const SUPABASE_URL  = 'https://rkycwfpkzorfpcxfvaqt.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJreWN3ZnBrem9yZnBjeGZ2YXF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMDk4OTQsImV4cCI6MjA5Mzg4NTg5NH0.u1HC0KiArbdqFAPpkRWsfZmMYqfZ-euRTHeNtUr2NBs';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// 설정 가능한 페이지 목록 (consultantOnly / gfcOnly 대상)
const CONFIGURABLE_PAGES = [
  { label:'경영종합진단 (GFC)',        path:'consulting/gfc/index.html' },
  { label:'CEO 플랜',                 path:'consulting/ceo/index.html' },
  { label:'상속·증여 진단',            path:'consulting/inheritance/index.html' },
  { label:'비상장주식 가치평가',        path:'consulting/stockval/index.html' },
  { label:'B2B 이메일 DB',            path:'consulting/bizdb/index.html' },
  { label:'마케팅 자료',               path:'consulting/marketing/index.html' },
  { label:'컨설팅 마인드맵',           path:'consulting/mindmap/index.html' },
  { label:'예비창업패키지',             path:'consulting/prebiz/index.html' },
  { label:'소상공인·자영업자 지원',     path:'consulting/soho/index.html' },
  { label:'중대재해처벌법',             path:'consulting/jdh/index.html' },
  { label:'ESG 자가진단',             path:'consulting/esg/index.html' },
  { label:'기업공시 조회',             path:'consulting/dart/index.html' },
  { label:'타코매니저 AI',             path:'consulting/tacomanager/index.html' },
];

const DEFAULT_RULES = {
  'consulting/gfc/index.html':         { general:'hidden', member:'hidden', consultant:'blur',  gfc:'full', admin:'full' },
  'consulting/ceo/index.html':         { general:'hidden', member:'hidden', consultant:'full',  gfc:'full', admin:'full' },
  'consulting/inheritance/index.html': { general:'hidden', member:'hidden', consultant:'full',  gfc:'full', admin:'full' },
  'consulting/stockval/index.html':    { general:'hidden', member:'hidden', consultant:'full',  gfc:'full', admin:'full' },
  'consulting/bizdb/index.html':       { general:'hidden', member:'hidden', consultant:'full',  gfc:'full', admin:'full' },
  'consulting/marketing/index.html':   { general:'hidden', member:'hidden', consultant:'full',  gfc:'full', admin:'full' },
};

const LEVELS = ['full', 'blur', 'readonly', 'hidden'];
const LEVEL_LABELS = { full:'전체 공개', blur:'블러', readonly:'읽기 전용', hidden:'숨김' };
const ROLES = [
  { key:'general',    label:'비로그인·일반' },
  { key:'consultant', label:'컨설턴트' },
  { key:'gfc',        label:'파트너(GFC)',  fixed:'full' },
  { key:'admin',      label:'관리자',       fixed:'full' },
];

let currentRules = {};

// ── 어드민 게이트 ────────────────────────────────────────────────────
(async () => {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      const { data: p } = await sb.from('profiles').select('role').eq('id', session.user.id).single();
      if (p?.role === 'admin') { boot(); return; }
    }
  } catch {}
  document.getElementById('admin-gate').classList.add('visible');
})();

async function boot() {
  document.getElementById('main-content').style.display = 'block';
  await loadRules();
  renderTable();
}

async function loadRules() {
  try {
    const { data } = await sb.from('site_config').select('value').eq('key','page_access_rules').maybeSingle();
    currentRules = data?.value ? { ...DEFAULT_RULES, ...data.value } : { ...DEFAULT_RULES };
  } catch {
    currentRules = { ...DEFAULT_RULES };
  }
}

function getRule(path, roleKey) {
  return currentRules[path]?.[roleKey] || 'full';
}

function renderTable() {
  const tbody = document.getElementById('perm-tbody');
  tbody.innerHTML = CONFIGURABLE_PAGES.map(page => {
    const roleCells = ROLES.map(role => {
      if (role.fixed) {
        return `<td><span class="level-badge lb-full" style="padding:4px 10px">항상 full</span></td>`;
      }
      const cur = getRule(page.path, role.key);
      const opts = LEVELS.map(l =>
        `<option value="${l}" ${l===cur?'selected':''}>${LEVEL_LABELS[l]}</option>`
      ).join('');
      return `<td><select class="role-sel level-${cur}" data-path="${page.path}" data-role="${role.key}" onchange="onSelChange(this)">${opts}</select></td>`;
    }).join('');
    return `<tr>
      <td>
        <div class="page-name">${page.label}</div>
        <div class="page-path">${page.path}</div>
      </td>
      ${roleCells}
    </tr>`;
  }).join('');
}

function onSelChange(sel) {
  const { path, role } = sel.dataset;
  const level = sel.value;
  if (!currentRules[path]) currentRules[path] = {};
  currentRules[path][role] = level;
  // fixed 역할(gfc, admin)은 항상 full 유지
  currentRules[path].gfc   = 'full';
  currentRules[path].admin = 'full';
  // select 색상 업데이트
  sel.className = `role-sel level-${level}`;
  setMsg('');
}

async function saveRules() {
  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  setMsg('저장 중...');
  try {
    // site_config upsert
    const { error } = await sb.from('site_config').upsert(
      { key: 'page_access_rules', value: currentRules, updated_at: new Date().toISOString() },
      { onConflict: 'key' }
    );
    if (error) throw error;
    setMsg('✅ 저장 완료 — Hub 재방문 시 즉시 적용됩니다', 'ok');
  } catch(e) {
    setMsg('❌ 저장 실패: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

function resetToDefaults() {
  if (!confirm('모든 설정을 기본값으로 초기화하시겠습니까?')) return;
  currentRules = { ...DEFAULT_RULES };
  renderTable();
  setMsg('기본값으로 초기화됐습니다. 저장하려면 [저장] 버튼을 누르세요.');
}

function setMsg(msg, type = '') {
  const el = document.getElementById('save-msg');
  el.textContent = msg;
  el.className   = type;
}
</script>
</body>
</html>
