# ════════════════════════════════════════════════════════
#  g1consulting.worksfree.kr — Nginx 설정
#
#  적용 방법:
#    DSM → 웹 스테이션 → Nginx 커스텀 설정에 이 내용 추가
#    또는 /etc/nginx/conf.d/g1consulting.conf 로 저장
#
#  Cloudflare Tunnel 설정:
#    도메인: g1consulting.worksfree.kr
#    서비스: http://localhost:8083
# ════════════════════════════════════════════════════════

server {
    listen 8083;
    server_name g1consulting.worksfree.kr localhost;

    root  /volume1/web/g1consulting;
    index index.html;

    # 모든 경로 → index.html (SPA 대응)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML은 캐시 안 함
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # 보안 헤더
    add_header X-Frame-Options      "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
