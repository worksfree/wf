# ══════════════════════════════════════════════════════════════
#  WorksFree Consulting — Nginx 설정
#  서브도메인: consulting.worksfree.kr
#  4개 서비스만 노출: ESG 자가진단 · 기업공시 조회 · 타코 매니저 · 블로그 자동화
#
#  배포: deploy.ps1 → [7] consulting
#    consulting/         → /volume1/web/consulting/
#    app-store/web/naver-blog-commenter/ → /volume1/web/consulting/blog/
#
#  적용: DSM → 웹 스테이션 → 가상 호스트 선택 → 사용자 설정 → Nginx 사용자 설정
#      또는 /etc/nginx/conf.d/consulting.conf
# ══════════════════════════════════════════════════════════════

server {
    listen 80;
    listen 443 ssl;

    server_name consulting.worksfree.kr;

    # SSL 인증서 (Let's Encrypt — DSM 자동 발급)
    ssl_certificate     /usr/syno/etc/certificate/system/default/fullchain.pem;
    ssl_certificate_key /usr/syno/etc/certificate/system/default/privkey.pem;

    # HTTP → HTTPS 강제 리다이렉트
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    # ── 루트 ─────────────────────────────────────────────────
    root /volume1/web/consulting;
    index index.html;

    # ── ESG 자가진단 ──────────────────────────────────────────
    location ^~ /esg/ {
        try_files $uri $uri/ /esg/index.html;
    }

    # ── 기업공시 조회 (DART) ──────────────────────────────────
    location ^~ /dart/ {
        try_files $uri $uri/ /dart/index.html;
    }

    # ── 타코 매니저 (v1 · v2 · v3 서브노드 포함) ─────────────
    location ^~ /tacomanager/ {
        try_files $uri $uri/ /tacomanager/index.html;
    }

    # ── 블로그 자동화 ─────────────────────────────────────────
    location ^~ /blog/ {
        try_files $uri $uri/ /blog/index.html;
    }

    # ── 대시보드 (루트) ──────────────────────────────────────
    location = / {
        try_files /index.html =404;
    }

    # ── 허용된 4개 경로 외 전부 차단 ─────────────────────────
    location / {
        return 404;
    }

    # ── 보안 헤더 ─────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # ── 캐시 설정 ─────────────────────────────────────────────
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location ~* \.(js|css|png|jpg|svg|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
