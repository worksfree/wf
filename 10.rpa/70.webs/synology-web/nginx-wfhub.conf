# ════════════════════════════════════════════════════════
#  WorksFree Hub — Nginx 설정
#  적용 위치: 시놀로지 DSM → 웹 스테이션 → Nginx 커스텀 설정
#  또는 /etc/nginx/conf.d/wfhub.conf 에 저장
# ════════════════════════════════════════════════════════

server {
    listen 80;
    listen 443 ssl;

    # ── 도메인 설정 ──────────────────────────────────────
    # 시놀로지 DDNS 또는 커스텀 도메인으로 변경
    server_name hub.worksfree.co.kr;

    # SSL 인증서 (Let's Encrypt — DSM 자동 발급)
    ssl_certificate     /usr/syno/etc/certificate/system/default/fullchain.pem;
    ssl_certificate_key /usr/syno/etc/certificate/system/default/privkey.pem;

    # HTTP → HTTPS 강제 리다이렉트
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    # ── 정적 파일 루트 ────────────────────────────────────
    # 시놀로지 Web Station 기본 경로 (실제 경로로 변경)
    root /volume1/web/portal;
    index index.html;

    # ── 기본 접근 (공용 콘텐츠) ──────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    # ════════════════════════════════════════════════════
    #  NAS 임시 파일 저장소 — WebDAV (DB 없음, NAS 파일시스템 직접 저장)
    #  - GET  /nas-uploads/          → 파일 목록 (autoindex JSON)
    #  - PUT  /nas-uploads/파일명    → 파일 업로드
    #  - DELETE /nas-uploads/파일명  → 파일 삭제
    #  - 보안: Supabase 어드민 게이트 (1차). nginx는 파일 서빙만 담당.
    #
    #  초기 설정 1회 (SSH):
    #    ssh wfadmin@192.168.100.38 "mkdir -p /volume1/web/nas_uploads && chmod 755 /volume1/web/nas_uploads"
    # ════════════════════════════════════════════════════
    location /nas-uploads/ {
        alias /volume1/web/nas_uploads/;

        dav_methods         PUT DELETE MKCOL;
        create_full_put_path on;
        dav_access          user:rw group:rw all:rw;

        autoindex           on;
        autoindex_format    json;
        autoindex_exact_size on;
        autoindex_localtime  on;

        client_max_body_size 500m;

        add_header Access-Control-Allow-Origin  *                              always;
        add_header Access-Control-Allow-Methods "GET, PUT, DELETE, OPTIONS"    always;
        add_header Access-Control-Allow-Headers "Content-Type"                 always;

        if ($request_method = OPTIONS) { return 204; }
    }

    # ════════════════════════════════════════════════════
    #  파트너 전용 경로 — Basic Auth 적용
    #  /gfc/ 하위 모든 파일에 ID/PW 인증 요구
    # ════════════════════════════════════════════════════
    location /consulting/gfc/ {
        # 브라우저 인증 팝업 메시지
        auth_basic "파트너 전용 영역 — 인증 필요";

        # htpasswd 파일 경로
        # 생성 방법: setup-auth.sh 실행 또는 아래 수동 명령 참고
        auth_basic_user_file /volume1/web/portal/.htpasswd-gfc;

        try_files $uri $uri/ =404;
    }

    # ── 보안 헤더 ─────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # ── 캐시 설정 ─────────────────────────────────────────
    # HTML은 캐시 안 함 (항상 최신 버전)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    # 정적 자산은 캐시 (7일)
    location ~* \.(js|css|png|jpg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
