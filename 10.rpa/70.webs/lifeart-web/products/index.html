<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전체 상품 — LifeArt</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="page-hero">
  <div class="kicker">Products</div>
  <h1>LifeArt의 4대 상품</h1>
</div>

<div class="section">
  <div class="product-grid">
    <a href="#" class="product-card wip" aria-label="개발 예정">
      <div class="thumb">📘</div>
      <div class="body">
        <h3>포토북 <span class="badge">Coming Soon</span></h3>
        <p>일상의 순간을 한 권의 책으로. 곧 만나보실 수 있습니다.</p>
      </div>
    </a>
    <a href="/products/instant-album/" class="product-card">
      <div class="thumb" style="background-image:url('/assets/img/hero-02.png');"></div>
      <div class="body">
        <h3>삽입식 기념앨범</h3>
        <p>여행 · 행사의 추억을 즉석에서 완성하는 프리미엄 앨범.</p>
      </div>
    </a>
    <a href="/products/vip-album/" class="product-card">
      <div class="thumb" style="background-image:url('/assets/img/hero-vip.png');"></div>
      <div class="body">
        <h3>VIP 앨범 <span class="badge hot">BEST</span></h3>
        <p>기업 임직원·행사를 위한 가죽·금속 코너 프리미엄 앨범.</p>
      </div>
    </a>
    <a href="/products/frame/" class="product-card">
      <div class="thumb" style="background-image:url('/assets/img/corp-album-1.jpg');"></div>
      <div class="body">
        <h3>액자</h3>
        <p>슬림 크리스탈 · 티크목 · 삼각소 등 다양한 맞춤 액자.</p>
      </div>
    </a>
  </div>
</div>

<div id="site-footer"></div>
<script src="/assets/layout.js"></script>
</body>
</html>
