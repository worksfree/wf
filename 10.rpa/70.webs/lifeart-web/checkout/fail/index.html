<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결제 실패 — LifeArt</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="page-hero">
  <div class="kicker">Checkout</div>
  <h1>결제 실패</h1>
</div>

<div class="content-section" style="display:flex; justify-content:center;">
  <div class="form-box" style="max-width:460px; width:100%; text-align:center;" id="fail-box">
    <div style="font-size:40px; margin-bottom:12px;">⚠️</div>
    <div style="font-size:16px; font-weight:700; color:var(--text-dark); margin-bottom:6px;" id="fail-msg">결제가 완료되지 않았습니다</div>
    <a href="/mypage/" class="btn-outline" style="display:inline-block; padding:10px 22px; margin-top:12px;">마이페이지로 이동</a>
  </div>
</div>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/config.js"></script>
<script src="/assets/auth.js"></script>
<script src="/assets/layout.js"></script>
<script>
document.addEventListener('layout:ready', () => {
  const msg = new URLSearchParams(location.search).get('message');
  if (msg) document.getElementById('fail-msg').textContent = decodeURIComponent(msg);
});
</script>
</body>
</html>
