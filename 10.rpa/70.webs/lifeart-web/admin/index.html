<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 — LifeArt</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
  #admin-gate {
    display:flex; position:fixed; inset:0; align-items:center; justify-content:center;
    flex-direction:column; background:var(--deep-charcoal); color:white; z-index:500; gap:10px;
  }
  .admin-table { width:100%; border-collapse:collapse; font-size:13px; }
  .admin-table th { background:var(--deep-charcoal); color:var(--muted-gold); padding:9px 12px; text-align:left; }
  .admin-table td { padding:9px 12px; border-bottom:1px solid var(--border); color:var(--text-mid); }
  .admin-table tr:nth-child(even) td { background:var(--soft-gray); }
  .admin-table select { font-size:12px; padding:4px 6px; border-radius:4px; border:1px solid var(--border); }
</style>
</head>
<body>

<div id="admin-gate">
  <div style="font-size:15px;">🔒 관리자 전용 페이지입니다</div>
  <a href="/auth/login/" style="color:var(--muted-gold); font-size:13px;">로그인하러 가기</a>
</div>

<div id="site-header"></div>

<div class="page-hero">
  <div class="kicker">Admin</div>
  <h1>관리자</h1>
</div>

<div class="content-section" style="max-width:1000px;">
  <div class="tab-row">
    <button class="tab-btn active" data-tab="orders">주문 관리</button>
    <button class="tab-btn" data-tab="inquiries">문의 관리</button>
  </div>

  <div class="tab-panel active" id="tab-orders" style="overflow-x:auto;">
    <table class="admin-table" id="orders-table">
      <thead><tr><th>주문일</th><th>상품</th><th>수량</th><th>금액</th><th>상태</th><th>배송상태</th></tr></thead>
      <tbody><tr><td colspan="6">불러오는 중...</td></tr></tbody>
    </table>
  </div>

  <div class="tab-panel" id="tab-inquiries" style="overflow-x:auto;">
    <table class="admin-table" id="inquiries-table">
      <thead><tr><th>접수일</th><th>구분</th><th>이름</th><th>연락처</th><th>내용</th><th>상태</th></tr></thead>
      <tbody><tr><td colspan="6">불러오는 중...</td></tr></tbody>
    </table>
  </div>
</div>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/config.js"></script>
<script src="/assets/auth.js"></script>
<script src="/assets/layout.js"></script>
<script>
document.addEventListener('layout:ready', initAdmin);

async function initAdmin() {
  // localhost bypass — Live Server는 세션이 격리되어 있어 운영 도메인 로그인 상태를 못 봄 (개발 편의용)
  const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';

  const { data: { session } } = await sb.auth.getSession();
  if (!isLocal) {
    if (!session) return; // 게이트 표시 유지
    const { data: profile } = await sb.from('profiles').select('role').eq('id', session.user.id).single();
    if (profile?.role !== 'admin') return; // 게이트 표시 유지 (관리자 아님)
  }
  document.getElementById('admin-gate').style.display = 'none';

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  await loadOrders();
  await loadInquiries();
}

async function loadOrders() {
  const { data: orders, error } = await sb.from('orders').select('*, products(name)').order('created_at', { ascending: false });
  const tbody = document.querySelector('#orders-table tbody');
  if (error || !orders || !orders.length) {
    tbody.innerHTML = '<tr><td colspan="6">주문이 없습니다.</td></tr>';
    return;
  }
  tbody.innerHTML = orders.map(o => `
    <tr>
      <td>${new Date(o.created_at).toLocaleDateString('ko-KR')}</td>
      <td>${o.products?.name || '-'}</td>
      <td>${o.quantity}</td>
      <td>${o.amount.toLocaleString()}원</td>
      <td>${o.status}</td>
      <td>
        <select onchange="updateShipping('${o.id}', this.value)">
          <option value="ready" ${o.shipping_status === 'ready' ? 'selected' : ''}>준비중</option>
          <option value="shipping" ${o.shipping_status === 'shipping' ? 'selected' : ''}>배송중</option>
          <option value="delivered" ${o.shipping_status === 'delivered' ? 'selected' : ''}>배송완료</option>
        </select>
      </td>
    </tr>`).join('');
}

async function updateShipping(orderId, status) {
  await sb.from('orders').update({ shipping_status: status }).eq('id', orderId);
}

async function loadInquiries() {
  const { data: inquiries, error } = await sb.from('inquiries').select('*').order('created_at', { ascending: false });
  const tbody = document.querySelector('#inquiries-table tbody');
  if (error || !inquiries || !inquiries.length) {
    tbody.innerHTML = '<tr><td colspan="6">문의가 없습니다.</td></tr>';
    return;
  }
  const typeLabel = { estimate: '견적', qna: '1:1문의', partnership: '제휴' };
  tbody.innerHTML = inquiries.map(q => `
    <tr>
      <td>${new Date(q.created_at).toLocaleDateString('ko-KR')}</td>
      <td>${typeLabel[q.type] || q.type}</td>
      <td>${q.name}</td>
      <td>${q.phone || '-'}</td>
      <td style="max-width:280px;">${(q.message || '').slice(0, 60)}</td>
      <td>
        <select onchange="updateInquiryStatus('${q.id}', this.value)">
          <option value="new" ${q.status === 'new' ? 'selected' : ''}>신규</option>
          <option value="answered" ${q.status === 'answered' ? 'selected' : ''}>답변완료</option>
          <option value="closed" ${q.status === 'closed' ? 'selected' : ''}>종료</option>
        </select>
      </td>
    </tr>`).join('');
}

async function updateInquiryStatus(id, status) {
  await sb.from('inquiries').update({ status }).eq('id', id);
}
</script>
</body>
</html>
