<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 — LifeArt</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
  #admin-gate {
    display:flex; position:fixed; inset:0; align-items:center; justify-content:center;
    flex-direction:column; background:var(--deep-charcoal); color:white; z-index:500; gap:10px;
  }
  .admin-table { width:100%; border-collapse:collapse; font-size:13px; }
  .admin-table th { background:var(--deep-charcoal); color:var(--muted-gold); padding:9px 12px; text-align:left; white-space:nowrap; }
  .admin-table td { padding:9px 12px; border-bottom:1px solid var(--border); color:var(--text-mid); vertical-align:top; }
  .admin-table tr:nth-child(even) td { background:var(--soft-gray); }
  .admin-table select { font-size:12px; padding:4px 6px; border-radius:4px; border:1px solid var(--border); }
  .adm-btn { font-size:12px; padding:5px 10px; border-radius:5px; border:1px solid var(--border); background:white; cursor:pointer; color:var(--text-mid); }
  .adm-btn.primary { background:var(--deep-charcoal); color:white; border-color:var(--deep-charcoal); }
  .adm-btn.danger { color:#C62828; border-color:#f0c4c4; }
  .adm-btn:hover { border-color:var(--accent); }
  .adm-toolbar { display:flex; justify-content:flex-end; margin-bottom:12px; gap:8px; }
  .adm-editor { background:var(--soft-gray); border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:16px; display:none; }
  .adm-editor.open { display:block; }
  .adm-editor input, .adm-editor textarea { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:inherit; margin-bottom:8px; background:white; color:var(--text-dark); }
  .adm-editor textarea { min-height:80px; resize:vertical; }
  .adm-editor label { font-size:12px; color:var(--text-mid); display:block; margin-bottom:3px; }
  .adm-editor .row { display:flex; gap:10px; align-items:center; margin-bottom:8px; }
  .adm-editor .row label { margin:0; }
  .type-badge { font-size:10px; padding:2px 7px; border-radius:10px; background:var(--soft-gray); color:var(--text-mid); }
  .type-badge.estimate { background:#FDF0D8; color:#B8943E; }
  .type-badge.qna { background:#E8F0FA; color:#3a6ea5; }
  .type-badge.partnership { background:#E8F4E8; color:#2E7D32; }
  .st-badge { font-size:10px; padding:2px 7px; border-radius:10px; }
  .st-badge.new { background:#FDE8E8; color:#C62828; }
  .st-badge.answered { background:#E8F4E8; color:#2E7D32; }
  .st-badge.closed { background:var(--soft-gray); color:var(--text-light); }
  .inq-detail { background:var(--soft-gray); border-radius:8px; padding:14px; margin-top:8px; font-size:13px; }
  .inq-detail .msg { white-space:pre-line; color:var(--text-dark); margin:8px 0; }
</style>
</head>
<body>

<div id="admin-gate">
  <div style="font-size:15px;">🔒 관리자 전용 페이지입니다</div>
  <a href="/auth/login/" style="color:var(--muted-gold); font-size:13px;">로그인하러 가기</a>
</div>

<div id="site-header"></div>

<div class="page-hero">
  <div class="kicker">Admin · O&amp;M</div>
  <h1>운영 관리</h1>
</div>

<div class="content-section" style="max-width:1040px;">
  <div class="tab-row">
    <button class="tab-btn active" data-tab="orders">주문 관리</button>
    <button class="tab-btn" data-tab="inquiries">문의 관리</button>
    <button class="tab-btn" data-tab="notices">공지사항</button>
    <button class="tab-btn" data-tab="faqs">FAQ</button>
    <button class="tab-btn needs-stage-2" data-tab="press">보도자료</button>
  </div>

  <!-- 주문 -->
  <div class="tab-panel active" id="tab-orders" style="overflow-x:auto;">
    <table class="admin-table" id="orders-table">
      <thead><tr><th>주문일</th><th>상품</th><th>수량</th><th>금액</th><th>상태</th><th>배송상태</th></tr></thead>
      <tbody><tr><td colspan="6">불러오는 중...</td></tr></tbody>
    </table>
  </div>

  <!-- 문의 (1:1 / 견적 / 제휴 통합) -->
  <div class="tab-panel" id="tab-inquiries">
    <div class="adm-toolbar">
      <select id="inq-filter" class="adm-btn">
        <option value="">전체 유형</option>
        <option value="qna">1:1 문의</option>
        <option value="estimate">견적 문의</option>
        <option value="partnership">제휴 문의</option>
      </select>
    </div>
    <div style="overflow-x:auto;">
      <table class="admin-table" id="inq-table">
        <thead><tr><th>접수일</th><th>유형</th><th>이름</th><th>연락처</th><th>내용</th><th>상태</th><th></th></tr></thead>
        <tbody><tr><td colspan="7">불러오는 중...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- 공지 -->
  <div class="tab-panel" id="tab-notices">
    <div class="adm-toolbar"><button class="adm-btn primary" onclick="openNoticeEditor()">+ 공지 등록</button></div>
    <div class="adm-editor" id="notice-editor">
      <input type="hidden" id="notice-id">
      <label>제목</label><input type="text" id="notice-title" placeholder="공지 제목">
      <label>내용</label><textarea id="notice-body" placeholder="공지 내용"></textarea>
      <div class="row">
        <label><input type="checkbox" id="notice-pinned"> 상단 고정</label>
        <label><input type="checkbox" id="notice-published" checked> 게시</label>
      </div>
      <div class="adm-toolbar" style="margin:0;">
        <button class="adm-btn" onclick="closeNoticeEditor()">취소</button>
        <button class="adm-btn primary" onclick="saveNotice()">저장</button>
      </div>
    </div>
    <div style="overflow-x:auto;">
      <table class="admin-table" id="notice-table">
        <thead><tr><th>제목</th><th>게시</th><th>고정</th><th>등록일</th><th></th></tr></thead>
        <tbody><tr><td colspan="5">불러오는 중...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- FAQ -->
  <div class="tab-panel" id="tab-faqs">
    <div class="adm-toolbar"><button class="adm-btn primary" onclick="openFaqEditor()">+ FAQ 등록</button></div>
    <div class="adm-editor" id="faq-editor">
      <input type="hidden" id="faq-id">
      <label>질문</label><input type="text" id="faq-question" placeholder="자주 묻는 질문">
      <label>답변</label><textarea id="faq-answer" placeholder="답변 내용"></textarea>
      <div class="row">
        <label>정렬순서 <input type="number" id="faq-sort" value="0" style="width:70px;display:inline-block;"></label>
        <label><input type="checkbox" id="faq-published" checked> 게시</label>
      </div>
      <div class="adm-toolbar" style="margin:0;">
        <button class="adm-btn" onclick="closeFaqEditor()">취소</button>
        <button class="adm-btn primary" onclick="saveFaq()">저장</button>
      </div>
    </div>
    <div style="overflow-x:auto;">
      <table class="admin-table" id="faq-table">
        <thead><tr><th>질문</th><th>게시</th><th>순서</th><th></th></tr></thead>
        <tbody><tr><td colspan="4">불러오는 중...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- 보도자료 -->
  <div class="tab-panel" id="tab-press">
    <div class="adm-toolbar"><button class="adm-btn primary" onclick="openPressEditor()">+ 보도자료 등록</button></div>
    <div class="adm-editor" id="press-editor">
      <input type="hidden" id="press-id">
      <label>제목</label><input type="text" id="press-title" placeholder="보도자료 제목">
      <div class="row">
        <div style="flex:1;"><label>매체 · 출처</label><input type="text" id="press-outlet" placeholder="예: 매일경제"></div>
        <div style="flex:1;"><label>보도일</label><input type="date" id="press-date"></div>
      </div>
      <label>요약 · 본문</label><textarea id="press-summary" placeholder="보도 내용 요약"></textarea>
      <label>원문 링크 (선택)</label><input type="url" id="press-link" placeholder="https://">
      <div class="row">
        <label><input type="checkbox" id="press-pinned"> 상단 고정</label>
        <label><input type="checkbox" id="press-published" checked> 게시</label>
      </div>
      <div class="adm-toolbar" style="margin:0;">
        <button class="adm-btn" onclick="closePressEditor()">취소</button>
        <button class="adm-btn primary" onclick="savePress()">저장</button>
      </div>
    </div>
    <div style="overflow-x:auto;">
      <table class="admin-table" id="press-table">
        <thead><tr><th>제목</th><th>매체</th><th>보도일</th><th>게시</th><th>고정</th><th></th></tr></thead>
        <tbody><tr><td colspan="6">불러오는 중...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/config.js"></script>
<script src="/assets/dev-toolkit.js"></script>
<script src="/assets/auth.js"></script>
<script src="/assets/layout.js"></script>
<script>
document.addEventListener('layout:ready', initAdmin);
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function initAdmin() {
  const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  const { data: { session } } = await sb.auth.getSession();
  if (!isLocal) {
    if (!session) return;
    const { data: profile } = await sb.from('profiles').select('role, tenant_id').eq('id', session.user.id).single();
    if (profile?.role !== 'admin' || profile?.tenant_id !== TENANT_UUID) return;
  }
  document.getElementById('admin-gate').style.display = 'none';

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });
  document.getElementById('inq-filter').addEventListener('change', loadInquiries);

  await loadOrders();
  await loadInquiries();
  await loadNotices();
  await loadFaqs();
  await loadPress();
}

/* ── 주문 ── */
async function loadOrders() {
  const { data: orders, error } = await sb.from('lifeart_orders').select('*, lifeart_products(name)').order('created_at', { ascending: false });
  const tb = document.querySelector('#orders-table tbody');
  if (error || !orders?.length) { tb.innerHTML = '<tr><td colspan="6">주문이 없습니다.</td></tr>'; return; }
  tb.innerHTML = orders.map(o => `
    <tr>
      <td>${new Date(o.created_at).toLocaleDateString('ko-KR')}</td>
      <td>${esc(o.lifeart_products?.name) || '-'}</td>
      <td>${o.quantity}</td>
      <td>${o.amount.toLocaleString()}원</td>
      <td>${o.status}</td>
      <td><select onchange="updateShipping('${o.id}', this.value)">
        <option value="ready" ${o.shipping_status==='ready'?'selected':''}>준비중</option>
        <option value="shipping" ${o.shipping_status==='shipping'?'selected':''}>배송중</option>
        <option value="delivered" ${o.shipping_status==='delivered'?'selected':''}>배송완료</option>
      </select></td>
    </tr>`).join('');
}
async function updateShipping(id, status) { await sb.from('lifeart_orders').update({ shipping_status: status }).eq('id', id); }

/* ── 문의 (1:1/견적/제휴 통합) ── */
const TYPE_LABEL = { qna:'1:1문의', estimate:'견적', partnership:'제휴' };
async function loadInquiries() {
  const filter = document.getElementById('inq-filter').value;
  let q = sb.from('lifeart_inquiries').select('*').order('created_at', { ascending: false });
  if (filter) q = q.eq('type', filter);
  const { data, error } = await q;
  const tb = document.querySelector('#inq-table tbody');
  if (error || !data?.length) { tb.innerHTML = '<tr><td colspan="7">문의가 없습니다.</td></tr>'; return; }
  tb.innerHTML = data.map(q => `
    <tr>
      <td>${new Date(q.created_at).toLocaleDateString('ko-KR')}</td>
      <td><span class="type-badge ${q.type}">${TYPE_LABEL[q.type]||q.type}</span></td>
      <td>${esc(q.name)}</td>
      <td>${esc(q.phone)||'-'}</td>
      <td style="max-width:240px;">${esc((q.message||'').slice(0,40))}</td>
      <td><span class="st-badge ${q.status}">${q.status==='new'?'신규':q.status==='answered'?'답변완료':'종료'}</span></td>
      <td><button class="adm-btn" onclick="toggleInqDetail('${q.id}', this)">${q.type==='estimate'?'보기':'답변'}</button></td>
    </tr>
    <tr id="inq-row-${q.id}" style="display:none"><td colspan="7">
      <div class="inq-detail">
        <div><b>${esc(q.name)}</b> · ${esc(q.phone)||''} · ${esc(q.email)||'이메일 없음'}</div>
        <div class="msg">${esc(q.message)}</div>
        ${q.type==='estimate' ? renderEstimateView(q) : renderReplyForm(q)}
      </div>
    </td></tr>`).join('');
}
function renderEstimateView(q) {
  // 견적문의는 목록/상세만 (답변 기능 없음), 상태 변경만 허용
  return `<div style="margin-top:8px;">상태:
    <select onchange="updateInqStatus('${q.id}', this.value)">
      <option value="new" ${q.status==='new'?'selected':''}>신규</option>
      <option value="answered" ${q.status==='answered'?'selected':''}>처리완료</option>
      <option value="closed" ${q.status==='closed'?'selected':''}>종료</option>
    </select></div>`;
}
function renderReplyForm(q) {
  return `
    <div style="margin-top:10px;">
      <label style="font-size:12px;color:var(--text-mid);">답변 작성</label>
      <textarea id="ans-${q.id}" style="width:100%;min-height:70px;padding:8px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px;">${esc(q.answer)||''}</textarea>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;align-items:center;">
        ${q.answered_at ? `<span style="font-size:11px;color:var(--text-light);margin-right:auto;">최종 답변: ${new Date(q.answered_at).toLocaleString('ko-KR')}</span>` : ''}
        <button class="adm-btn primary" onclick="saveAnswer('${q.id}')">답변 저장</button>
      </div>
      <div class="form-msg" id="ans-msg-${q.id}" style="font-size:12px;"></div>
    </div>`;
}
function toggleInqDetail(id, btn) {
  const row = document.getElementById('inq-row-' + id);
  row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
}
async function updateInqStatus(id, status) { await sb.from('lifeart_inquiries').update({ status }).eq('id', id); }
async function saveAnswer(id) {
  const msgEl = document.getElementById('ans-msg-' + id);
  const answer = document.getElementById('ans-' + id).value.trim();
  const { data: { session } } = await sb.auth.getSession();
  const { error } = await sb.from('lifeart_inquiries').update({
    answer, answered_at: new Date().toISOString(), answered_by: session?.user?.id || null, status: 'answered',
  }).eq('id', id);
  msgEl.textContent = error ? '저장 실패' : '답변이 저장되었습니다. (회원 문의는 마이페이지에 노출됩니다)';
  msgEl.className = 'form-msg ' + (error ? 'error' : 'success');
  if (!error) loadInquiries();
}

/* ── 공지 ── */
async function loadNotices() {
  const { data, error } = await sb.from('lifeart_notices').select('*').order('created_at', { ascending: false });
  const tb = document.querySelector('#notice-table tbody');
  if (error || !data?.length) { tb.innerHTML = '<tr><td colspan="5">공지가 없습니다.</td></tr>'; return; }
  tb.innerHTML = data.map(n => `
    <tr>
      <td>${esc(n.title)}</td>
      <td>${n.is_published?'✔':'—'}</td>
      <td>${n.pinned?'📌':'—'}</td>
      <td>${new Date(n.created_at).toLocaleDateString('ko-KR')}</td>
      <td><button class="adm-btn" onclick='editNotice(${JSON.stringify(n)})'>수정</button>
          <button class="adm-btn danger" onclick="delNotice('${n.id}')">삭제</button></td>
    </tr>`).join('');
}
function openNoticeEditor() { document.getElementById('notice-editor').classList.add('open'); }
function closeNoticeEditor() {
  document.getElementById('notice-editor').classList.remove('open');
  ['notice-id','notice-title','notice-body'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('notice-pinned').checked=false; document.getElementById('notice-published').checked=true;
}
function editNotice(n) {
  document.getElementById('notice-id').value=n.id;
  document.getElementById('notice-title').value=n.title;
  document.getElementById('notice-body').value=n.body;
  document.getElementById('notice-pinned').checked=n.pinned;
  document.getElementById('notice-published').checked=n.is_published;
  openNoticeEditor();
}
async function saveNotice() {
  const id=document.getElementById('notice-id').value;
  const payload={ title:document.getElementById('notice-title').value.trim(),
    body:document.getElementById('notice-body').value.trim(),
    pinned:document.getElementById('notice-pinned').checked,
    is_published:document.getElementById('notice-published').checked,
    tenant_id:TENANT_UUID, updated_at:new Date().toISOString() };
  if(!payload.title){ alert('제목을 입력하세요'); return; }
  const { error } = id
    ? await sb.from('lifeart_notices').update(payload).eq('id',id)
    : await sb.from('lifeart_notices').insert(payload);
  if(error){ alert('저장 실패: '+error.message); return; }
  closeNoticeEditor(); loadNotices();
}
async function delNotice(id){ if(!confirm('삭제하시겠습니까?'))return; await sb.from('lifeart_notices').delete().eq('id',id); loadNotices(); }

/* ── FAQ ── */
async function loadFaqs() {
  const { data, error } = await sb.from('lifeart_faqs').select('*').order('sort_order', { ascending: true });
  const tb = document.querySelector('#faq-table tbody');
  if (error || !data?.length) { tb.innerHTML = '<tr><td colspan="4">FAQ가 없습니다.</td></tr>'; return; }
  tb.innerHTML = data.map(f => `
    <tr>
      <td>${esc(f.question)}</td>
      <td>${f.is_published?'✔':'—'}</td>
      <td>${f.sort_order}</td>
      <td><button class="adm-btn" onclick='editFaq(${JSON.stringify(f)})'>수정</button>
          <button class="adm-btn danger" onclick="delFaq('${f.id}')">삭제</button></td>
    </tr>`).join('');
}
function openFaqEditor(){ document.getElementById('faq-editor').classList.add('open'); }
function closeFaqEditor(){
  document.getElementById('faq-editor').classList.remove('open');
  ['faq-id','faq-question','faq-answer'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('faq-sort').value='0'; document.getElementById('faq-published').checked=true;
}
function editFaq(f){
  document.getElementById('faq-id').value=f.id;
  document.getElementById('faq-question').value=f.question;
  document.getElementById('faq-answer').value=f.answer;
  document.getElementById('faq-sort').value=f.sort_order;
  document.getElementById('faq-published').checked=f.is_published;
  openFaqEditor();
}
async function saveFaq(){
  const id=document.getElementById('faq-id').value;
  const payload={ question:document.getElementById('faq-question').value.trim(),
    answer:document.getElementById('faq-answer').value.trim(),
    sort_order:parseInt(document.getElementById('faq-sort').value,10)||0,
    is_published:document.getElementById('faq-published').checked,
    tenant_id:TENANT_UUID, updated_at:new Date().toISOString() };
  if(!payload.question){ alert('질문을 입력하세요'); return; }
  const { error } = id
    ? await sb.from('lifeart_faqs').update(payload).eq('id',id)
    : await sb.from('lifeart_faqs').insert(payload);
  if(error){ alert('저장 실패: '+error.message); return; }
  closeFaqEditor(); loadFaqs();
}
async function delFaq(id){ if(!confirm('삭제하시겠습니까?'))return; await sb.from('lifeart_faqs').delete().eq('id',id); loadFaqs(); }

/* ── 보도자료 ── */
async function loadPress() {
  const { data, error } = await sb.from('lifeart_press').select('*')
    .order('pinned', { ascending: false }).order('published_on', { ascending: false, nullsFirst: false });
  const tb = document.querySelector('#press-table tbody');
  if (error || !data?.length) { tb.innerHTML = '<tr><td colspan="6">보도자료가 없습니다.</td></tr>'; return; }
  tb.innerHTML = data.map(p => `
    <tr>
      <td>${esc(p.title)}</td>
      <td>${esc(p.outlet)||'—'}</td>
      <td>${p.published_on || '—'}</td>
      <td>${p.is_published?'✔':'—'}</td>
      <td>${p.pinned?'📌':'—'}</td>
      <td><button class="adm-btn" onclick='editPress(${JSON.stringify(p)})'>수정</button>
          <button class="adm-btn danger" onclick="delPress('${p.id}')">삭제</button></td>
    </tr>`).join('');
}
function openPressEditor(){ document.getElementById('press-editor').classList.add('open'); }
function closePressEditor(){
  document.getElementById('press-editor').classList.remove('open');
  ['press-id','press-title','press-outlet','press-date','press-summary','press-link'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('press-pinned').checked=false; document.getElementById('press-published').checked=true;
}
function editPress(p){
  document.getElementById('press-id').value=p.id;
  document.getElementById('press-title').value=p.title;
  document.getElementById('press-outlet').value=p.outlet||'';
  document.getElementById('press-date').value=p.published_on||'';
  document.getElementById('press-summary').value=p.summary||'';
  document.getElementById('press-link').value=p.link_url||'';
  document.getElementById('press-pinned').checked=p.pinned;
  document.getElementById('press-published').checked=p.is_published;
  openPressEditor();
}
async function savePress(){
  const id=document.getElementById('press-id').value;
  const payload={ title:document.getElementById('press-title').value.trim(),
    outlet:document.getElementById('press-outlet').value.trim(),
    published_on:document.getElementById('press-date').value||null,
    summary:document.getElementById('press-summary').value.trim(),
    link_url:document.getElementById('press-link').value.trim()||null,
    pinned:document.getElementById('press-pinned').checked,
    is_published:document.getElementById('press-published').checked,
    tenant_id:TENANT_UUID, updated_at:new Date().toISOString() };
  if(!payload.title){ alert('제목을 입력하세요'); return; }
  const { error } = id
    ? await sb.from('lifeart_press').update(payload).eq('id',id)
    : await sb.from('lifeart_press').insert(payload);
  if(error){ alert('저장 실패: '+error.message); return; }
  closePressEditor(); loadPress();
}
async function delPress(id){ if(!confirm('삭제하시겠습니까?'))return; await sb.from('lifeart_press').delete().eq('id',id); loadPress(); }
</script>
