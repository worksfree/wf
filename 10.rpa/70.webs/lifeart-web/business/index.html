<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>비즈니스 — LifeArt</title>

</head>
<body>

<div id="site-header"></div>

<div class="page-hero">
  <div class="kicker">Business</div>
  <h1>기업·단체 제휴</h1>
</div>

<div class="content-section">
  <p class="guide-lead">
    LifeArt는 25년간 다양한 <strong>기업·단체 행사</strong>의 앨범과 액자를 제작해왔습니다.
    행사 성격에 맞춘 제휴 프로그램을 제안드립니다.
  </p>
  <div class="guide-figure"><img src="/assets/img/biz-hero-1.jpg" alt="기업·단체 제휴"></div>

  <div class="product-grid">
    <a href="/business/wedding/" class="product-card">
      <div class="thumb" style="background-image:url('/assets/img/biz-wedding-1.jpg');"></div>
      <div class="body"><h3>웨딩 · 돌잔치 패키지</h3><p>예식장·스튜디오 제휴, 현장 즉석 앨범·액자.</p></div>
    </a>
    <a href="/business/travel-golf/" class="product-card">
      <div class="thumb" style="background-image:url('/assets/img/biz-travel-1.jpg');"></div>
      <div class="body"><h3>여행사 · 골프 · 산악회</h3><p>단체 모임의 추억을 즉석 삽입식 앨범으로.</p></div>
    </a>
    <a href="/business/kiosk/" class="product-card">
      <div class="thumb" style="background-image:url('/assets/img/biz-kiosk-1.png');"></div>
      <div class="body"><h3>키오스크 제휴 <span class="badge hot">NEW</span></h3><p>특허 기반 O2O 무인 키오스크 설치 제휴.</p></div>
    </a>
    <a href="/business/inquiry/" class="product-card">
      <div class="thumb" style="background-image:url('/assets/img/biz-hero-1.jpg');"></div>
      <div class="body"><h3>제휴 문의</h3><p>제휴 유형·규모·일정을 남겨주세요.</p></div>
    </a>
  </div>

  <div class="guide-cta">
    <a href="/business/inquiry/" class="btn-primary" style="background:var(--muted-gold);color:var(--deep-charcoal);">제휴·상담 문의하기</a>
  </div>
</div>

<div id="site-footer"></div>
