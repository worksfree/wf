<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제휴 문의 — LifeArt</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="page-hero">
  <div class="kicker">Business · 기업·단체 제휴</div>
  <h1>제휴 문의</h1>
</div>

<div class="content-section">
  <p class="guide-lead">
    웨딩·단체·키오스크 등 제휴 유형과 예상 규모, 희망 일정을 남겨주시면 담당자가 확인 후 연락드립니다.
  </p>
  <div style="display:flex; justify-content:center;">
    <form class="form-box" id="partnership-form" style="max-width:520px; width:100%;" onsubmit="event.preventDefault(); submitInquiry('partnership', this, 'partnership-msg');">
      <div class="form-row">
        <label>업체명 / 담당자명</label>
        <input type="text" name="name" required placeholder="예) LifeArt 웨딩홀 / 홍길동">
      </div>
      <div class="form-row">
        <label>연락처</label>
        <input type="tel" name="phone" required placeholder="010-0000-0000">
      </div>
      <div class="form-row">
        <label>이메일 (선택)</label>
        <input type="email" name="email" placeholder="example@company.com">
      </div>
      <div class="form-row">
        <label>제휴 문의 내용</label>
        <textarea name="message" required placeholder="제휴 유형, 예상 규모, 희망 일정 등을 적어주세요."></textarea>
      </div>
      <button type="submit" class="form-submit">문의 접수</button>
      <div class="form-msg" id="partnership-msg"></div>
    </form>
  </div>
</div>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/config.js"></script>
<script src="/assets/dev-toolkit.js"></script>
<script src="/assets/auth.js"></script>
<script src="/assets/forms.js"></script>
<script src="/assets/layout.js"></script>
</body>
</html>
