<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고객지원 — LifeArt</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="page-hero">
  <div class="kicker">Support</div>
  <h1>고객지원</h1>
</div>

<div class="content-section">
  <h2 id="notice">공지사항</h2>
  <div id="notice-list"><div class="placeholder-box">불러오는 중...</div></div>

  <h2 id="faq" style="margin-top:40px;">자주 묻는 질문</h2>
  <div id="faq-list"><div class="placeholder-box">불러오는 중...</div></div>

  <h2 id="qna" style="margin-top:40px;">1:1 문의</h2>
  <form class="form-box" id="qna-form" onsubmit="event.preventDefault(); submitInquiry('qna', this, 'qna-msg');">
    <div class="form-row"><label>이름</label><input type="text" name="name" required></div>
    <div class="form-row"><label>연락처</label><input type="tel" name="phone" required placeholder="010-0000-0000"></div>
    <div class="form-row"><label>이메일 (선택)</label><input type="email" name="email"></div>
    <div class="form-row"><label>문의 내용</label><textarea name="message" required></textarea></div>
    <button type="submit" class="form-submit">문의 접수</button>
    <div class="form-msg" id="qna-msg"></div>
  </form>

  <h2 id="estimate" style="margin-top:40px;">견적 문의</h2>
  <form class="form-box" id="estimate-form" onsubmit="event.preventDefault(); submitInquiry('estimate', this, 'estimate-msg');">
    <div class="form-row"><label>이름</label><input type="text" name="name" required></div>
    <div class="form-row"><label>연락처</label><input type="tel" name="phone" required placeholder="010-0000-0000"></div>
    <div class="form-row"><label>이메일 (선택)</label><input type="email" name="email"></div>
    <div class="form-row"><label>희망 상품 · 수량 · 일정</label><textarea name="message" required placeholder="예) VIP 앨범 Tier A, 30권, 8월 초 필요"></textarea></div>
    <button type="submit" class="form-submit">견적 요청</button>
    <div class="form-msg" id="estimate-msg"></div>
  </form>

  <div class="placeholder-box" style="margin-top:40px;">출고 일정표는 준비 중입니다.</div>
</div>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/config.js"></script>
<script src="/assets/dev-toolkit.js"></script>
<script src="/assets/auth.js"></script>
<script src="/assets/forms.js"></script>
<script src="/assets/layout.js"></script>
<script>
document.addEventListener('layout:ready', loadSupportContent);

async function loadSupportContent() {
  // 공지사항
  const nEl = document.getElementById('notice-list');
  const { data: notices, error: nErr } = await sb.from('lifeart_notices')
    .select('title, body, created_at, pinned')
    .order('pinned', { ascending: false }).order('created_at', { ascending: false });
  if (nErr || !notices || !notices.length) {
    nEl.innerHTML = '<div class="placeholder-box">등록된 공지사항이 없습니다.</div>';
  } else {
    nEl.innerHTML = notices.map(n => `
      <div class="faq-item">
        <div class="faq-q" onclick="this.parentElement.classList.toggle('open')">
          ${n.pinned ? '📌 ' : ''}${esc(n.title)}
          <span class="d" style="margin-left:auto;font-size:11px;color:var(--text-light);">${new Date(n.created_at).toLocaleDateString('ko-KR')}</span>
          <span class="arrow">▾</span>
        </div>
        <div class="faq-a" style="white-space:pre-line;">${esc(n.body)}</div>
      </div>`).join('');
  }

  // FAQ
  const fEl = document.getElementById('faq-list');
  const { data: faqs, error: fErr } = await sb.from('lifeart_faqs')
    .select('question, answer, sort_order').order('sort_order', { ascending: true });
  if (fErr || !faqs || !faqs.length) {
    fEl.innerHTML = '<div class="placeholder-box">등록된 FAQ가 없습니다.</div>';
  } else {
    fEl.innerHTML = faqs.map(f => `
      <div class="faq-item">
        <div class="faq-q" onclick="this.parentElement.classList.toggle('open')">${esc(f.question)} <span class="arrow">▾</span></div>
        <div class="faq-a" style="white-space:pre-line;">${esc(f.answer)}</div>
      </div>`).join('');
  }
}

function esc(s) {
  return (s || '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}
</script>
</body>
</html>
