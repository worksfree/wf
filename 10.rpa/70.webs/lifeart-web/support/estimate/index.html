<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>견적 문의 — LifeArt</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="page-hero">
  <div class="kicker">Support</div>
  <h1>견적 문의</h1>
</div>

<div class="content-section">
  <p class="guide-lead">희망 상품·수량·일정을 남겨주시면 맞춤 견적을 안내해 드립니다.</p>
  <div style="display:flex; justify-content:center;">
    <form class="form-box" id="estimate-form" style="max-width:520px; width:100%;" onsubmit="event.preventDefault(); submitInquiry('estimate', this, 'estimate-msg');">
      <div class="form-row"><label>이름</label><input type="text" name="name" required></div>
      <div class="form-row"><label>연락처</label><input type="tel" name="phone" required placeholder="010-0000-0000"></div>
      <div class="form-row"><label>이메일 (선택)</label><input type="email" name="email"></div>
      <div class="form-row"><label>희망 상품 · 수량 · 일정</label><textarea name="message" required placeholder="예) VIP 앨범 Tier A, 30권, 8월 초 필요"></textarea></div>
      <button type="submit" class="form-submit">견적 요청</button>
      <div class="form-msg" id="estimate-msg"></div>
    </form>
  </div>
</div>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/config.js"></script>
<script src="/assets/dev-toolkit.js"></script>
<script src="/assets/auth.js"></script>
<script src="/assets/forms.js"></script>
<script src="/assets/layout.js"></script>
</body>
</html>
