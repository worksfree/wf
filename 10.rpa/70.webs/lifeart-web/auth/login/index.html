<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 — LifeArt</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="page-hero">
  <div class="kicker">My Account</div>
  <h1>로그인</h1>
</div>

<div class="content-section" style="display:flex; justify-content:center;">
  <form class="form-box" id="login-form" onsubmit="event.preventDefault(); lifeartLogin(this.email.value.trim(), this.password.value, document.getElementById('login-msg'));">
    <div class="form-row"><label>이메일</label><input type="email" name="email" required></div>
    <div class="form-row"><label>비밀번호</label><input type="password" name="password" required></div>
    <button type="submit" class="form-submit">로그인</button>
    <div class="form-msg" id="login-msg"></div>
    <div class="social-login needs-stage-2">
      <div class="social-divider"><span>또는 소셜 계정으로</span></div>
      <button type="button" class="btn-social btn-google" onclick="signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Google로 계속하기
      </button>
      <button type="button" class="btn-social btn-kakao" onclick="signInWithKakao()">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#191600" d="M12 3C6.48 3 2 6.58 2 11c0 2.79 1.86 5.24 4.68 6.64-.15.53-.95 3.29-.98 3.51 0 0-.02.16.09.22.11.06.24.01.24.01.31-.04 3.6-2.35 4.17-2.76.58.08 1.18.13 1.8.13 5.52 0 10-3.58 10-8S17.52 3 12 3z"/></svg>
        카카오로 계속하기
      </button>
    </div>
    <p style="text-align:center; font-size:13px; color:var(--text-mid); margin-top:16px;">
      아직 회원이 아니신가요? <a href="/auth/signup/" style="color:var(--accent); font-weight:600;">회원가입</a>
    </p>
  </form>
</div>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/config.js"></script>
<script src="/assets/dev-toolkit.js"></script>
<script src="/assets/auth.js"></script>
<script src="/assets/layout.js"></script>
</body>
</html>
