<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 — LifeArt</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="page-hero">
  <div class="kicker">My Account</div>
  <h1>로그인</h1>
</div>

<div class="content-section" style="display:flex; justify-content:center;">
  <form class="form-box" id="login-form" onsubmit="event.preventDefault(); lifeartLogin(this.email.value.trim(), this.password.value, document.getElementById('login-msg'));">
    <div class="form-row"><label>이메일</label><input type="email" name="email" required></div>
    <div class="form-row"><label>비밀번호</label><input type="password" name="password" required></div>
    <button type="submit" class="form-submit">로그인</button>
    <div class="form-msg" id="login-msg"></div>
    <p style="text-align:center; font-size:13px; color:var(--text-mid); margin-top:16px;">
      아직 회원이 아니신가요? <a href="/auth/signup/" style="color:var(--accent); font-weight:600;">회원가입</a>
    </p>
  </form>
</div>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/config.js"></script>
<script src="/assets/auth.js"></script>
<script src="/assets/layout.js"></script>
</body>
</html>
