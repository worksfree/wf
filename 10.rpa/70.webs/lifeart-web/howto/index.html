<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제작과정 — LifeArt</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="page-hero">
  <div class="kicker">How To</div>
  <h1>제작과정</h1>
</div>

<div class="content-section">
  <h2 style="text-align:center;">주문 흐름</h2>
  <div class="flow">
    <div class="flow-step">
      <div class="flow-box"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></div>
      <div class="flow-num">1</div><div class="flow-label">주문</div>
    </div>
    <div class="flow-arrow">▶</div>
    <div class="flow-step">
      <div class="flow-box"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="1.5"/><path d="M8 20h8M12 17v3"/><path d="M9 10l2 2 4-4"/></svg></div>
      <div class="flow-num">2</div><div class="flow-label">페이지 데이터 제작</div>
    </div>
    <div class="flow-arrow">▶</div>
    <div class="flow-step">
      <div class="flow-box"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-1.5-1.2-4-2-6.5-2C4 4 3 4.3 3 4.3v13S4 17 5.5 17s5 .8 6.5 2c1.5-1.2 4-2 6.5-2s2.5.3 2.5.3v-13S20 4 18.5 4 13.5 4.8 12 6z"/><path d="M12 6v14"/></svg></div>
      <div class="flow-num">3</div><div class="flow-label">인쇄 · 제본</div>
    </div>
    <div class="flow-arrow">▶</div>
    <div class="flow-step">
      <div class="flow-box"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 5h13v11H1zM14 8h4l3 3v5h-7"/><circle cx="5.5" cy="18.5" r="1.8"/><circle cx="17.5" cy="18.5" r="1.8"/></svg></div>
      <div class="flow-num">4</div><div class="flow-label">발송 · 납품</div>
    </div>
  </div>
  <p style="text-align:center; color:var(--text-light); font-size:13px; margin-bottom:8px;">주문부터 납품까지 4단계로 진행됩니다.</p>

  <h2 style="text-align:center; margin-top:44px;">제작 가이드</h2>
  <p style="text-align:center; color:var(--text-light); font-size:13px; margin-bottom:20px;">상품별 상세 제작 과정을 확인하세요.</p>
  <div class="product-grid">
    <a href="/howto/instant-album/" class="product-card">
      <div class="thumb" style="background-image:url('/assets/img/howto-instant-1.jpg');"></div>
      <div class="body"><h3>삽입식 앨범 만들기</h3><p>현장에서 즉석으로 완성하는 기념앨범 제작 과정.</p></div>
    </a>
    <a href="/howto/vip/" class="product-card">
      <div class="thumb" style="background-image:url('/assets/img/howto-vip-1.jpg');"></div>
      <div class="body"><h3>VIP 앨범 상담 프로세스</h3><p>전담 상담으로 완성하는 프리미엄 가죽 앨범.</p></div>
    </a>
    <a href="/howto/frame/" class="product-card">
      <div class="thumb" style="background-image:url('/assets/img/howto-frame-1.png');"></div>
      <div class="body"><h3>액자 맞춤 제작</h3><p>시리즈·사이즈 선택부터 배송까지 3단계.</p></div>
    </a>
  </div>
</div>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/config.js"></script>
<script src="/assets/dev-toolkit.js"></script>
<script src="/assets/auth.js"></script>
<script src="/assets/layout.js"></script>
</body>
</html>
